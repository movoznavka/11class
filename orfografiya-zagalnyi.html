<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Орфографія · Загальний тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#D0E9FC;
    --bg-soft:#E4F2FC;
    --card:#FFFFFF;
    --ink:#13213B;
    --ink-soft:#6478A0;
    --line: rgba(19,33,59,0.08);

    --c1-a:#A5B4FC; --c1-b:#6366F1; --c1-sh: rgba(99,102,241,0.45);
    --c3-a:#5FE0A8; --c3-b:#17A863; --c3-sh: rgba(23,168,99,0.4);
    --c2-b:#E5484D;

    --correct-bg:#E6F8EE;
    --correct-ink:#128A54;
    --wrong-bg:#FDECEC;
    --wrong-ink:#D8393E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 64px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    margin-bottom:22px;
    border-bottom:1.5px solid rgba(19,33,59,0.14);
  }
  .kicker{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.55;
  }
  .kicker.tag{opacity:.4;}

  .review-banner{
    display:none;
    align-items:center;
    gap:8px;
    background:#FFF4E0;
    color:#8A5A00;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px 16px;
    border-radius:14px;
    margin-bottom:16px;
  }
  .review-banner.show{display:flex;}

  h1{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:clamp(26px,6vw,38px);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 8px;
    text-transform:uppercase;
  }
  h1 .hl{color:var(--c1-b);}
  .sub{color:var(--ink-soft);font-size:15px;max-width:50ch;margin:0 0 18px;font-weight:500;}

  /* --- Topic / subtopic tabs (more subtopics will be added here later) --- */
  .topic-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:22px;
    scrollbar-width:none;
  }
  .topic-tabs::-webkit-scrollbar{display:none;}
  .topic-tab{
    flex:0 0 auto;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    white-space:nowrap;
    background:rgba(255,255,255,0.55);
    color:var(--ink-soft);
  }
  .topic-tab.active{
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));
    color:#fff;
    box-shadow:0 10px 20px -10px var(--c1-sh);
    cursor:default;
  }
  .topic-tab[disabled]{
    opacity:.45;
    cursor:not-allowed;
  }

  .card{
    background:var(--card);
    border-radius:28px;
    padding:30px 26px;
    box-shadow: 0 20px 44px -28px rgba(19,33,59,0.35);
  }

  .progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .qnum{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
  }
  .score{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    color:var(--c3-b);
    background:var(--correct-bg);
    padding:6px 13px;
    border-radius:999px;
  }

  .segbar{display:flex;gap:3px;margin-bottom:22px;flex-wrap:wrap;}
  .seg{
    flex:1;
    min-width:6px;
    height:6px;
    border-radius:999px;
    background:var(--bg-soft);
    cursor:pointer;
  }
  .seg.current{background:var(--c1-b);}
  .seg.done-correct{background:var(--c3-b);}
  .seg.done-wrong{background:var(--c2-b);}

  .qtext{
    font-family:'Manrope',sans-serif;
    font-size:19px;
    font-weight:700;
    line-height:1.4;
    margin:0 0 20px;
    letter-spacing:-0.005em;
  }
  .qtext u{ text-decoration-thickness:2px; text-underline-offset:2px; }

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;
    align-items:center;
    gap:13px;
    text-align:left;
    width:100%;
    padding:9px 14px 9px 9px;
    border-radius:18px;
    border:none;
    background:var(--bg-soft);
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    transition:transform .12s ease, background .15s ease;
  }
  .opt:hover{transform:translateY(-1px);}
  .opt[disabled]{cursor:default;}
  .opt[disabled]:hover{transform:none;}
  .opt u{ text-decoration-thickness:2px; text-underline-offset:2px; }

  /* --- glass letter tile: uniform accent color, translucent, blurred, like iOS icons --- */
  .tile{
    position:relative;
    width:32px;height:32px;min-width:32px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:13.5px;
    color:var(--c1-b);
    background: linear-gradient(150deg, rgba(255,255,255,0.75), rgba(108,140,255,0.22));
    backdrop-filter: blur(6px) saturate(160%);
    -webkit-backdrop-filter: blur(6px) saturate(160%);
    border:1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 12px -7px var(--c1-sh), inset 0 1px 1px rgba(255,255,255,0.8);
    overflow:visible;
  }
  .tile > span{position:relative;z-index:1;}

  .badge{
    position:absolute;
    top:-5px;right:-5px;
    width:16px;height:16px;
    border-radius:50%;
    border:2px solid var(--card);
    display:flex;align-items:center;justify-content:center;
    font-size:9.5px;
    font-weight:800;
    color:#fff;
    z-index:2;
  }
  .badge.ok{background:var(--c3-b);}
  .badge.no{background:var(--c2-b);}

  .opt.correct{background:var(--correct-bg);}
  .opt.wrong{background:var(--wrong-bg);}
  .opt.dim{opacity:.5;}

  .feedback{
    margin-top:16px;
    padding:13px 16px;
    border-radius:16px;
    font-size:14.5px;
    font-weight:600;
    display:none;
    align-items:center;
    gap:9px;
  }
  .feedback.show{display:flex;}
  .feedback.ok{background:var(--correct-bg);color:var(--correct-ink);}
  .feedback.bad{background:var(--wrong-bg);color:var(--wrong-ink);}
  .feedback b{font-family:'Manrope',sans-serif;}

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
  }
  .btn{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:13px;
    padding:12px 22px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .btn.primary{
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));
    color:#fff;
    box-shadow:0 10px 20px -8px var(--c1-sh);
  }
  .btn.ghost{background:transparent;color:var(--ink-soft);}
  .btn:disabled{opacity:.3;cursor:default;box-shadow:none;}
  .btn.small{
    font-size:12px;
    padding:8px 4px;
    opacity:.55;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .btn.small:hover{opacity:.85;}
  .reset-row{
    text-align:center;
    margin-top:6px;
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }

  .done-screen{text-align:center;padding:16px 0;}
  .done-screen .ring{
    width:120px;height:120px;
    margin:0 auto 18px;
    border-radius:50%;
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));
    box-shadow:0 16px 30px -12px var(--c1-sh);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .done-screen .ring::before{
    content:'';
    position:absolute;
    top:6px;left:10px;right:10px;
    height:46%;
    border-radius:50% 50% 60% 60%;
    background:linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(255,255,255,0));
  }
  .done-screen .big{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:30px;
    color:#fff;
    position:relative;
    z-index:1;
  }
  .done-screen .send-status{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-top:10px;
    min-height:18px;
  }
  .done-screen .send-status.ok{color:var(--correct-ink);}
  .done-screen .send-status.bad{color:var(--wrong-ink);}

  .name-screen{padding:6px 0;}
  .name-screen label{
    display:block;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:14px;
    margin-bottom:10px;
    color:var(--ink);
  }
  .name-screen input{
    width:100%;
    padding:14px 16px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:var(--bg-soft);
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    outline:none;
    margin-bottom:18px;
  }
  .name-screen input:focus{border-color:var(--c1-b);}

  footer{
    text-align:center;
    margin-top:22px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }

  /* ===================== DRAWING / TEACHER MODE ===================== */
  #drawCanvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:9998;
    touch-action:none;
    pointer-events:none;
  }
  #drawCanvas.active{
    pointer-events:auto;
  }

  #drawToggleBtn{
    position:fixed;
    right:20px;
    bottom:20px;
    width:58px;height:58px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.5);
    background:
      linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),
      linear-gradient(155deg,var(--c1-a),var(--c1-b));
    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    box-shadow:
      0 14px 28px -10px var(--c1-sh),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -6px 10px -4px rgba(0,0,0,0.15);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:9999;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .2s ease, box-shadow .2s ease;
  }
  #drawToggleBtn svg{
    width:24px;height:24px;
    display:block;
    transition:transform .25s ease, opacity .15s ease;
  }
  #drawToggleBtn:active{transform:scale(0.90);}
  #drawToggleBtn.on{
    background:
      linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),
      linear-gradient(155deg,#FF8A65,var(--c2-b));
    box-shadow:
      0 14px 28px -10px rgba(229,72,77,0.55),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -6px 10px -4px rgba(0,0,0,0.15);
  }
  #drawToggleBtn.on svg{ transform:rotate(90deg); }

  #drawToolbar{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%) translateY(130%) scale(0.94);
    opacity:0;
    display:flex;
    align-items:center;
    gap:12px;
    background:
      linear-gradient(150deg, rgba(255,255,255,0.6), rgba(255,255,255,0.15));
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,0.7);
    padding:9px 16px;
    border-radius:999px;
    box-shadow:
      0 24px 48px -20px rgba(19,33,59,0.45),
      inset 0 1px 1px rgba(255,255,255,0.9);
    z-index:9999;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
    pointer-events:none;
  }
  #drawToolbar.show{
    transform:translateX(-50%) translateY(0) scale(1);
    opacity:1;
    pointer-events:auto;
  }
  .swatch{
    position:relative;
    width:25px;height:25px;
    border-radius:50%;
    border:none;
    box-shadow:
      0 3px 8px -2px rgba(19,33,59,0.35),
      inset 0 1px 1px rgba(255,255,255,0.5);
    cursor:pointer;
    padding:0;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .swatch::after{
    content:'';
    position:absolute;
    inset:-4px;
    border-radius:50%;
    border:2px solid var(--ink);
    opacity:0;
    transform:scale(0.7);
    transition:opacity .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .swatch.selected{ transform:scale(1.08); }
  .swatch.selected::after{ opacity:1; transform:scale(1); }
  .tool-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.5);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .tool-btn svg{ width:16px; height:16px; }
  .tool-btn .dot{
    border-radius:50%;
    background:currentColor;
  }
  #thinBtn .dot{ width:6px; height:6px; }
  #thickBtn .dot{ width:12px; height:12px; }
  .tool-btn.selected{
    background:var(--c1-b);
    color:#fff;
    transform:scale(1.06);
  }
  .tool-sep{
    width:1px;
    height:22px;
    background:rgba(19,33,59,0.14);
  }

  @media (max-width:480px){
    #drawToolbar{
      max-width:94vw;
      overflow-x:auto;
      padding:8px 13px;
      gap:9px;
    }
    .swatch{width:21px;height:21px;}
    .tool-btn{width:30px;height:30px;}
    .tool-btn svg{width:14px;height:14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="kicker">Орфографія · Усі теми</div>
    <div class="kicker tag" id="totalTag">62 завдань</div>
  </div>

  <div class="review-banner" id="reviewBanner">👀 Режим перегляду відповідей учня</div>

  <h1>Загальний <span class="hl">тест</span> з орфографії</h1>
  <p class="sub">30 випадкових завдань із усіх тем орфографії — щоразу інша добірка. Формат НМТ.</p>

  <div class="card">
    <div id="quizArea"></div>
  </div>

  <footer>@movoznavka</footer>
</div>

<!-- ==== Малювання поверх екрана (для вчителя) ==== -->
<canvas id="drawCanvas"></canvas>
<button id="drawToggleBtn" title="Малювати">
  <svg id="drawIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 20L4.6 16.6C4.7 15.9 5.03 15.26 5.55 14.79L15.3 5.7C16.09 4.96 17.34 4.99 18.09 5.78L18.34 6.04C19.08 6.83 19.04 8.08 18.25 8.81L8.5 17.9C8 18.37 7.37 18.66 6.7 18.75L4 20Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M13.5 7.5L16.5 10.3" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
</button>
<div id="drawToolbar">
  <button class="swatch selected" style="background:#E5484D" data-color="#E5484D"></button>
  <button class="swatch" style="background:#3355EE" data-color="#3355EE"></button>
  <button class="swatch" style="background:#17A863" data-color="#17A863"></button>
  <button class="swatch" style="background:#13213B" data-color="#13213B"></button>
  <div class="tool-sep"></div>
  <button class="tool-btn selected" id="thinBtn" title="Тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thickBtn" title="Товста лінія"><span class="dot"></span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="eraserBtn" title="Ластик">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.5 13.5L10.5 21.5H5.5L2.5 18.5C2.11 18.11 2.11 17.48 2.5 17.09L13.5 6.09C13.89 5.7 14.52 5.7 14.91 6.09L18.5 9.68C19.5 10.68 19.5 12.5 18.5 13.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 13.5L15 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="tool-btn" id="clearBtn" title="Очистити все">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 7H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M9.5 7V4.8C9.5 4.36 9.86 4 10.3 4H13.7C14.14 4 14.5 4.36 14.5 4.8V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 7L7.7 18.6C7.75 19.42 8.42 20 9.24 20H14.76C15.58 20 16.25 19.42 16.3 18.6L17 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10.3 10.5V16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M13.7 10.5V16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<script>
// Загальний банк завдань з орфографії — зібрано з усіх тем (апостроф,
// чергування, іншомовні слова, м'який знак, НЕ з різними частинами мови,
// подвоєння, префікси, складні слова, суфікси тощо).
// Слово в подвійних квадратних дужках, напр. [[а]] всередині опції, підкреслюється автоматично.
const POOL = [
{q:"Апостроф треба писати на місці пропуску в слові", opts:["дзв..якнути","торф..яний","св..ященник","поцв..яхований"], a:1},
  {q:"Апостроф треба писати на місці пропуску в слові", opts:["з..економити","з..орієнтувати","з..юрмитися","з..агітувати"], a:2},
  {q:"Апостроф НЕ треба писати на місці пропуску в слові", opts:["арф..яр","верф..ю","стерв..ятник","горохв..яний"], a:3},
  {q:"Апостроф треба писати на місці пропуску в рядку", opts:["Тішило зір ряхтіння налитих сонцем медв..яних грон.","Бджоли сонячним дощем падають на духм..яний лан.","Озеро оточене зеленими, як рутв..яний вінок, берегами.","Степ мов палав під тим світом, зв..ялена трава хилилася додолу."], a:3},
  {q:"Апостроф на місці пропуску треба писати в усіх словах рядка", opts:["голуб..ятня, з..ясовувати, р..яска","розм..якшити, кучер..явий, б..єш","Мар..яна, без..ядерний, м..язовий","чебер..яти, слов..яни, тьм..яніти"], a:2},

  {q:"Правило чергування у-в порушено в реченні", opts:["Напевно, у середу буде дощ.","Може, в Ужгороді побачимося?","Сонце усюди: у небі, на землі…","Так, у тата день народження."], a:2},
  {q:"Правило чергування у-в порушено в реченні", opts:["Перепишіть речення, впишіть пропущені букви.","Інно, у кого інформація про поїздку за кордон?","Недалеко від нашого дому, у гаю, соловей співає.","Автомобілі живуть на землі, а літаки — у небі."], a:0},
  {q:"Прочитайте речення (цифра позначає пропущену букву у або в). «Вівса, пшениці, ячмені — (1)се це злилося (2) одну могутню хвилю; вона (3)се топить і забирає (4) полон». Букву у треба писати на місці цифри", opts:["1","2","3","4"], a:0},

  {q:"Правило чергування і-й порушено в рядку", opts:["іду до школи, ми й не знали","кавун і диня, ґава й горобець","сосна й ялинка, кава й чай","читати й писати, їв і пив"], a:2},
  {q:"Правило чергування і-й порушено в реченні", opts:["Сонце вийшло й знову заховалося за хмари.","Може, й ти приєднаєшся до нашого проєкту?","І нарешті розпочався такий очікуваний день.","Мабуть, і наша команда поїде на змагання."], a:1},
  {q:"Прочитайте речення (цифра позначає пропущену букву і або й). «(1) знову нічого. Навіть сліди людини затерті (2) закриті: поле сховало стежки (3) дороги. Воно лише котить зелені хвилі (4) хлюпає ними в краї неба». Букву і треба писати на місці цифри", opts:["1","2","3","4"], a:0},
  {q:"Помилку допущено в рядку", opts:["ми в Києві, ти в Світловодську, я в Мелітополі","у нашому дворі, у сестриній кімнаті, у тому краю","читати вголос, покличте вчителя, подивилися вгору","прийдеш уночі, читав упродовж години, ріж упоперек"], a:0},

  {q:"Помилку допущено в реченні", opts:["В умілого й долото рибу ловить.","Хліб і сонце — найцінніше у світі.","Заліз у багатство — забув і братство.","І будень, і неділя — все ледачому безділля."], a:3},

  {q:"Правил чергування у-в дотримано в усіх реченнях, ОКРІМ", opts:["Вірю я в правду свого ідеалу.","Була весна, удень пригрівало сонце.","Яблуневі сади стояли вмиті росою.","Яблуко м'яко скотилося у траву.","Уже доспіли яблука, груші."], a:3},
  {q:"Правил чергування у-в дотримано в усіх рядках, ОКРІМ", opts:["плавати в річці, закінчив у суботу","приїхав в Одесу, запитай у батька","успіхи в роботі, навчатися у ліцеї","відпочили в Італії, приїзд у Польщу","служити в армії, галявина у квітах"], a:2},
  {q:"Прочитайте речення. «Мово моя, (1)тобі мудрість віків, пам'ять тисячоліть, розрада (2) хвилину смутку, зойк матерів (3) годину лиху, переможний гук лицарів (4) днину побідну, пісня серця дівочого (5) коханні своїм». Літеру у треба писати замість усіх цифр, ОКРІМ", opts:["1","2","3","4","5"], a:4},
  {q:"Прочитайте речення. «Вузька дорога потяглася (1)гору між глинистими крутосхилами, (2)кризими чагарниками; попереду (3)поперек шляху синіло небо, позаду (4)простотими на низинах сяяла річка, а (5)подовж неї табунилося чепурними хатами село». Літеру в треба писати замість усіх цифр, ОКРІМ", opts:["1","2","3","4","5"], a:1},
  {q:"Правил чергування і-й дотримано в усіх реченнях, ОКРІМ", opts:["Непроглядний гай стоїть, тихий і спокійний.","Бульвари і парки вкриваються жовтим листям.","Небо спохмурніло й насупилося, стало сірим.","Квіти майже відцвіли й розсіяли своє насіння.","Знявся вітер — і дерева скинули останнє вбрання."], a:1},
  {q:"Правил чергування і-й дотримано в усіх рядках, ОКРІМ", opts:["найбільш ймовірний, швидко йти","спостерігає і передає, річки й озера","фрукти й овочі, батьки й діди","тополя і явір, темрява і світло","правда і кривда, сміх і сльози"], a:0},
  {q:"Прочитайте речення. «Далеко (1) лунко оддавався голос солов'я, (2) бриніла в ньому пиха (3) погорда пестуна (4) улюбленця густого (5) буйного лісу». Літеру й треба писати замість усіх цифр, ОКРІМ", opts:["1","2","3","4","5"], a:1},
  {q:"Прочитайте речення. «Як залле Вербівку літнє сонце (1) засипле її золотом (2) сріблом сонячне марево, то вся кучерява рослина здається залитою зеленими хвилями, що десь набігли з моря, (3) залили, (4) затопили її, (5) скам'яніли, піднявшись угору». Літеру і треба писати замість усіх цифр, ОКРІМ", opts:["1","2","3","4","5"], a:0},
  {q:"Прочитайте речення. «День від дня холоднішало, (1) пташки хутко збиралися великими зграями, дзвінко (2) галасливо прощалися з рідними полями (3) лісами, бо взимку тут (4) холодно для них, (5) з їжею важко». Літеру й треба писати замість обох цифр варіанта", opts:["1, 2","2, 3","3, 4","4, 5","1, 5"], a:1},

  {q:"Частку <b>не</b> треба писати разом з наступним словом у рядку", opts:["пісня не/мелодійна","досі не/завершена перевірка","питай не/старого, а бувалого","позбуватися не/веселих думок"], a:3},

  {q:"Частку <b>не</b> треба писати окремо з кожним наступним словом у рядку", opts:["не/зло, а добро; не/можна грішити","не/пащекуй; не/можливо працювати","не/зважай на грім; трапилося не/щастя","не/випитий мною сік; літати не/високо"], a:0},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у реченні", opts:["Пробачте поетам дивацтва не/злі.","Сонце накладає свої не/сміливі промені на землю.","Тільки мав талант не/позичений, а власний.","Ми на межі того часу, коли не/знане стане знаним."], a:2},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у реченні", opts:["Роби не/кревно, а певно.","Вересневе сонце не/помітно зайшло за потріскані хмари.","Слухаєш мамину пісню й відчуваєш її не/перевершену поетику.","Сонце ще було зовсім не/високо, степ дихав ранковою прохолодою."], a:0},
  {q:"Частку <b>не</b> треба писати разом з наступним словом у реченні", opts:["У чужому домі не/порядкуй.","Не/свинячим рилом лимон нюхати.","У нашім раї на землі нічого кращого не/має, як тая мати молодая.","Співа трава, ніким ще не/зім'ята, і вабить сном солодких таємниць."], a:2},
  {q:"Частку <b>не</b> треба писати разом з наступним словом у реченні", opts:["Хто не/має, легко обіцяє.","Не/сум, а жаль мене бере великий.","Не/борода робить чоловіка мудрим.","Лісом-бо йшов, кружляв не/самовито вогненний смерч."], a:3},

  {q:"НЕ ВЖИВАЮТЬ без <b>не</b> всі слова в рядку", opts:["небавом, небога, негідницький","ненавидіти, небуття, невдаха","нездара, нетерплячка, нещастя","негода, неуважність, немовля","неволити, недоліток, небезпека"], a:0},
  {q:"Частку <b>не</b> треба писати разом із наступним словом у варіанті", opts:["не/покоїтися про сина","ще не/завершена праця","не/довга, але цікава лекція","не/крутити носом","досі не/прочитана книжка"], a:0},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у варіанті", opts:["не/сила терпіти","не/досконалий твір","іти в не/пам'ять","не/довиконувати план","не/здужати задачу"], a:4},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у рядку", opts:["не/має лиця на ньому","не/одноразово повторювати","радість не/вимовна","не/святі горшки ліплять","не/досипати ночей"], a:3},
  {q:"Частку <b>не</b> треба писати разом із наступним словом у реченні", opts:["Не/знав сіромаха, що виросли крила.","Не/суворо на серці, не/гнівно.","Відчахнута гілка вмирає не/зразу.","Нам таких не/треба, що ніс дерють до неба.","Блідий ранок не/сміливо зазирнув у вікна."], a:4},
  {q:"Частку <b>не</b> треба писати разом із наступним словом у реченні", opts:["Я вже й пізніше, при дворі, у Парижі, шукав її у мармурі не/раз.","Не/спалося, а ніч як море.","Тільки те не/зрадить серце, що любити поклялось.","Ніч не/рухомо тишею бринить.","Не/варті сну казки колишні."], a:3},
  {q:"Частку <b>не</b> треба писати разом із наступним словом у реченні", opts:["Не/доведи, щоб розум задрімав.","Печаль виховує мене, не/дорікає.","Не/доженеш конем, що запізниш одним днем.","Глухий що не/дочує, то вигадає.","Не/нагодуєш коня — не/доїдеш і до пня."], a:3},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у реченні", opts:["А я й не/знала, що думки болять, коли душа і серце — безборонні.","Коли копають картоплю, ключ угорі журавлиний рідною мовою кличе у не/відомі краї.","Родина — тільки вбогий човен на не/вмолимих бурунах.","Надворі не/впевнено всміхався чудовий ранок.","Мій князю-соколе, не/має століть поміж нами."], a:0},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у реченні", opts:["Вже не/далеко той час, коли оксамитовим серпанком молодого листячка вкриються розлогі крони кленів.","Коли засне глибоко місто не/спокійним сном, вона приходить здалеку до мене.","Загула флейта, мов осіння не/погода під стріхою.","У гущавині лісу не/вгамовно витьохкували солов'ї, віщуючи прихід ранку.","Куди не/глянь — скрізь розвернулося, розпустилося, зацвіло пишним цвітом."], a:4},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у реченні", opts:["Микола був не/молодий хлопець, а чоловік із довгими вусами, з міцним станом, широкими плечима та міцними руками.","Широкою долиною, між двома рядами розложистих гір, тече по Васильківщині не/величка річка Раставиця.","То, певно, іншого роду краса, як гори: не/спокійна й повна перемін.","Не/свідомо, мимоволі тягнуло його під величну таємничу опіку.","Як справжній митець, він, не/зважаючи на позірну відчуженість від світу, був чутливий до всього, що відбувалося довкола."], a:0},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у реченні", opts:["В серцях у нас не/витончена мука, а радість голосиста і дзвінка.","Я закоханий палко, без міри у не/бачену вроду твою.","Народе мій, титане не/поборний, що небо підпирає голубе.","Ішли назустріч вічності і смерті дружини не/покірливих слов'ян.","Пройдеш ти, лишивши світлу не/вгамовану мені печаль."], a:0},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у реченні", opts:["І зустріч ця, приємна і не/ждана, нагадує мені забутий сон.","А ти була, як мрія, не/повторна, такою зроду не була ще ти.","І світ великий, не/озорий належить нам — тобі й мені.","І ми з тобою вже не в силі бути не/щасливими удвох.","Мені поля задумливо шептали свої ніким не/співані пісні."], a:4},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у реченні", opts:["Не/зв'язаний сніп — солома.","Затужилося так у не/свободі.","Лихий кухар або не/досолить, або пересолить.","Де багато кухарів, там собаки не/голодні.","У не/голодного на думці гульня, а в голодного — обід."], a:3},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у реченні", opts:["Поспішно, та не/доладно.","Соловей піснями не/ситий.","На вовка не/слава, а їсть овець Сава.","Хоч мороз і припікає, зате комарів не/має.","Де слова з ділом розходяться, там не/порядки водяться."], a:1},
  {q:"Частку <b>не</b> треба писати окремо з наступним словом у реченні", opts:["У польоти, ніким не/бачені, я спрямовую кораблі.","Регоче й гримить голубим океаном не/розтрачена радість моя.","Не/полоханий спокій над Києвом сонним дріма.","Хай падають із неба зорі, немов не/зібране зерно.","І довгий рік чекають марно рядки не/читаних книжок."], a:0},
  {q:"Допущено помилку в правописі частки <b>не</b> в рядку", opts:["У нас не бувало такого, щоб хто-небудь когось не послухався або підвів.","Ми не лукавили з тобою, ми просто йшли, у нас нема зерна неправди за собою.","Коли-не-коли заходив до житників, щоб не дуже набридати.","Я люблю тебе, друже, за те, що не можу тебе не любити.","Тоді ще не знав я, що все проходить, усе губиться в не впинній зміні подій."], a:4},
  {q:"Частку <b>не</b> треба писати окремо з кожним наступним словом у рядку", opts:["ще не/підкорені вершини; не/вивчене питання","лан не/засіяний; не/затоплена навесні місцина","не/опале листя; не/перекладений ніким текст","досі не/збудований дім; не/переборне бажання","зовсім не/відомий Вороний; не/захищений сад"], a:1},
  {q:"Частку <b>не</b> треба писати окремо з кожним наступним словом у рядку", opts:["плани не/здійснені; не/прогріта сонцем земля","не/заплетена, а розплетена коса; не/випитий сік","не/спростовані нею чутки; не/скопані ділянки","не/зважаючи на дощ; ще не/оголошені результати","ніким не/порушене питання; не/знайдені скарби"], a:0},
  {q:"Частку <b>не</b> треба писати разом із кожним наступним словом у рядку", opts:["не/политі вранці квіти; не/перевірені відомості","човен не/прив'язаний; не/обсаджений берег","не/вибілене полотно; не/вишитий, а витканий","не/посіяна батьком трава; не/доплетений тин","не/завершена робота; не/розчищені стежки"], a:4},
  {q:"Частку <b>не</b> треба писати разом із кожним наступним словом у рядку", opts:["ужити не/гайних заходів; не/треба чекати","зупинився не/випадково; ріка не/глибока","писав не/думаючи; розгулялася не/года","поводився не/впевнено; давно не/здужає","зник не/сподівано, кімната не/прибрана"], a:3},
  {q:"Частку <b>не</b> треба писати разом із кожним наступним словом у рядку", opts:["надійти не/помітно; не/покоїтися про мене","зробити не/обіцяючи; літати не/високо","трапилося не/щастя; не/можна заздрити","не/заважай працювати; не/зоране поле","не/здужає підняти; скинути пута не/волі"], a:0},
  {q:"Частку <b>не</b> треба писати разом із кожним наступним словом у рядку", opts:["не/подалік музею; не/один місяць минув","не/зло, а добро; трапилося не/порозуміння","не/меркнуча слава; не/зачерствіле серце","не/згода руйнує; усі казки не/дочитані","ніким не/співані пісні; цікаві не/билиці"], a:2},
  {q:"Прочитайте уривок із поезії (цифра в дужках позначає наступне слово):<br><i>Минуле (1)не/вернуть, (2)не/виправить минуле.<br>Вчорашнє — ніби сон, що випурхнув з очей...<br>Але воно живе — забуте й (3)не/забуте,<br>а час (4)не/зупиняється, а молодість біжить.<br>І миті жодної (5)не/можна повернути,<br>щоб заново, по-іншому прожить.</i><br>Частку <b>не</b> треба писати окремо з усіма словами, ОКРІМ позначеного у варіанті", opts:["1","2","3","4","5"], a:2},
  {q:"Прочитайте уривок із поезії (цифра в дужках позначає наступне слово):<br><i>Я хочу буть (1)не/самовитим,<br>Я хочу в полум'ї згоріть,<br>Щоб (2)не/жаліти за прожитим,<br>Димком на світі (3)не/чадіть.<br>Щоб (4)не/пекли дрібні образи<br>Дрібненьку душу день при дні,<br>Я згоден вибухнуть відразу,<br>(5)Не/наче бомба на війні.<br>І диву дивному даюся,<br>Що з того користі катма:<br>Чомусь (6)не/лопаюсь, (7)не/рвуся —<br>Напевне, капсуля (8)не/ма.</i><br>Усі цифри на позначення написання <b>не</b> разом із наступним словом правильно наведено у варіанті", opts:["1, 3, 5","2, 5, 8","3, 4, 8","1, 5, 8","5, 6, 7"], a:3},

const TEST_SIZE = 30;

function shuffle_(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// chosenIndices — позиції з POOL, які потрапили в цю конкретну спробу тесту,
// у тому порядку, в якому учень їх бачив. Зберігаються в прогресі й у
// посиланні "розбір відповідей" (?qset=...), щоб і відновлення сторінки,
// і перегляд відповідей вчителем показували ТІ САМІ 30 завдань, а не нову
// випадкову добірку.
let chosenIndices = [];
let QUESTIONS = [];

function buildFromIndices_(indices){
  chosenIndices = indices;
  QUESTIONS = indices.map(function(i){ return POOL[i]; });
}

// свіжа випадкова добірка з 30 завдань
function rollNewSet_(){
  const idx = shuffle_(POOL.map(function(_, i){ return i; })).slice(0, TEST_SIZE);
  buildFromIndices_(idx);
}

// вчителю в Telegram (див. Code.gs) — сама сторінка тесту в бот більше
// напряму не пише.
const LOG_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyDGcDVtwD0L8WW0zDIsXwYwwf6zp4XzmofzdI0wU-AhhfZIXbH2lOHquNSHI8cKRc7/exec";

function logToSheet(payload){
  try{
    return fetch(LOG_WEBAPP_URL, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).then(resp => resp.ok).catch(()=>false);
  }catch(e){
    return Promise.resolve(false);
  }
}

let qIdx = 0;
let answers = {};
let flags = {}; // { questionIndex: true } — учень позначив питання як незрозуміле
let studentName = "";
let started = false;
let reportSent = false;
let finished = false;
let reviewMode = false; // true, коли сторінку відкрито за посиланням "розбір відповідей"

// ============================================================
// ЗБЕРЕЖЕННЯ ПРОГРЕСУ (щоб не пропадало, якщо зникне інтернет)
// Пишемо у звичайний localStorage браузера (не window.storage —
// той працює лише в превʼю Claude, а не на реальному сайті).
// Ключ прив'язаний до сторінки й імені учня, тож прогрес з одного
// тесту не змішається з іншим.
// ============================================================
function progressKey_(){
  return 'quizProgress::' + location.pathname + '::' + studentName;
}
function saveProgress_(){
  try{
    localStorage.setItem(progressKey_(), JSON.stringify({
      answers, flags, qIdx, finished, chosenIndices, ts: Date.now()
    }));
  }catch(e){ /* сховище недоступне (приватний режим тощо) — просто не збережеться */ }
}
function loadProgress_(){
  try{
    const raw = localStorage.getItem(progressKey_());
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!Array.isArray(data.chosenIndices) || !data.chosenIndices.length) return null; // немає добірки — не відновлюємо
    return data;
  }catch(e){ return null; }
}
function clearProgress_(){
  try{ localStorage.removeItem(progressKey_()); }catch(e){}
}

const quizArea = document.getElementById('quizArea');
document.getElementById('totalTag').textContent = TEST_SIZE + " завдань";

// [[текст]] у варіанті відповіді перетворюється на <u>текст</u>
function renderOpt(o){
  return o.replace(/\[\[([^\]]+)\]\]/g, '<u>$1</u>');
}

function scoreOverall(){
  let correct = 0, answered = 0;
  QUESTIONS.forEach((_,i)=>{
    const rec = answers[i];
    if(rec){ answered++; if(rec.correct) correct++; }
  });
  return {correct, answered, total: QUESTIONS.length};
}

async function getStoredName(){
  try{
    const result = await window.storage.get('student_name_imennyk');
    return result ? result.value : null;
  }catch(e){
    return null;
  }
}

async function setStoredName(name){
  try{
    await window.storage.set('student_name_imennyk', name);
  }catch(e){
    // сховище недоступне — ім'я просто не запам'ятається між сесіями
  }
}

async function clearStoredName(){
  try{
    await window.storage.delete('student_name_imennyk');
  }catch(e){}
}


// ---- Посилання "розбір відповідей" ----
// Кодує відповіді учня прямо в URL цієї ж сторінки: ?review=1&name=...&qset=17,402,88,...&ans=0-0,2-1,5-3,...
// qset — це позиції з POOL, які потрапили саме в цю спробу тесту (у порядку,
// в якому учень їх бачив), тому розбір відповідей показує ТІ САМІ 30 завдань,
// а не нову випадкову добірку.
function buildReviewLink(){
  const pairs = [];
  QUESTIONS.forEach((_,i)=>{
    const rec = answers[i];
    if(rec) pairs.push(i + '-' + rec.picked);
  });
  const ansStr = pairs.join(',');
  const flagStr = Object.keys(flags).filter(i=>flags[i]).join(',');
  const qsetStr = chosenIndices.join(',');
  const base = location.origin + location.pathname;
  let url = `${base}?review=1&name=${encodeURIComponent(studentName)}&qset=${qsetStr}&ans=${ansStr}`;
  if(flagStr) url += `&flags=${flagStr}`;
  return url;
}

// Розпізнає посилання розбору й заповнює answers/studentName з нього
function parseReviewParam(){
  const params = new URLSearchParams(location.search);
  if(params.get('review') !== '1') return false;
  const name = params.get('name');
  const ansParam = params.get('ans');
  const qsetParam = params.get('qset');
  if(!ansParam || !qsetParam) return false;

  const indices = qsetParam.split(',').map(Number).filter(function(n){ return !Number.isNaN(n) && POOL[n]; });
  if(!indices.length) return false;
  buildFromIndices_(indices);

  studentName = name || 'Учень';
  answers = {};
  ansParam.split(',').forEach(pair=>{
    const [idxStr, valStr] = pair.split('-');
    const i = Number(idxStr);
    const picked = Number(valStr);
    if(!Number.isNaN(i) && !Number.isNaN(picked) && i >= 0 && i < QUESTIONS.length){
      answers[i] = {picked, correct: picked === QUESTIONS[i].a};
    }
  });

  flags = {};
  const flagsParam = params.get('flags');
  if(flagsParam){
    flagsParam.split(',').forEach(s=>{
      const i = Number(s);
      if(!Number.isNaN(i)) flags[i] = true;
    });
  }

  started = true;
  reviewMode = true;
  qIdx = 0;
  return true;
}

function renderNameScreen(prefill){
  quizArea.innerHTML = `
    <div class="name-screen">
      <label for="nameInput">Як тебе звати?</label>
      <input type="text" id="nameInput" placeholder="Ім'я" autocomplete="off" value="${prefill ? prefill.replace(/"/g,'&quot;') : ''}">
      <button class="btn primary" id="startBtn" style="width:100%;justify-content:center;">Почати тест</button>
    </div>
  `;
  const input = document.getElementById('nameInput');
  const startBtn = document.getElementById('startBtn');
  input.focus();
  const go = async ()=>{
    const val = input.value.trim();
    studentName = val || "Без імені";
    await setStoredName(studentName);
    started = true;
    const saved = loadProgress_();
    if(saved){
      buildFromIndices_(saved.chosenIndices);
      answers = saved.answers || {};
      flags = saved.flags || {};
      qIdx = typeof saved.qIdx === 'number' ? saved.qIdx : 0;
      finished = !!saved.finished;
    } else {
      rollNewSet_();
      qIdx = 0;
    }
    renderQuiz();
  };
  startBtn.onclick = go;
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') go(); });
}

async function sendTelegramReport(){
  const {correct, total, answered} = scoreOverall();
  const wrongList = [];
  const flaggedList = [];
  QUESTIONS.forEach((_,i)=>{
    const rec = answers[i];
    const num = (QUESTIONS[i].origIndex !== undefined ? QUESTIONS[i].origIndex : i) + 1;
    if(rec && !rec.correct) wrongList.push(num);
    if(flags[i]) flaggedList.push(num);
  });

  const reviewLink = buildReviewLink();
  const statusEl = document.getElementById('sendStatus');

  const ok = await logToSheet({
    type: "quiz_result",
    student: studentName,
    testName: "Орфографія: загальний тест",
    correct, answered, total,
    wrongList,
    flaggedList,
    reviewLink
  });

  if(ok){
    reportSent = true;
    clearProgress_();
    if(statusEl){ statusEl.textContent = 'Результат надіслано вчителю ✓'; statusEl.className = 'send-status ok'; }
  } else if(statusEl){
    statusEl.innerHTML = 'Не вдалося надіслати результат (перевірте інтернет). Прогрес збережено, спробуйте ще раз.<br><button class="btn ghost small" id="retrySendBtn" style="margin-top:8px;">Спробувати ще раз</button>';
    statusEl.className = 'send-status bad';
    const retryBtn = document.getElementById('retrySendBtn');
    if(retryBtn) retryBtn.onclick = ()=>{
      statusEl.textContent = 'Надсилаємо результат...';
      statusEl.className = 'send-status';
      sendTelegramReport();
    };
  }
}

function renderQuiz(){
  document.getElementById('reviewBanner').classList.toggle('show', reviewMode);

  if(!started){ renderNameScreen(); return; }

  const total = QUESTIONS.length;

  if(qIdx >= total || finished){
    const {correct, answered} = scoreOverall();
    quizArea.innerHTML = `
      <div class="done-screen">
        <div class="ring"><div class="big">${correct}/${answered}</div></div>
        <p class="sub" style="margin:0 auto 4px;">${studentName} · Орфографія · відповідано ${answered} з ${total}</p>
        ${reviewMode ? '' : `<div class="send-status" id="sendStatus">Надсилаємо результат...</div>
        <button class="btn primary" id="restartBtn" style="margin-top:14px;">Пройти ще раз</button>`}
      </div>`;
    if(!reviewMode){
      document.getElementById('restartBtn').onclick = ()=>{
        answers = {}; flags = {};
        qIdx = 0; reportSent = false; finished = false;
        clearProgress_();
        rollNewSet_();
        renderQuiz();
      };
      saveProgress_();
      if(!reportSent){
        sendTelegramReport();
      }
    }
    return;
  }

  const q = QUESTIONS[qIdx];
  const rec = answers[qIdx];
  const {correct, answered} = scoreOverall();
  const isFlagged = !!flags[qIdx];

  let segs = '';
  QUESTIONS.forEach((_,i)=>{
    const r = answers[i];
    let cls = i===qIdx ? 'current' : (r ? (r.correct?'done-correct':'done-wrong') : '');
    segs += `<div class="seg ${cls}" data-i="${i}"></div>`;
  });

  quizArea.innerHTML = `
    <div class="progress-row">
      <div class="qnum">${studentName} · Питання ${qIdx+1} з ${total}</div>
      <div style="display:flex;align-items:center;gap:10px;">
        ${!reviewMode ? `<button id="flagBtn" type="button" title="Позначити, якщо незрозуміло" style="background:${isFlagged?'#FFE27A':'none'};border:none;cursor:pointer;font-size:13px;line-height:1;padding:4px 7px;border-radius:8px;opacity:${isFlagged?'1':'0.3'};">❓</button>` : ''}
        <div class="score">${correct}/${answered||0}</div>
      </div>
    </div>
    ${reviewMode && isFlagged ? `<p class="sub" style="color:#B8860B;font-weight:700;margin:0 0 6px;">❓ Учень позначив це питання як незрозуміле</p>` : ''}
    <div class="segbar">${segs}</div>
    <p class="qtext">${q.q}</p>
    <div class="options">
      ${q.opts.map((o,i)=>`
        <button class="opt" data-i="${i}" ${(rec||reviewMode)?'disabled':''}>
          <span class="tile"><span>${LETTERS[i]}</span></span><span>${renderOpt(o)}</span>
        </button>`).join('')}
    </div>
    <div class="feedback ${rec ? 'show '+(rec.correct?'ok':'bad') : (reviewMode ? 'show bad' : '')}" id="fb">
      ${rec
        ? (rec.correct ? `<span><b>Правильно.</b> Відповідь — ${LETTERS[q.a]}.</span>` : `<span>Правильна відповідь — ${LETTERS[q.a]}.</span>`)
        : (reviewMode ? `<span>Учень не відповів. Правильна відповідь — ${LETTERS[q.a]}.</span>` : '')}
    </div>
    <div class="nav-row">
      <button class="btn ghost" id="prevBtn" ${qIdx===0?'disabled':''}>← Назад</button>
      <button class="btn primary" id="nextBtn" ${(rec||reviewMode)?'':'disabled'}>${qIdx===total-1?'До результату':'Далі →'}</button>
    </div>
    ${reviewMode ? '' : `
    <div class="reset-row">
      <button class="btn ghost small" id="finishBtn">Завершити і надіслати результат</button>
      <button class="btn ghost small" id="changeNameBtn">Змінити ім'я</button>
    </div>`}
  `;

  if(rec){
    quizArea.querySelectorAll('.opt').forEach((btn,i)=>{
      const tile = btn.querySelector('.tile');
      if(i===q.a){
        btn.classList.add('correct');
        tile.insertAdjacentHTML('beforeend', '<span class="badge ok">✓</span>');
      } else if(i===rec.picked){
        btn.classList.add('wrong');
        tile.insertAdjacentHTML('beforeend', '<span class="badge no">✕</span>');
      } else {
        btn.classList.add('dim');
      }
    });
  } else if(reviewMode){
    quizArea.querySelectorAll('.opt').forEach((btn,i)=>{
      const tile = btn.querySelector('.tile');
      if(i===q.a){
        btn.classList.add('correct');
        tile.insertAdjacentHTML('beforeend', '<span class="badge ok">✓</span>');
      } else {
        btn.classList.add('dim');
      }
    });
  }

  quizArea.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(reviewMode) return;
      if(answers[qIdx]) return;
      const picked = +btn.dataset.i;
      answers[qIdx] = {picked, correct: picked===q.a};
      saveProgress_();
      renderQuiz();
    };
  });
  document.getElementById('prevBtn').onclick = ()=>{ qIdx--; clearDrawing(); renderQuiz(); };
  document.getElementById('nextBtn').onclick = ()=>{ qIdx++; clearDrawing(); renderQuiz(); };
  if(!reviewMode){
    const flagBtn = document.getElementById('flagBtn');
    if(flagBtn) flagBtn.onclick = ()=>{
      flags[qIdx] = !flags[qIdx];
      saveProgress_();
      renderQuiz();
    };
    document.getElementById('finishBtn').onclick = ()=>{
      const {answered} = scoreOverall();
      const msg = answered===0
        ? 'Ти ще не відповів на жодне питання. Завершити тест зараз?'
        : `Завершити тест зараз і надіслати результат (відповідено на ${answered} із ${total})?`;
      if(confirm(msg)){
        finished = true;
        saveProgress_();
        renderQuiz();
      }
    };
    document.getElementById('changeNameBtn').onclick = async ()=>{
      await clearStoredName();
      started = false;
      renderNameScreen(studentName);
    };
  }
  quizArea.querySelectorAll('.seg').forEach(d=>{
    d.onclick = ()=>{ qIdx = +d.dataset.i; saveProgress_(); renderQuiz(); };
  });
}

async function init(){
  if(parseReviewParam()){
    renderQuiz();
    return;
  }
  const fromUrl = new URLSearchParams(location.search).get('student');
  if(fromUrl){
    studentName = fromUrl;
    started = true;
    const saved = loadProgress_();
    if(saved){
      buildFromIndices_(saved.chosenIndices);
      answers = saved.answers || {};
      flags = saved.flags || {};
      qIdx = typeof saved.qIdx === 'number' ? saved.qIdx : 0;
      finished = !!saved.finished;
    } else {
      rollNewSet_();
      qIdx = 0;
    }
    renderQuiz();
    return;
  }
  const saved = await getStoredName();
  if(saved){
    studentName = saved;
    started = true;
    const savedProgress = loadProgress_();
    if(savedProgress){
      buildFromIndices_(savedProgress.chosenIndices);
      answers = savedProgress.answers || {};
      flags = savedProgress.flags || {};
      qIdx = typeof savedProgress.qIdx === 'number' ? savedProgress.qIdx : 0;
      finished = !!savedProgress.finished;
    } else {
      rollNewSet_();
      qIdx = 0;
    }
  }
  renderQuiz();
}
init();

// ======================================================================
// МАЛЮВАННЯ ПОВЕРХ ЕКРАНА (режим "учитель")
// Дозволяє малювати Apple Pencil / пальцем прямо на екрані, не заважаючи
// звичайній роботі тренажера, коли режим малювання вимкнено.
// ======================================================================
(function(){
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  const toggleBtn = document.getElementById('drawToggleBtn');
  const toolbar = document.getElementById('drawToolbar');
  const thinBtn = document.getElementById('thinBtn');
  const thickBtn = document.getElementById('thickBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');
  const swatches = document.querySelectorAll('.swatch');

  let drawingActive = false;
  let isDrawing = false;
  let currentColor = "#E5484D";
  let currentWidth = 4;
  let eraserMode = false;
  let lastX = 0, lastY = 0;

  function resizeCanvas(){
    const prev = document.createElement('canvas');
    prev.width = canvas.width;
    prev.height = canvas.height;
    prev.getContext('2d').drawImage(canvas, 0, 0);

    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.drawImage(prev, 0, 0, prev.width / devicePixelRatio, prev.height / devicePixelRatio);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  window.clearDrawing = function(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  };

  function setActive(on){
    drawingActive = on;
    canvas.classList.toggle('active', on);
    toolbar.classList.toggle('show', on);
    toggleBtn.classList.toggle('on', on);
    toggleBtn.title = on ? 'Вимкнути малювання' : 'Малювати';
  }

  toggleBtn.addEventListener('click', ()=> setActive(!drawingActive));

  swatches.forEach(sw=>{
    sw.addEventListener('click', ()=>{
      swatches.forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      currentColor = sw.dataset.color;
      eraserMode = false;
      eraserBtn.classList.remove('selected');
    });
  });

  thinBtn.addEventListener('click', ()=>{
    currentWidth = 4;
    thinBtn.classList.add('selected');
    thickBtn.classList.remove('selected');
  });
  thickBtn.addEventListener('click', ()=>{
    currentWidth = 12;
    thickBtn.classList.add('selected');
    thinBtn.classList.remove('selected');
  });
  eraserBtn.addEventListener('click', ()=>{
    eraserMode = !eraserMode;
    eraserBtn.classList.toggle('selected', eraserMode);
  });
  clearBtn.addEventListener('click', ()=>{
    window.clearDrawing();
  });

  function pointerPos(e){
    return { x: e.clientX, y: e.clientY, pressure: e.pressure || 0.5 };
  }

  canvas.addEventListener('pointerdown', (e)=>{
    if(!drawingActive) return;
    isDrawing = true;
    const p = pointerPos(e);
    lastX = p.x; lastY = p.y;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e)=>{
    if(!drawingActive || !isDrawing) return;
    const p = pointerPos(e);
    ctx.globalCompositeOperation = eraserMode ? 'destination-out' : 'source-over';
    ctx.strokeStyle = currentColor;
    const pressureFactor = 0.6 + (p.pressure || 0.5) * 0.8;
    ctx.lineWidth = (eraserMode ? currentWidth * 3 : currentWidth) * pressureFactor;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  });

  function stopDrawing(e){
    isDrawing = false;
  }
  canvas.addEventListener('pointerup', stopDrawing);
  canvas.addEventListener('pointercancel', stopDrawing);
  canvas.addEventListener('pointerleave', stopDrawing);
})();
</script>
