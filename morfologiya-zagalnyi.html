<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Морфологія · Загальний тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#D0E9FC;
    --bg-soft:#E4F2FC;
    --card:#FFFFFF;
    --ink:#13213B;
    --ink-soft:#6478A0;
    --line: rgba(19,33,59,0.08);

    --c1-a:#A5B4FC; --c1-b:#6366F1; --c1-sh: rgba(99,102,241,0.45);
    --c3-a:#5FE0A8; --c3-b:#17A863; --c3-sh: rgba(23,168,99,0.4);
    --c2-b:#E5484D;

    --correct-bg:#E6F8EE;
    --correct-ink:#128A54;
    --wrong-bg:#FDECEC;
    --wrong-ink:#D8393E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 64px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    margin-bottom:22px;
    border-bottom:1.5px solid rgba(19,33,59,0.14);
  }
  .kicker{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.55;
  }
  .kicker.tag{opacity:.4;}

  .review-banner{
    display:none;
    align-items:center;
    gap:8px;
    background:#FFF4E0;
    color:#8A5A00;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px 16px;
    border-radius:14px;
    margin-bottom:16px;
  }
  .review-banner.show{display:flex;}

  h1{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:clamp(26px,6vw,38px);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 8px;
    text-transform:uppercase;
  }
  h1 .hl{color:var(--c1-b);}
  .sub{color:var(--ink-soft);font-size:15px;max-width:50ch;margin:0 0 18px;font-weight:500;}

  /* --- Topic / subtopic tabs (more subtopics will be added here later) --- */
  .topic-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:22px;
    scrollbar-width:none;
  }
  .topic-tabs::-webkit-scrollbar{display:none;}
  .topic-tab{
    flex:0 0 auto;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    padding:10px 18px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    white-space:nowrap;
    background:rgba(255,255,255,0.55);
    color:var(--ink-soft);
  }
  .topic-tab.active{
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));
    color:#fff;
    box-shadow:0 10px 20px -10px var(--c1-sh);
    cursor:default;
  }
  .topic-tab[disabled]{
    opacity:.45;
    cursor:not-allowed;
  }

  .card{
    background:var(--card);
    border-radius:28px;
    padding:30px 26px;
    box-shadow: 0 20px 44px -28px rgba(19,33,59,0.35);
  }

  .progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .qnum{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    color:var(--ink-soft);
  }
  .score{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    color:var(--c3-b);
    background:var(--correct-bg);
    padding:6px 13px;
    border-radius:999px;
  }

  .segbar{display:flex;gap:3px;margin-bottom:22px;flex-wrap:wrap;}
  .seg{
    flex:1;
    min-width:6px;
    height:6px;
    border-radius:999px;
    background:var(--bg-soft);
    cursor:pointer;
  }
  .seg.current{background:var(--c1-b);}
  .seg.done-correct{background:var(--c3-b);}
  .seg.done-wrong{background:var(--c2-b);}

  .qtext{
    font-family:'Manrope',sans-serif;
    font-size:19px;
    font-weight:700;
    line-height:1.4;
    margin:0 0 20px;
    letter-spacing:-0.005em;
  }
  .qtext u{ text-decoration-thickness:2px; text-underline-offset:2px; }

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;
    align-items:center;
    gap:13px;
    text-align:left;
    width:100%;
    padding:9px 14px 9px 9px;
    border-radius:18px;
    border:none;
    background:var(--bg-soft);
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    transition:transform .12s ease, background .15s ease;
  }
  .opt:hover{transform:translateY(-1px);}
  .opt[disabled]{cursor:default;}
  .opt[disabled]:hover{transform:none;}
  .opt u{ text-decoration-thickness:2px; text-underline-offset:2px; }

  /* --- glass letter tile: uniform accent color, translucent, blurred, like iOS icons --- */
  .tile{
    position:relative;
    width:32px;height:32px;min-width:32px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:13.5px;
    color:var(--c1-b);
    background: linear-gradient(150deg, rgba(255,255,255,0.75), rgba(108,140,255,0.22));
    backdrop-filter: blur(6px) saturate(160%);
    -webkit-backdrop-filter: blur(6px) saturate(160%);
    border:1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 12px -7px var(--c1-sh), inset 0 1px 1px rgba(255,255,255,0.8);
    overflow:visible;
  }
  .tile > span{position:relative;z-index:1;}

  .badge{
    position:absolute;
    top:-5px;right:-5px;
    width:16px;height:16px;
    border-radius:50%;
    border:2px solid var(--card);
    display:flex;align-items:center;justify-content:center;
    font-size:9.5px;
    font-weight:800;
    color:#fff;
    z-index:2;
  }
  .badge.ok{background:var(--c3-b);}
  .badge.no{background:var(--c2-b);}

  .opt.correct{background:var(--correct-bg);}
  .opt.wrong{background:var(--wrong-bg);}
  .opt.dim{opacity:.5;}

  .feedback{
    margin-top:16px;
    padding:13px 16px;
    border-radius:16px;
    font-size:14.5px;
    font-weight:600;
    display:none;
    align-items:center;
    gap:9px;
  }
  .feedback.show{display:flex;}
  .feedback.ok{background:var(--correct-bg);color:var(--correct-ink);}
  .feedback.bad{background:var(--wrong-bg);color:var(--wrong-ink);}
  .feedback b{font-family:'Manrope',sans-serif;}

  .nav-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:24px;
  }
  .btn{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:13px;
    padding:12px 22px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .btn.primary{
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));
    color:#fff;
    box-shadow:0 10px 20px -8px var(--c1-sh);
  }
  .btn.ghost{background:transparent;color:var(--ink-soft);}
  .btn:disabled{opacity:.3;cursor:default;box-shadow:none;}
  .btn.small{
    font-size:12px;
    padding:8px 4px;
    opacity:.55;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .btn.small:hover{opacity:.85;}
  .reset-row{
    text-align:center;
    margin-top:6px;
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
  }

  .done-screen{text-align:center;padding:16px 0;}
  .done-screen .ring{
    width:120px;height:120px;
    margin:0 auto 18px;
    border-radius:50%;
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));
    box-shadow:0 16px 30px -12px var(--c1-sh);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .done-screen .ring::before{
    content:'';
    position:absolute;
    top:6px;left:10px;right:10px;
    height:46%;
    border-radius:50% 50% 60% 60%;
    background:linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(255,255,255,0));
  }
  .done-screen .big{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:30px;
    color:#fff;
    position:relative;
    z-index:1;
  }
  .done-screen .send-status{
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    margin-top:10px;
    min-height:18px;
  }
  .done-screen .send-status.ok{color:var(--correct-ink);}
  .done-screen .send-status.bad{color:var(--wrong-ink);}

  .name-screen{padding:6px 0;}
  .name-screen label{
    display:block;
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:14px;
    margin-bottom:10px;
    color:var(--ink);
  }
  .name-screen input{
    width:100%;
    padding:14px 16px;
    border-radius:16px;
    border:1.5px solid var(--line);
    background:var(--bg-soft);
    font-family:'Inter',sans-serif;
    font-size:15px;
    font-weight:500;
    color:var(--ink);
    outline:none;
    margin-bottom:18px;
  }
  .name-screen input:focus{border-color:var(--c1-b);}

  footer{
    text-align:center;
    margin-top:22px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }

  /* ===================== DRAWING / TEACHER MODE ===================== */
  #drawCanvas{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    z-index:9998;
    touch-action:none;
    pointer-events:none;
  }
  #drawCanvas.active{
    pointer-events:auto;
  }

  #drawToggleBtn{
    position:fixed;
    right:20px;
    bottom:20px;
    width:58px;height:58px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.5);
    background:
      linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),
      linear-gradient(155deg,var(--c1-a),var(--c1-b));
    backdrop-filter: blur(10px) saturate(160%);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    box-shadow:
      0 14px 28px -10px var(--c1-sh),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -6px 10px -4px rgba(0,0,0,0.15);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:9999;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .2s ease, box-shadow .2s ease;
  }
  #drawToggleBtn svg{
    width:24px;height:24px;
    display:block;
    transition:transform .25s ease, opacity .15s ease;
  }
  #drawToggleBtn:active{transform:scale(0.90);}
  #drawToggleBtn.on{
    background:
      linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),
      linear-gradient(155deg,#FF8A65,var(--c2-b));
    box-shadow:
      0 14px 28px -10px rgba(229,72,77,0.55),
      inset 0 1px 1px rgba(255,255,255,0.6),
      inset 0 -6px 10px -4px rgba(0,0,0,0.15);
  }
  #drawToggleBtn.on svg{ transform:rotate(90deg); }

  #drawToolbar{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%) translateY(130%) scale(0.94);
    opacity:0;
    display:flex;
    align-items:center;
    gap:12px;
    background:
      linear-gradient(150deg, rgba(255,255,255,0.6), rgba(255,255,255,0.15));
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,0.7);
    padding:9px 16px;
    border-radius:999px;
    box-shadow:
      0 24px 48px -20px rgba(19,33,59,0.45),
      inset 0 1px 1px rgba(255,255,255,0.9);
    z-index:9999;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;
    pointer-events:none;
  }
  #drawToolbar.show{
    transform:translateX(-50%) translateY(0) scale(1);
    opacity:1;
    pointer-events:auto;
  }
  .swatch{
    position:relative;
    width:25px;height:25px;
    border-radius:50%;
    border:none;
    box-shadow:
      0 3px 8px -2px rgba(19,33,59,0.35),
      inset 0 1px 1px rgba(255,255,255,0.5);
    cursor:pointer;
    padding:0;
    transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .swatch::after{
    content:'';
    position:absolute;
    inset:-4px;
    border-radius:50%;
    border:2px solid var(--ink);
    opacity:0;
    transform:scale(0.7);
    transition:opacity .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .swatch.selected{ transform:scale(1.08); }
  .swatch.selected::after{ opacity:1; transform:scale(1); }
  .tool-btn{
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.5);
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .tool-btn svg{ width:16px; height:16px; }
  .tool-btn .dot{
    border-radius:50%;
    background:currentColor;
  }
  #thinBtn .dot{ width:6px; height:6px; }
  #thickBtn .dot{ width:12px; height:12px; }
  .tool-btn.selected{
    background:var(--c1-b);
    color:#fff;
    transform:scale(1.06);
  }
  .tool-sep{
    width:1px;
    height:22px;
    background:rgba(19,33,59,0.14);
  }

  @media (max-width:480px){
    #drawToolbar{
      max-width:94vw;
      overflow-x:auto;
      padding:8px 13px;
      gap:9px;
    }
    .swatch{width:21px;height:21px;}
    .tool-btn{width:30px;height:30px;}
    .tool-btn svg{width:14px;height:14px;}
  }

  .qtext .quote{ display:block; font-weight:500; font-style:italic; line-height:1.55; margin:10px 0 12px; }
  .qtext .num{ font-weight:800; }
  .qtext .num1{color:var(--c1-b);} .qtext .num2{color:#13213B;} .qtext .num3{color:#8B5CF6;} .qtext .num4{color:#2563EB;}
  .done-screen .mhead{ text-align:left; }

    /* ===================== MATCHING (Установіть відповідність) ===================== */
  .mhead{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:2px 0 9px;
  }
  .mex-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
  .mex{
    display:flex;align-items:center;gap:13px;
    padding:7px 14px 7px 9px;
    border-radius:18px;
    background:var(--bg-soft);
    font-size:15px;font-weight:500;
  }
  .mgrid{display:flex;flex-direction:column;gap:10px;}
  .mrow{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px 14px;flex-wrap:wrap;
    padding:9px 12px 9px 16px;
    border-radius:18px;
    background:var(--bg-soft);
  }
  .mlab{font-size:15px;font-weight:500;flex:1 1 150px;}
  .mlab b{font-family:'Manrope',sans-serif;font-weight:800;color:var(--c1-b);margin-right:9px;}
  .mbtns{display:flex;gap:8px;}
  .mbtn{
    position:relative;
    width:36px;height:36px;
    border-radius:11px;
    border:1px solid rgba(19,33,59,0.08);
    background:#fff;
    font-family:'Manrope',sans-serif;
    font-weight:800;font-size:13.5px;
    color:var(--c1-b);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    padding:0;
    transition:transform .12s ease, background .15s ease;
  }
  .mbtn:hover{transform:translateY(-1px);}
  .mbtn[disabled]{cursor:default;}
  .mbtn[disabled]:hover{transform:none;}
  .mbtn.sel{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;border-color:transparent;}
  .mbtn.correct{background:var(--correct-bg);color:var(--correct-ink);border-color:var(--c3-b);}
  .mbtn.wrong{background:var(--wrong-bg);color:var(--wrong-ink);border-color:var(--c2-b);}
  @media (max-width:480px){
    .mbtn{width:34px;height:34px;}
    .mbtns{gap:6px;}
  }

</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="kicker">Морфологія · Усі теми</div>
    <div class="kicker tag" id="totalTag">20 завдань</div>
  </div>

  <div class="review-banner" id="reviewBanner">👀 Режим перегляду відповідей учня</div>

  <h1>Загальний <span class="hl">тест</span> з морфології</h1>
  <p class="sub">20 випадкових завдань із усіх тем морфології — щоразу інша добірка. Формат НМТ.</p>

  <div class="card">
    <div id="quizArea"></div>
  </div>

  <footer>@movoznavka</footer>
</div>

<!-- ==== Малювання поверх екрана (для вчителя) ==== -->
<canvas id="drawCanvas"></canvas>
<button id="drawToggleBtn" title="Малювати">
  <svg id="drawIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 20L4.6 16.6C4.7 15.9 5.03 15.26 5.55 14.79L15.3 5.7C16.09 4.96 17.34 4.99 18.09 5.78L18.34 6.04C19.08 6.83 19.04 8.08 18.25 8.81L8.5 17.9C8 18.37 7.37 18.66 6.7 18.75L4 20Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M13.5 7.5L16.5 10.3" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
</button>
<div id="drawToolbar">
  <button class="swatch selected" style="background:#E5484D" data-color="#E5484D"></button>
  <button class="swatch" style="background:#3355EE" data-color="#3355EE"></button>
  <button class="swatch" style="background:#17A863" data-color="#17A863"></button>
  <button class="swatch" style="background:#13213B" data-color="#13213B"></button>
  <div class="tool-sep"></div>
  <button class="tool-btn selected" id="thinBtn" title="Тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thickBtn" title="Товста лінія"><span class="dot"></span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="eraserBtn" title="Ластик">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.5 13.5L10.5 21.5H5.5L2.5 18.5C2.11 18.11 2.11 17.48 2.5 17.09L13.5 6.09C13.89 5.7 14.52 5.7 14.91 6.09L18.5 9.68C19.5 10.68 19.5 12.5 18.5 13.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 13.5L15 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="tool-btn" id="clearBtn" title="Очистити все">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 7H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M9.5 7V4.8C9.5 4.36 9.86 4 10.3 4H13.7C14.14 4 14.5 4.36 14.5 4.8V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 7L7.7 18.6C7.75 19.42 8.42 20 9.24 20H14.76C15.58 20 16.25 19.42 16.3 18.6L17 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M10.3 10.5V16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M13.7 10.5V16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
</div>

<script>
// ======================================================================
// ЗАГАЛЬНИЙ ТЕСТ З МОРФОЛОГІЇ
// Щоразу з усіх тем береться нова випадкова добірка з TEST_SIZE завдань.
// Добірка рівномірна по темах: спершу по одному завданню з різних тем

{"id":"pryimennyk.2","q":"НЕМАЄ прийменника в реченні","opts":["Падав вечір над хатинами зорями й росинами.","Вдаль голубими вітрами весни за обрій пливли.","Яворові сниться яворина та її кохання молоде.","Розділю я порівну з тобою радощі, і болі, й сподівання."],"a":2},

{"id":"pryimennyk.5","q":"Прийменник є в кожному реченні, ОКРІМ","opts":["Між горами старий Дніпро, неначе в молоці дитина.","Не можна любити народів других, якщо ти не любиш Вкраїну.","Батьківщина розпочинається для людини зі шматка неба.","Люди з красивими душами не здатні на підлість.","Як хороше радіти без причини, коли на місто сутінь опада."],"a":1},
{"id":"pryimennyk.6","q":"Прийменник є в кожному реченні, ОКРІМ","opts":["Без праці не проживеш.","Друзі пізнаються в біді.","Не гріє сонце на чужині.","Як гукнеш, так і відгукнеться.","Час за гроші не зможеш купити."],"a":3},
{"id":"pryimennyk.7","q":"Прийменник виділено в реченні","opts":["Лунає <i>неподалік</i> пісня сили, краси.","<i>Назустріч</i> здіймалося місто в бронзі.","<i>Напередодні</i> всю ніч ішов лапатий сніг.","Козаки <i>навколо</i> фортеці копали шанці.","Десь <i>поблизу</i> виводив свою пісню соловей."],"a":3},
{"id":"pryimennyk.8","q":"Прийменник виділено в реченні","opts":["<i>Навколо</i> — ворогів закрадливість лукава.","Ой зійди, зійди, ясен місяцю, як млинове<i>є</i> <i>коло</i>.","Кипариси від ночі й до ранку все шумлять і шумлять <i>навкруги</i>.","Той ніколи не доскочить слави, хто <i>задля</i> неї на землі живе.","Мовчать церкви, мовчить базар, і лиш кричать <i>кругом</i> плакати."],"a":3},
{"id":"pryimennyk.9","q":"Правильно написано всі прийменники в рядку","opts":["з метою, з-над, наприкінці, з-перед","у продовж, поперед, упоперек, з-під","з-поміж, у зв'язку з, з-поза, підчас","по-під, за винятком, із-за, поруч","позаду, на перекір, поза, навколо"],"a":0},
{"id":"pryimennyk.10","q":"Правильно написано всі прийменники в рядку","opts":["відповідно до, щодо, за-для, позаду","з-посеред, окрім, під-кінець, заради","у галузі, за винятком, з-під, навпроти","на зустріч, згідно з, усупереч, поміж","не зважаючи на, попри, з-поза, услід"],"a":2},
{"id":"pryimennyk.11","q":"Прийменником є виділене слово в реченні","opts":["Так тихо й радісно <b><i>навколо</i></b>!","З тобою я готовий іти хоч на <b><i>край</i></b> землі.","Не біймося труднощів і йдімо <b><i>назустріч</i></b> долі.","Микита стояв <b><i>осторонь</i></b> і похмуро дивився на однокласників.","<b><i>Поблизу</i></b> був парк, тож ми гуляли там щодня."],"a":2},
{"id":"pryimennyk.12","q":"Прийменниками є всі слова рядка","opts":["відповідно до, якщо, задля","майже, через, понад","з-поміж, однак, чи","згідно з, навіть, заради","незважаючи на, із-за, посеред"],"a":4}

{key:"spoluchnyk",title:"Сполучник",qs:[
{"id":"spoluchnyk.0","q":"Виділене слово є сполучником у реченні","opts":["Ліси <i>наче</i> завмерли у святковій величі.","Я стрів тебе, <i>як</i> день волошку в житі.","Ми з такого роду, <i>що</i> любить свободу.","Там починаються поети, <i>де</i> починається душа.","Човен загойдавсь і поплив, <i>куди</i> хотів."],"a":1},
{"id":"spoluchnyk.1","q":"Виділене слово є сполучником у реченні","opts":["Ніхто не скаже, <i>коли</i> розпочалося козацьке лицарство.","Послухайте, <i>як</i> майстерно птах виводить ноту.","Як зветься вітер, <i>що</i> несе надію людям?","Гори мріють про небо, <i>якого</i> сягнуть не дано.","А сонечко запитало, <i>чи</i> тепло в моїй душі."],"a":4},
{"id":"spoluchnyk.2","q":"Виділене слово є сполучником у всіх реченнях, ОКРІМ","opts":["Сонце так світить яскраво, <i>що</i> аж каміння сміється.","Сяє дощик на зеленім листі, <i>наче</i> сльози капають на лист.","Будуть достигати влітку плоди, <i>якщо</i> квітнуть сади.","Душа наповнена теплом, <i>хоч</i> надвечір'я вже минуло.","Спинися, часе, розкажи, <i>як</i> наш народ колись тут жив."],"a":4},
{"id":"spoluchnyk.3","q":"Виділене слово є сполучником, і його треба писати разом у реченні","opts":["<i>Що/б</i> улітку не вродило, те взимку не завадить.","<i>Що/б</i> не трапилося — будь людиною.","<i>Що/б</i> там не кричало, біжи й не оглядайся.","<i>Що/б</i> не робив — роби добре.","<i>Що/б</i> жить — ні в кого права не питаю."],"a":4},
{"id":"spoluchnyk.4","q":"Виділене сполучення треба писати окремо в реченні","opts":["<i>Як/би</i> там не було, а комусь належало це перевірити.","<i>Як/би</i> було десять рук, усім би робота знайшлася.","<i>Як/би</i> ви знали, паничі, як люди плачуть живучи.","<i>Як/би</i> відали ви, які славні були ті суворі, закручені хлопці.","<i>Як/би</i> не було зими, про кожух не дбали б ми."],"a":0},
{"id":"spoluchnyk.5","q":"Виділене слово є сполучником, і його треба писати разом у реченні","opts":["Треба дзвінкий голос мати, <i>що/б</i> гарно співати.","Ми не розлучимося з тобою, <i>що/б</i> не сталося.","Повідомили <i>про/те</i>, що зустріч відбудеться завтра.","Наша пісня — <i>то/ж</i> душа народу, його сила і могуть.","Вибач мені, брате, <i>за/те</i>, що спізнився з допомогою."],"a":0},
{"id":"spoluchnyk.6","q":"Виділене слово є сполучником, і його треба писати разом у реченні","opts":["<i>Як/би</i> ти не знав багато, а більше за всіх не знатимеш.","Про <i>що/б</i> не писав поет, він завжди пише про людину.","Я поважаю тебе <i>за/те</i>, що ти завжди дотримуєш слова.","Я мушу книжки читати, <i>що/б</i> очі мої не осліпли.","<i>Як/би</i> не тис мороз, а весна буде."],"a":3},
{"id":"spoluchnyk.7","q":"Виділене слово є сполучником, і його треба писати разом у всіх реченнях, ОКРІМ","opts":["<i>Як/би</i> могли дерева говорити, то рідний край навчили б нас любити.","<i>Як/що</i> хочеш ти добро зробити, зроби його якнайшвидше.","<i>Як/що</i> трапиться, нарікай тільки на себе.","<i>Як/би</i> мені черевики, то пішла б я на музики.","Я хочу жити так, <i>що/б</i> серце билося в такт."],"a":2},
{"id":"spoluchnyk.8","q":"Виділене слово є сполучником, і його треба писати разом у всіх реченнях, ОКРІМ","opts":["<i>Як/би</i> руки не працювали, а розум над ними пан.","Хоч важка була дорога, <i>за/те</i> наша перемога.","<i>Як/би</i> не було хмар, ми б не знали ціни сонцю.","<i>Що/б</i> інших навчати, треба самому вміти.","Розумний хоч і знає, <i>про/те</i> завжди спитає."],"a":0},
{"id":"spoluchnyk.9","q":"Окремо треба писати виділене слово в реченні","opts":["<i>Що/б</i> біди не мати, треба працювати.","<i>Що/б</i> улітку не вродило, зимою не зашкодить.","Треба нахилитися, <i>що/б</i> із криниці води напитися.","Багатого проводять, <i>що/б</i> не впав, а бідного — <i>що/б</i> не вкрав."],"a":1},
{"id":"spoluchnyk.10","q":"Окремо треба писати виділене слово в реченні","opts":["<i>Як/би</i> така до роботи, як на витребеньки.","Взута ходила б, <i>як/би</i> Сонька робила.","<i>Як/би</i> свині роги, весь світ переколола б.","Багач норовить, <i>як/би</i> бідного з ніг збить."],"a":3},
{"id":"spoluchnyk.11","q":"Окремо треба писати виділене слово в реченні","opts":["Хоч мороз і припікає, <i>за/те</i> комарів немає.","Хоч річка й невеличка, <i>за/те</i> береги ламає.","За що купив, <i>за/те</i> й продаю.","Наша хата мала, <i>за/те</i> своя."],"a":2},
{"id":"spoluchnyk.12","q":"Сполучниками є слова в усіх рядках, ОКРІМ","opts":["проте, дарма що, з-поміж","оскільки, зате, і","або, щоб, бо","якби, але, тому що","якщо, та, аби"],"a":0},
{"id":"spoluchnyk.13","q":"Виділене слово є сполучником, і його треба писати разом у реченні","opts":["<i>Як/би</i> там не було, я однаково поїду до моря.","<i>Як/би</i> ти не ховався, я тебе знайду.","<i>Як/би</i> не сподівалися на хорошу погоду, а дощ таки пішов.","<i>Як/би</i> ми не поспішали, однаково на кілька хвилин запізнилися.","<i>Як/би</i> ви вчились так, як треба, то й мудрість би була своя."],"a":4}
]},
// ---- Частка (17) ----
{key:"chastka",title:"Частка",qs:[
{"id":"chastka.0","q":"Частки НЕМАЄ в реченні","opts":["Розум за гроші не купиш.","Лунають лише пісні солов'їні.","Тече вода із-за гаю та попід горою.","Нехай квітне планета чистотою.","Тільки з юних літ мені відкрилася правда."],"a":2},
{"id":"chastka.1","q":"Частки НЕМАЄ в реченні","opts":["Правда таки переможе.","Пішов би я в Україну.","Майже тиждень не було дощу.","Я буду крізь сльози сміятись.","От де, люди, наша слава."],"a":3},
{"id":"chastka.2","q":"Частки НЕМАЄ в реченні","opts":["Не вмирає душа наша.","Зосталася тільки надія одна.","Ліси наче світилися наскрізь.","Скромність — це любов до людей.","Живемо ми на одній Землі!"],"a":4},
{"id":"chastka.3","q":"Правила правопису частки порушено в реченні","opts":["Щастя не шукають, а таки здобувають.","І все-таки нелегко бути собою!","Я хотіла б людям для підмоги в кожну мить подати голос свій!","О, якби-то я міг повернути неповторну юність мою.","Щей для тебе, дівчино, троянди весни розцвітуть."],"a":4},
{"id":"chastka.4","q":"Правила правопису частки порушено в реченні","opts":["На те й лихо, щоб із тим лихом битися.","Отаке то на цім світі роблять людям люди.","Степаночку, голубчику, чого-бо ти плачеш?","Ти б не хотів, щоб день уже скінчився?","І знову думать заходився про те ж таки, що й вчора."],"a":1},
{"id":"chastka.5","q":"Правила правопису частки порушено в реченні","opts":["А серце таки рветься до кращого життя.","О, якби-то листя, листя не жовтіло...","А він коня поганяє, ніби-то й не бачить.","«Що ж то за краса!» — шепотять дівчата.","Книжечки мережаю та начиняю-таки віршами."],"a":2},
{"id":"chastka.6","q":"З дефісом треба писати всі частки в рядку","opts":["будь-як, отак-то, бозна-скільки","усе-ж-таки, такий-от, казна-що","невже-таки, тільки-що, годі-бо","ані-хто, як-небудь, казна-чому","скажи-но, що-року, будь-чому"],"a":0},
{"id":"chastka.7","q":"З дефісом треба писати всі частки в рядку","opts":["будь-хто, якби-то, що-не-день","казна-коли, аби-кого, хтозна-що","чого-небудь, як-то, де-котрий","будь-як, що-небудь, зумів-таки","от-так, будь-кому, хтозна-як"],"a":3},
{"id":"chastka.8","q":"З дефісом треба писати всі частки в рядку","opts":["навряд-чи, тут-таки, казна-де","де-коли, правда-бо, будь-чого","які-ж-бо, колись-то, що-небудь","отак-бо, скажи-но, будь-звідки","отож-бо, ну-бо, таки-прийшов"],"a":3},
{"id":"chastka.9","q":"З дефісом треба писати всі частки в рядку","opts":["дарма-що, іди-но, будь-коли","таки-так, тільки-но, будь-як","усе-таки, так-от, аби-що","отакий-то, як-небудь, казна-що","хтозна-де, хіба-що, будь-коли"],"a":3},
{"id":"chastka.10","q":"НЕМАЄ частки в реченні","opts":["Не поможе ні мило, ні вода, коли така врода.","А в рум'янці така сила, що всі квіти погасила.","Краса лиця — це половина приданого.","Краса до вінця, а розум — до кінця."],"a":3},
{"id":"chastka.11","q":"НЕМАЄ частки в реченні","opts":["І тварина розумна, дарма що не говорить.","Чий би бугай не скакав, а теля наше.","Коня кують, а жаба ногу підставляє.","З поганої вівці хоч вовни жмут."],"a":2},
{"id":"chastka.12","q":"З дефісом треба писати всі частки в рядку","opts":["казна-де, аби-що, стільки-то","бозна-коли, чекай-но, де-кого","казна-з-ким, списав-таки, хтозна-як","де-небудь, будь-який, почистив-таки"],"a":3},
{"id":"chastka.13","q":"З дефісом треба писати всі частки в рядку","opts":["отож-бо, тому-то, казна-коли","бозна-в-кого, будь-де, як-небудь","хтозна-чого, аби-коли, встиг-таки","таки-знає, правда-бо, казна-де"],"a":0},
{"id":"chastka.14","q":"Разом треба писати всі частки в рядку","opts":["поки-що, ні-чого, чи-мало","аби-як, немов-би, ніби-то","де-коли, навряд-чи, де-сь","чим-дуж, що-миті, хіба-що"],"a":1},
{"id":"chastka.15","q":"Частку вжито в реченні","opts":["Крізь вікно пробивалися сонячні промінчики.","Це пояснення навіть я зрозуміла.","Овва, який ти силач!","Що посієш, те пожнеш.","Усупереч обставинам ми погодилися на цю роботу."],"a":1},
{"id":"chastka.16","q":"Правильно написано частки з іншими частинами мови в рядку","opts":["анічий, казнаде, котрийсь","тількищо, авжеж, абияк","зроби-но, таки-написав, нібито","щонайдужче, так-то, коли б","деінде, як-от, всього на всього"],"a":3}

{"id":"zaimennyk.22","q":"Виділене слово є займенником у реченні","opts":["Казка — це свіжий вітер, [[що]] роздмухує вогник дитячої мрії.","Я тобі сказати хочу, друже, [[що]] мрій дитячих я не розгубив.","Так тихо, спокійно, [[що]] хочеться сісти на човен і попливти.","Пам'ятайте, [[що]] книги — це тисячолітня мудрість людини.","Здавалося, [[що]] якийсь чарівник убрав дерева в золоті шати."],"a":0},
{"id":"zaimennyk.23","q":"Виділене слово є займенником у реченні","opts":["Мак облітає так швидко, [[що]] не встигає зів'янути.","Неба було так багато, [[що]] очі тонули в ньому, як у морі.","Як добре знати, [[що]] тебе веде твій власний шлях.","У парі з тобою ми будем любити усе, [[що]] на серце лягло.","Криниця ця така глибока, [[що]] видно зорі з неї і у ній."],"a":3},
{"id":"zaimennyk.24","q":"Виділене слово є займенником у реченні","opts":["Чому не знало серце молоде, [[що]] тільки мати може вічно ждати?","Знай, [[що]] в світі найтяжче — це серце носить студене.","Стояла така тиша, [[що]] було чути, як плаче надламана гілка.","Хіба не бачите, [[що]] вся земля в якімсь чеканні дивнім мліє.","Не знаю я, [[що]] буде після нас, в які природа убереться шати."],"a":4},

{"id":"diyeslovo-sposoby.30","q":"Форму наказового способу дієслова вжито в реченні","opts":["Музеї Львова гостинно запрошують туристів.","Не варто піддаватися спокусам реклами.","Хто може нині обійтися без комп'ютера?","Хай не розбудить смутку телефон.","Шукати славу — суєта, здобути славу — щастя!"],"a":3},
{"id":"diyeslovo-sposoby.31","q":"Форму наказового способу дієслова вжито в значенні дійсного в реченні","opts":["Не копай іншому яму, бо сам туди впадеш.","Тільки на правду складаймо надії.","Ступай упевнено, не бійся, відважним будь.","Глянь на двір, а тоді питай про господаря.","Дівчата на вулиці гуляють, а ти вечерю готуй."],"a":4},
{"id":"diyeslovo-sposoby.32","q":"Форму наказового способу дієслова вжито в значенні дійсного в реченні","opts":["Не дай мені, доле, з байдужістю знатись.","А хтось візьми та й пусти чутку про козака-характерника.","Навчайся чужого розуму, але й свого не губи.","Берімося краще до роботи, змагаймося за нове життя.","Хоч би сова попід небом літала, та соколом не буде."],"a":1},
{"id":"diyeslovo-sposoby.33","q":"Форму дійсного способу вжито в значенні іншого в реченні","opts":["Судженого конем не об'їдеш.","Мовчки розмовляєш із деревами.","Вивчиш вірш, а тоді відпочивай.","Як працюєш, так і житимеш.","Насильно милим не будеш."],"a":2},
{"id":"diyeslovo-sposoby.34","q":"Форму умовного способу дієслова вжито в значенні наказового в реченні","opts":["Чи не приніс би ти мені підручник із біології?","Я б навіть сонцю одягнула вінок із колосків.","Кіт їв би рибу, та лап не хоче мочити.","Якби знав, де впадеш, то соломки підстелив би.","Риба співала б, коли б голос був."],"a":0},
{"id":"diyeslovo-sposoby.35","q":"Форму одного способу вжито в значенні іншого в реченні","opts":["Допоможи мені, будь ласка, розв'язати задачу.","Сьогодні підготуємося до контрольної з фізики.","Доведеться на завтра підготувати презентацію.","Учасників походу попросили залишитися в класі.","Ви читаєте, а я тим часом перевірю диктант."],"a":4},
{"id":"diyeslovo-sposoby.36","q":"Форму одного способу вжито в значенні іншого в реченні","opts":["Після уроків приходьте в актову залу на репетицію.","Будь чесним насамперед із самим собою.","Скажи ти мені це відразу — я встиг би тобі допомогти.","Криши, ламай, трощи стереотипи.","Дозволь собі завтра добре відпочити."],"a":2},

{key:"diyeprykmetnyk",title:"Дієприкметник",qs:[
{"id":"diyeprykmetnyk.0","q":"Дієприкметники виділено в усіх словосполученнях, ОКРІМ","opts":["<i>засмаглі</i> діти","<i>розв'язувані</i> задачі","<i>підготовлені</i> хористи","<i>прохололий</i> сніданок","<i>радісне</i> хлоп'ятко"],"a":4},
{"id":"diyeprykmetnyk.1","q":"Дієприкметник є в кожному реченні, ОКРІМ","opts":["Йде весна запашна, квітами-перлами закосичена.","Серпанками прикрита, слуха солов'я срібна ніч.","Десь, колись, в якійсь країні проживав поет нещасний.","Ніхто не годен вищі барви вбити, даровані мені святим чуттям.","Тебе у далеч владно закликає напоєна надіями пітьма."],"a":2},
{"id":"diyeprykmetnyk.2","q":"Дієприкметник виділено в прислів'ї","opts":["Решетом воду не <i>носять</i>.","За одного <i>битого</i> двох небитих дають.","Добрий кожух, та не на мене <i>шитий</i>.","У <i>ледачого</i> руки не болять.","Шилом моря не <i>нагрієш</i>."],"a":2},
{"id":"diyeprykmetnyk.3","q":"Прочитайте уривок із поезії <i>(цифра в дужках позначає наступне слово)</i>.<span class='quote'>Слів твоїх (1)колений лід<br>Впав у (2)заметений слід,<br>В тиху (3)засніженість дум,<br>В мій (4)нерозказаний сум.<br>На ожеледь наших доріг<br>Лягає (5)зажурений сніг.</span>Дієприкметники позначено всіма цифрами, ОКРІМ","opts":["1","2","3","4","5"],"a":2},
{"id":"diyeprykmetnyk.4","q":"Прочитайте речення <i>(цифра в дужках позначає наступне слово)</i>.<span class='quote'>На галявину вискакує з гущини сарна й, (1)зачарована (2)чудовим концертом, зупиняється, (3)витяга цікаву мордочку до (4)кривавої смуги обрію та (5)слуха.</span>Дієприкметник позначено цифрою","opts":["1","2","3","4","5"],"a":0},
{"id":"diyeprykmetnyk.5","q":"Прочитайте речення <i>(цифра в дужках позначає наступне слово)</i>.<span class='quote'>Весна постукала в (1)прозорий кришталь вікон і, (2)торкнувшись серця (3)лоскітливим подихом травня, (4)невтримно поманила в (5)замріяний гай.</span>Дієприкметник позначено цифрою","opts":["1","2","3","4","5"],"a":4},
{"id":"diyeprykmetnyk.6","q":"Прочитайте речення <i>(цифра в дужках позначає наступне слово)</i>.<span class='quote'>Проліски (1)схожі на (2)мерехтливі намистинки, (3)розгублені чиєюсь (4)невинною рукою між вузеньких листочків (5)боязкої травиці.</span>Дієприкметник позначено цифрою","opts":["1","2","3","4","5"],"a":2},
{"id":"diyeprykmetnyk.7","q":"Дієприкметниками є всі слова в рядку","opts":["зніяковілий, змужнілий, існуючий","упорядкований, виконувана, в'ялий","пом'якшений, м'який, зм'якшений","працьовитий, працюючий, опрацьований","дрібненький, здрібнілий, подрібнений"],"a":0},
{"id":"diyeprykmetnyk.8","q":"НЕ ПОТРЕБУЄ редагування словосполучення у варіанті","opts":["плакучі верби","конкуруючі фірми","подорожуючі студенти","початкуючі художники","стоячі пасажири"],"a":0},
{"id":"diyeprykmetnyk.9","q":"НЕ ПОТРЕБУЄ редагування словосполучення у варіанті","opts":["бувші випускники","діюче законодавство","головуючий на зборах","відстаючий учень","ходяча енциклопедія"],"a":4},
{"id":"diyeprykmetnyk.10","q":"НЕ ПОТРЕБУЄ редагування словосполучення у варіанті","opts":["вируюче море","захоплююча повість","перемігший у конкурсі","балакуча сусідка","мандруючий сюжет"],"a":3},
{"id":"diyeprykmetnyk.11","q":"Дієприкметниковий зворот є в реченні","opts":["Я зачарований красою карпатських краєвидів.","Давні могили-кургани порозкидані серед степового роздолля.","Холодить розпашілі обличчя м'яка гірська прохолода.","На полонині пахло охолодженою за ніч землею.","Вечірнє повітря напоєне запахом скошених трав."],"a":3},
{"id":"diyeprykmetnyk.12","q":"Дієприкметниковий зворот є в реченні","opts":["На сизих луках скошено траву, і літо буйне в береги ввійшло.","Через вікно зазирнув клапоть неба, присипаний срібним пилом.","Під дубом зеленеьким кінь утомлений стоїть.","За один рідний звук ладен буваєш заплатити роком життя.","Заспівали тяжкі краплини, спадаючи з листя й квіту на землю."],"a":1},
{"id":"diyeprykmetnyk.13","q":"Граматичну помилку допущено в реченні","opts":["Ми розмістилися на добре вимощеному возі свіжою травою.","Невеличка Джерина пасіка була обгороджена низьким тином.","Над усе любив Іван гори, ліси, зелені луки, пропахлі роменом.","Нарівні з вікном тьмяно біліли припорошені пилом розквітлі акації.","Гарячі коні помахували головами, обтиканими виноградним листом."],"a":0},
{"id":"diyeprykmetnyk.14","q":"Граматичну помилку допущено в реченні","opts":["Під насупленими волохатими бровами дідуся запали розумні сірі очі.","Корній, овіяний весняним вітром, тепер виношував новий задум.","Розбуджені громом, умиті дощами, хлібороби оглядали поля.","Нагріта за день весняним сонцем, чорна рілля дихала парою.","Ожила земля, скупана в молочних випарах ранкових туманів."],"a":2},
{"id":"diyeprykmetnyk.15","q":"НЕ потребує редагування словосполучення","opts":["ідучий хлопець","біжуча дівчина","починаючий лікар","уживаний препарат"],"a":3},
{"id":"diyeprykmetnyk.16","q":"НЕ потребує редагування словосполучення","opts":["бувша назва","плачуча дитина","діюча норма","звана вечеря"],"a":3},
{"id":"diyeprykmetnyk.17","q":"НЕ потребує редагування словосполучення","opts":["мандруючі незнайомці","головуючий на дільниці","усвідомлена помилка","захоплюючий сюжет"],"a":2},
{"id":"diyeprykmetnyk.18","q":"Потребує редагування речення","opts":["Написаний твір братом рекомендували на участь у конкурсі.","Засипаний снігом яр приховував небезпеку для подорожніх.","Посаджений батьком сад цього року подарував багатий врожай.","Приклеєна до стіни інструкція притягувала погляди всіх пасажирів."],"a":0},
{"id":"diyeprykmetnyk.19","q":"Потребує редагування речення","opts":["Гілки гнуться до землі під вагою налитих сонцем яблук.","Екскурсовод звернувся до одягненої в синє пальто жінки.","Тато попросив сходити з ним по забутий у старому лісі візок.","Фламінго приземлилися біля залитої балки весняною повінню."],"a":3},
{"id":"diyeprykmetnyk.20","q":"Помилково вжито слово в рядку","opts":["завідувач відділу","знеболювальні таблетки","біжучий рядок","застарілий засіб","биткий посуд"],"a":2},
{"id":"diyeprykmetnyk.21","q":"Правильно утворено всі форми дієприкметників у рядку","opts":["проспіваний, принесений, тертий","зрошений, читаючий, випивший","правлячий, бувший, зметений","товчений, засохлий, граючийся","здобувший, виконаний, потемнілий"],"a":0},
{"id":"diyeprykmetnyk.22","q":"Лексичну помилку допущено в рядку","opts":["чинне законодавство","проживаючий у Харкові","змінений режим","місця для відпочивальників","ведучий телепрограми"],"a":1},
{"id":"diyeprykmetnyk.23","q":"НЕПРАВИЛЬНО побудовано речення","opts":["Порушена у вчорашньому номері газети тема безкоштовної медицини є вкрай актуальною.","Написаний у домашньому зошиті твір треба здати на перевірку.","Я так і не знайшла записаний на папірці номер телефону.","Куплений кавун у магазині виявився надзвичайно смачним.","Завезених у шкільну бібліотеку підручників було недостатньо."],"a":3},
{"id":"diyeprykmetnyk.24","q":"Дієприкметниками є всі слова рядка","opts":["мийний, вимитий, помивши","надрукований, друкувальний, друкарський","намальований, перемальований, змальований","створений, творчий, перетворений","накреслений, креслярський, накресливши"],"a":2},
{"id":"diyeprykmetnyk.25","q":"НЕПРАВИЛЬНО побудовано речення","opts":["Умиті росами ноги ломило від холоду.","Я вийшла з тролейбуса, й мені впало в око намальоване на стіні яскраве графіті.","Запечена в духовці картопля — моя найулюбленіша страва.","На день народження друзі подарували мені сплетене гачком плаття.","Ми з однокласниками дуже швидко зрозуміли пояснені правила учителем."],"a":4},
{"id":"diyeprykmetnyk.26","q":"Редагування НЕ ПОТРЕБУЄ словосполучення","opts":["початкуючий художник","пляж для відпочиваючих","почорнівші стебла","несуча конструкція","прилегла поверхня"],"a":4}
]},
// ---- Дієприслівник (25) ----
{key:"diyeprysliv",title:"Дієприслівник",qs:[
{"id":"diyeprysliv.0","q":"Дієприслівниками є всі слова в рядку","opts":["залишивши, залишаючи, залишені","читаючи, прочитавши, дочитуючи","тремтячи, тремтячі, затремтівши","засинаючи, заснувши, заснулий","вишиваючи, вишитий, вишивши"],"a":1},
{"id":"diyeprysliv.1","q":"Дієприслівник є в кожному реченні, ОКРІМ","opts":["Не знаючи броду, не лізь у воду.","Подорожуючи, не пускай коня галопом.","Залізо випробовують куючи.","Під лежачий камінь вода не тече.","Не спечеш калачі, сидячи на печі."],"a":3},
{"id":"diyeprysliv.2","q":"Дієприслівники недоконаного виду можна утворити від обох дієслів варіанта","opts":["зажуритися, співати","зітхати, замислитися","жити, похнюпитися","дивитися, полювати","пізнати, усміхатися"],"a":3},
{"id":"diyeprysliv.3","q":"Помилковою є форма дієприслівника в рядку","opts":["подзвонивши, віддзвонюючи, піднісши","відчиняючи, відчинивши, приготуючи","опинившись, жовтіючи, прижовкнувши","готуючись, приготувавши, повертаючи","плануючи, запланувавши, підносячи"],"a":1},
{"id":"diyeprysliv.4","q":"За допомогою суфікса <b>-ачи (-ячи)</b> можна утворити дієприслівники від обох дієслів варіанта","opts":["клеїти, боротися","сипати, лежати","ловити, стелити","кричати, колоти","стояти, плакати"],"a":2},
{"id":"diyeprysliv.5","q":"Дієприслівниковий зворот ужито в реченні","opts":["Тепер, співаючи, дівчата тією стежкою ідуть.","Дівчина крізь сльози безмовно кивнула головою і потисла козакові руку.","Незважаючи на втрати, настрій у бійців був піднесено войовничий.","Він не стогнав, він умирав стоячи й не знав, що так умирають у легендах.","З Ташані густою хвилею котилася пара, затоплюючи троянівську долину."],"a":4},
{"id":"diyeprysliv.6","q":"Одиничний дієприслівник ужито в реченні","opts":["Ненька встигала і хату побілити, і хліб спекти не поспішаючи.","Переступивши поріг, Остап почув у кімнаті знайомий голос.","Перекидаючи тісто з однієї долоні в іншу, мати формувала хлібину.","Сонце, сідаючи за гору, обливало світлом усе село.","Ідучи в широкий світ, візьму із собою материнську пісню."],"a":0},
{"id":"diyeprysliv.7","q":"Граматично правильне закінчення речення <i>Відпочиваючи в Карпатах</i> ... наведено в рядку","opts":["черпаєш силу від дрімучих соснових лісів.","соснові ліси напувають тебе цілющою силою.","мені хочеться оздоровитися в соснових лісах.","у тебе залишаться яскраві враження надовго.","повітря соснових лісів допоможе зняти втому."],"a":0},
{"id":"diyeprysliv.8","q":"Граматично правильне закінчення речення <i>Закінчивши школу</i> ... наведено в рядку","opts":["хочеться обрати правильний шлях у житті.","часто згадуються мої однокласники.","учителі побажали нам щасливої долі.","пам'ятайте мудрі поради своїх наставників.","життя приготувало для кожного випробування."],"a":3},
{"id":"diyeprysliv.9","q":"Граматично правильне закінчення речення <i>Готуючись до іспитів</i> ... наведено в рядку","opts":["увесь матеріал має бути повторений.","учень повторив увесь вивчений матеріал.","ретельно повторюються винятки з правил.","велику роль відіграють тренувальні вправи.","учитель рекомендує учням робити нотатки."],"a":1},
{"id":"diyeprysliv.10","q":"Граматично правильне закінчення речення <i>Переглянувши фільм «Поводир»</i> ... наведено в рядку","opts":["він нікого не залишив байдужим.","ми для себе відкрили світ українського кіно.","актори вразили своєю грою.","нас зацікавила історія кобзарства.","хочеться почути ваші враження."],"a":1},
{"id":"diyeprysliv.11","q":"Граматичну помилку допущено в реченні","opts":["Луги, струшуючи росу, розляглися співами солов'їв.","Сонце вже пригрівало, висушуючи рештки роси.","Дерева зеленіли, кидаючи густий затінок на вулицю.","Травень дощами проллється, укриваючи землю рястом.","Мандруючи горами, учнями було зібрано колекцію рослин."],"a":4},
{"id":"diyeprysliv.12","q":"Граматичну помилку допущено в реченні","opts":["Ледь чутно курликаючи, летіли журавлі.","Блискавиці шматували небо, розколюючи хмари.","Прощався з літом я, блукаючи лугами.","Зламавши кригу, річкою залило всю заплаву.","Хвилі тихо шелестіли, котячись на берег."],"a":3},
{"id":"diyeprysliv.13","q":"Граматичну помилку допущено в реченні","opts":["Наївшись огіркових пуп'янків, Сашко натрапив на моркву.","Тікаючи від дідового кашлю, хлопець стрибнув прямо в тютюн.","Кинувшись через тютюн у сад, я бухнувся з розгону на коліна.","Не знаючи, куди піти, я тихо поповз у густу малину.","Причаївшись у малині, мене наздогнали бабині молитви."],"a":4},
{"id":"diyeprysliv.14","q":"Граматичну помилку допущено в усіх реченнях, ОКРІМ","opts":["Визирнувши у вікно, на вулиці йшов сніг.","Зайшовши в парк, від снігу іскряться ялинки.","Готуючи вечерю, я слухаю новини по радіо.","Побачивши матір, у мене забилося серце.","Я купив цього собаку ще будучи цуценям."],"a":2},
{"id":"diyeprysliv.15","q":"Граматично правильне закінчення речення <i>«Прочитавши повість ...»</i> наведено в рядку","opts":["хочеться трохи прогулятися на вулиці.","сонце заховалося за небокрай.","я розповіла про неї своїй подрузі.","за вікном прогриміла гроза."],"a":2},
{"id":"diyeprysliv.16","q":"Граматично правильне закінчення речення <i>«Збираючи ягоди ...»</i> наведено в рядку","opts":["вони потроху випадають із кошика.","наспівую свій улюблений мотив.","хочеться перерватися на відпочинок.","сонце ховається за густі сірі хмари."],"a":1},
{"id":"diyeprysliv.17","q":"Граматичну помилку допущено в реченні","opts":["Наповнюючи ванну, стежте за рівнем води.","Зайшовши до лісу, ми помітили двох білочок.","Увімкнувши комп'ютер, запустіть антивірусну програму.","Заїхавши у двір, Пірат вискочив зі свого лігва й загарчав."],"a":3},
{"id":"diyeprysliv.18","q":"Граматичну помилку допущено в реченні","opts":["Рибалки йдуть берегом, тримаючи в руках вудки.","Закинувши останню вудку, риба почала скидатися.","Мій товариш тягне довгу ліску, примруживши очі.","Наловивши трохи риби, повертаємося додому."],"a":1},
{"id":"diyeprysliv.19","q":"Дієприслівник ужито в реченні","opts":["Трудяща копійка годує довіку.","Що записано пером, того не вирубаєш топором.","Грамотний — видющий і на все тямущий.","Не почавши — не закінчиш.","Із добрим дружись, а лихих стережись!"],"a":3},
{"id":"diyeprysliv.20","q":"НЕПРАВИЛЬНО побудовано речення","opts":["Бігаючи вранці, я відчуваю заряд бадьорості цілий день.","Зателефонувавши додому, мені ніхто не відповів.","Прибираючи в кімнаті, я нарешті знайшла бібліотечну книгу.","Повернувшись додому, ми одразу почали готувати обід.","Читаючи книгу, намагайтеся не відволікатися на інші справи."],"a":1},
{"id":"diyeprysliv.21","q":"Граматичну помилку допущено в реченні","opts":["Коли ми повернулися додому, нас зустрічав сусідський пес.","Нам назустріч вибіг сусідський пес, коли ми повернулися додому.","Повертаючись додому, ми почули гавкіт сусідського пса.","Повернувшись додому, до нас вибіг сусідський пес.","Ми повернулись додому, і сусідський пес вибіг нам назустріч."],"a":3},
{"id":"diyeprysliv.22","q":"Граматично правильне продовження речення <i>«Віддаючи техніку в ремонт, ...»</i> наведено в рядку","opts":["переконайтесь, що Вам видали квитанцію.","майстер повинен видати Вам квитанцію.","у центрі обслуговування Вам мають запропонувати її аналог для користування.","майстер може ремонтувати її щонайбільше 14 днів.","її можуть зламати ще більше."],"a":0},
{"id":"diyeprysliv.23","q":"Граматично правильне речення утвориться, якщо до фрагмента <i>«Прослухавши пісню, ...»</i> додати","opts":["мене охопила ностальгія.","я згадала деякі моменти свого дитинства.","у моїй пам'яті зринули дитячі спогади.","мені згадалося дитинство.","вона пробудила в мені дитячі спогади."],"a":1},
{"id":"diyeprysliv.24","q":"Лише дієприслівники вжито в усіх рядках, ОКРІМ","opts":["говорячи, фарбуючи, знаючи","ріжучи, мажучи, сяючі","миючи, помилившись, поливаючи","встановлюючи, роблячи, копаючи","лежачи, обнімаючи, співаючи"],"a":1}
]},

{key:"prysliv",title:"Прислівник",qs:[
{"id":"prysliv.0","q":"Лише прислівники записано в рядку","opts":["здавна, споконвіків, тут, з-поперед","так-сяк, голіруч, якщо, нашвидкуруч","знадвору, восени, будь-коли, знову","упереміш, казна-який, нині, по-заячи"],"a":2},
{"id":"prysliv.1","q":"Лише прислівники записано в рядку","opts":["нарівні, зрештою, якби, наостанок","анітелень, обабіч, нарозхват, замолоду","довкола, напереріз, віч-на-віч, навіть","наздогад, згарячу, дано, де-не-де"],"a":1},
{"id":"prysliv.2","q":"З'ясуйте кількість прислівників у реченні.<br><i>Часом і досі здається мені, що й зараз поклепай хто-небудь косу під моїм вікном, я зразу помолодшав би.</i>","opts":["2","3","4","5"],"a":2},
{"id":"prysliv.3","q":"З'ясуйте кількість прислівників в уривку.<br><i>Земля у мене захиталась під ногами,<br>Неначе море раптом вийшло з берегів.<br>Де є кохання, там не може бути зради.<br>Я вже не вірю в те, що ти мене любив.</i>","opts":["3","4","5","6"],"a":1},
{"id":"prysliv.4","q":"Форми ступенів порівняння можна утворити від усіх прислівників варіанта","opts":["гаряче, холодно, уперто","тепло, твердо, бездонно","м'яко, відкрито, заодно","низько, високо, чимало"],"a":0},
{"id":"prysliv.5","q":"Форми ступенів порівняння можна утворити від усіх прислівників рядка","opts":["вузько, світло, занадто","потужно, задовго, корисно","радісно, швидко, глибоко","заможно, гучно, забагато"],"a":2},
{"id":"prysliv.6","q":"Прислівник є в кожному реченні, ОКРІМ","opts":["Нестерпно бути мертвим за життя.","Ніде щиріше не співають, як на війні.","Тут погідне сонце, а десь за горами вітер.","Ліс ще дрімає в передранішній тиші.","Глянь кругом себе — рай найкращий."],"a":4},
{"id":"prysliv.7","q":"Прислівник є в кожному реченні, ОКРІМ","opts":["І ось поблизу зашелестіли кущі.","Десь бриніла притишена пісня.","Було нам добре і було нам зле.","Обабіч шляху зеленіє озимина.","Часом блимне вогонь і зникне."],"a":3},
{"id":"prysliv.8","q":"Помилку в утворенні форми ступеня порівняння прислівника допущено в рядку","opts":["швидко — швидше","холодно — холодніше","погано — поганіше","добре — краще","низько — нижче"],"a":2},
{"id":"prysliv.9","q":"Помилку в утворенні форми ступеня порівняння прислівника допущено в рядку","opts":["часто — частіше","тихо — тихіше","близько — близькіше","дорого — дорожче","яскраво — яскравіше"],"a":2},

const TEST_SIZE = 20;

const POOL = [];
const POOL_BY_ID = {};
BANKS.forEach(function(b){
  b.qs.forEach(function(q){
    const item = Object.assign({}, q, {topic: b.title, topicKey: b.key});
    POOL.push(item);
    POOL_BY_ID[item.id] = item;
  });
});

function shuffle_(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// chosenIds — id завдань, що потрапили в цю спробу, у порядку показу.
// Зберігаються в прогресі та в посиланні розбору (?qset=...), тож і
// відновлення сторінки, і розбір у вчителя показують ТІ САМІ завдання.
let chosenIds = [];
let QUESTIONS = [];

function buildFromIds_(ids){
  chosenIds = ids.filter(function(id){ return POOL_BY_ID[id]; });
  QUESTIONS = chosenIds.map(function(id){ return POOL_BY_ID[id]; });
}

function pickIds_(){
  const byTopic = BANKS.map(function(b){ return shuffle_(b.qs.map(function(q){ return q.id; })); });
  let order = shuffle_(byTopic.map(function(_, i){ return i; }));
  const out = [];
  while(out.length < TEST_SIZE && byTopic.some(function(a){ return a.length; })){
    for(let k = 0; k < order.length && out.length < TEST_SIZE; k++){
      const arr = byTopic[order[k]];
      if(arr.length) out.push(arr.pop());
    }
    order = shuffle_(order);
  }
  return shuffle_(out);
}

function rollNewSet_(){
  buildFromIds_(pickIds_());
}

let studentName = "";
let started = false;
let reportSent = false;
let finished = false;

// ---------- Збереження прогресу (localStorage) ----------
function progressKey_(){
  return 'quizProgress::' + location.pathname + '::' + studentName;
}
function saveProgress_(){
  try{
    localStorage.setItem(progressKey_(), JSON.stringify({
      answers, flags, matchDraft, qIdx, finished, chosenIds, ts: Date.now()
    }));
  }catch(e){}
}
function loadProgress_(){
  try{
    const raw = localStorage.getItem(progressKey_());
    if(!raw) return null;
    const data = JSON.parse(raw);
    if(!Array.isArray(data.chosenIds) || !data.chosenIds.length) return null;
    // якщо банк питань змінився і якогось id більше немає — стару спробу не відновлюємо
    if(!data.chosenIds.every(function(id){ return POOL_BY_ID[id]; })) return null;
    return data;
  }catch(e){ return null; }
}
function clearProgress_(){
  try{ localStorage.removeItem(progressKey_()); }catch(e){}
}
function applySaved_(saved){
  buildFromIds_(saved.chosenIds);
  answers = saved.answers || {};
  flags = saved.flags || {};
  matchDraft = saved.matchDraft || {};
  qIdx = typeof saved.qIdx === 'number' ? saved.qIdx : 0;
  finished = !!saved.finished;
}

const quizArea = document.getElementById('quizArea');
document.getElementById('totalTag').textContent = TEST_SIZE + " завдань";

function renderOpt(o){
  return o.replace(/\[\[([^\]]+)\]\]/g, '<u>$1</u>');
}

function scoreOverall(){
  let correct = 0, answered = 0;
  QUESTIONS.forEach((_,i)=>{
    const rec = answers[i];
    if(rec){ answered++; if(rec.correct) correct++; }
  });
  return {correct, answered, total: QUESTIONS.length};
}

function topicStats_(){
  const order = [], map = {};
  QUESTIONS.forEach((q,i)=>{
    if(!map[q.topic]){ map[q.topic] = {topic:q.topic, ok:0, total:0}; order.push(q.topic); }
    map[q.topic].total++;
    const rec = answers[i];
    if(rec && rec.correct) map[q.topic].ok++;
  });
  return order.map(t=>map[t]);
}

  try{ await window.storage.delete('student_name_imennyk'); }catch(e){}
}

// ---- Посилання "розбір відповідей" ----
// ?review=1&name=...&qset=id1,id2,...&ans=0-2,1-0,2-1.3.0.2,...
// (у відповіді на завдання на відповідність вибір кожного рядка — через крапку)
function buildReviewLink(){
  const pairs = [];
  QUESTIONS.forEach((_,i)=>{
    const rec = answers[i];
    if(rec) pairs.push(i + '-' + rec.picked);
  });
  const ansStr = pairs.join(',');
  const flagStr = Object.keys(flags).filter(i=>flags[i]).join(',');
  const base = location.origin + location.pathname;
  let url = `${base}?review=1&name=${encodeURIComponent(studentName)}&qset=${encodeURIComponent(chosenIds.join(','))}&ans=${ansStr}`;
  if(flagStr) url += `&flags=${flagStr}`;
  return url;
}

function parseReviewParam(){
  const params = new URLSearchParams(location.search);
  if(params.get('review') !== '1') return false;
  const name = params.get('name');
  const ansParam = params.get('ans');
  const qsetParam = params.get('qset');
  if(!ansParam || !qsetParam) return false;

  buildFromIds_(qsetParam.split(','));
  if(!QUESTIONS.length) return false;

  studentName = name || 'Учень';
  answers = {};
  ansParam.split(',').forEach(pair=>{
    const dash = pair.indexOf('-');
    if(dash < 0) return;
    const i = Number(pair.slice(0, dash));
    const valStr = pair.slice(dash + 1);
    if(Number.isNaN(i) || i < 0 || i >= QUESTIONS.length) return;
    const q = QUESTIONS[i];
    if(q.type === 'match'){
      const picks = valStr.split('.').map(Number);
      if(picks.length !== q.left.length || picks.some(v=>Number.isNaN(v))) return;
      answers[i] = {picks, picked: valStr, correct: picks.every((pk,k)=>pk === q.a[k])};
    } else {
      const picked = Number(valStr);
      if(Number.isNaN(picked)) return;
      answers[i] = {picked, correct: picked === q.a};
    }
  });

  flags = {};
  const flagsParam = params.get('flags');
  if(flagsParam){
    flagsParam.split(',').forEach(s=>{
      const i = Number(s);
      if(!Number.isNaN(i)) flags[i] = true;
    });
  }

  started = true;
  reviewMode = true;
  qIdx = 0;
  return true;
}

function startOrRestore_(){
  const saved = loadProgress_();
  if(saved){ applySaved_(saved); }
  else { rollNewSet_(); qIdx = 0; answers = {}; flags = {}; matchDraft = {}; finished = false; }
}

function renderNameScreen(prefill){
  quizArea.innerHTML = `
    <div class="name-screen">
      <label for="nameInput">Як тебе звати?</label>
      <input type="text" id="nameInput" placeholder="Ім'я" autocomplete="off" value="${prefill ? prefill.replace(/"/g,'&quot;') : ''}">
      <button class="btn primary" id="startBtn" style="width:100%;justify-content:center;">Почати тест</button>
    </div>
  `;
  const input = document.getElementById('nameInput');
  const startBtn = document.getElementById('startBtn');
  input.focus();
  const go = async ()=>{
    const val = input.value.trim();
    studentName = val || "Без імені";
    await setStoredName(studentName);
    started = true;
    startOrRestore_();
    renderQuiz();
  };
  startBtn.onclick = go;
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') go(); });
}

async function sendTelegramReport(){
  const {correct, total, answered} = scoreOverall();
  const wrongList = [];
  const flaggedList = [];
  QUESTIONS.forEach((_,i)=>{
    const rec = answers[i];
    const num = i + 1;
    if(rec && !rec.correct) wrongList.push(num);
    if(flags[i]) flaggedList.push(num);
  });
  const topics = topicStats_().map(t=>`${t.topic}: ${t.ok}/${t.total}`).join('; ');
  const wrongTopics = QUESTIONS.map((q,i)=> (answers[i] && !answers[i].correct) ? (i+1) + ' — ' + q.topic : null).filter(Boolean).join('; ');

  const reviewLink = buildReviewLink();
  const statusEl = document.getElementById('sendStatus');

  const ok = await logToSheet({
    type: "quiz_result",
    student: studentName,
    testName: "Морфологія: загальний тест",
    correct, answered, total,
    wrongList,
    flaggedList,
    reviewLink,
    topics,
    wrongTopics
  });

  if(ok){
    reportSent = true;
    clearProgress_();
    if(statusEl){ statusEl.textContent = 'Результат надіслано вчителю ✓'; statusEl.className = 'send-status ok'; }
  } else if(statusEl){
    statusEl.innerHTML = 'Не вдалося надіслати результат (перевірте інтернет). Прогрес збережено, спробуйте ще раз.<br><button class="btn ghost small" id="retrySendBtn" style="margin-top:8px;">Спробувати ще раз</button>';
    statusEl.className = 'send-status bad';
    const retryBtn = document.getElementById('retrySendBtn');
    if(retryBtn) retryBtn.onclick = ()=>{
      statusEl.textContent = 'Надсилаємо результат...';
      statusEl.className = 'send-status';
      sendTelegramReport();
    };
  }
}

function matchAnswerStr(q){
  return q.a.map((x,i)=> (i+1) + '–' + LETTERS[x]).join(', ');
}

function renderMatchBody(q, rec){
  const locked = !!rec || reviewMode;
  const picks = rec ? rec.picks : (matchDraft[qIdx] || q.left.map(()=>-1));
  const ex = q.opts.map((o,i)=>`
      <div class="mex"><span class="tile"><span>${LETTERS[i]}</span></span><span>${renderOpt(o)}</span></div>`).join('');
  const rows = q.left.map((lab,r)=>{
    const btns = q.opts.map((_,i)=>{
      const sel = picks[r] === i;
      const isRight = q.a[r] === i;
      let cls = 'mbtn', badge = '';
      if(locked){
        if(isRight){ cls += ' correct'; badge = '<span class="badge ok">✓</span>'; }
        else if(rec && sel){ cls += ' wrong'; badge = '<span class="badge no">✕</span>'; }
      } else if(sel){
        cls += ' sel';
      }
      return `<button type="button" class="${cls}" data-r="${r}" data-i="${i}" ${locked?'disabled':''}>${LETTERS[i]}${badge}</button>`;
    }).join('');
    return `<div class="mrow"><div class="mlab"><b>${r+1}</b>${lab}</div><div class="mbtns">${btns}</div></div>`;
  }).join('');
  const allPicked = picks.every(v=>v >= 0);
  return `
    <div class="mhead">${q.optsHead || 'Варіанти'}</div>
    <div class="mex-list">${ex}</div>
    <div class="mhead">${q.leftHead || 'Завдання'}</div>
    <div class="mgrid">${rows}</div>
    ${locked ? '' : `<button class="btn primary" id="checkBtn" style="margin-top:16px;" ${allPicked?'':'disabled'}>Перевірити</button>`}`;
}

function renderQuiz(){
  document.getElementById('reviewBanner').classList.toggle('show', reviewMode);

  if(!started){ renderNameScreen(); return; }

  const total = QUESTIONS.length;

  if(qIdx >= total || finished){
    const {correct, answered} = scoreOverall();
    const stats = topicStats_().map(t=>{
      const color = t.ok === t.total ? 'var(--correct-ink)' : (t.ok === 0 ? 'var(--wrong-ink)' : 'var(--ink)');
      return `<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;"><span>${t.topic}</span><b style="color:${color};white-space:nowrap;">${t.ok}/${t.total}</b></div>`;
    }).join('');
    quizArea.innerHTML = `
      <div class="done-screen">
        <div class="ring"><div class="big">${correct}/${answered}</div></div>
        <p class="sub" style="margin:0 auto 4px;">${studentName} · Морфологія · відповідано ${answered} з ${total}</p>
        <div style="text-align:left;margin:16px 0 4px;"><div class="mhead">Результат за темами</div>${stats}</div>
        ${reviewMode ? '' : `<div class="send-status" id="sendStatus">Надсилаємо результат...</div>
        <button class="btn primary" id="restartBtn" style="margin-top:14px;">Пройти ще раз</button>`}
      </div>`;
    if(!reviewMode){
      document.getElementById('restartBtn').onclick = ()=>{
        answers = {}; flags = {}; matchDraft = {};
        qIdx = 0; reportSent = false; finished = false;
        clearProgress_();
        rollNewSet_();
        saveProgress_();
        renderQuiz();
      };
      saveProgress_();
      if(!reportSent){
        sendTelegramReport();
      }
    }
    return;
  }

  const q = QUESTIONS[qIdx];
  const rec = answers[qIdx];
  const {correct, answered} = scoreOverall();
  const isFlagged = !!flags[qIdx];

  let segs = '';
  QUESTIONS.forEach((_,i)=>{
    const r = answers[i];
    let cls = i===qIdx ? 'current' : (r ? (r.correct?'done-correct':'done-wrong') : '');
    segs += `<div class="seg ${cls}" data-i="${i}"></div>`;
  });

  const canGoNext = rec || reviewMode;
  const isMatch = q.type === 'match';
  const ansStr = isMatch ? matchAnswerStr(q) : LETTERS[q.a];
  const optionsHtml = isMatch ? renderMatchBody(q, rec) : `<div class="options">
      ${q.opts.map((o,i)=>`
        <button class="opt" data-i="${i}" ${(rec||reviewMode)?'disabled':''}>
          <span class="tile"><span>${LETTERS[i]}</span></span><span>${renderOpt(o)}</span>
        </button>`).join('')}
    </div>`;

  quizArea.innerHTML = `
    <div class="progress-row">
      <div class="qnum">${studentName} · Питання ${qIdx+1} з ${total}</div>
      <div style="display:flex;align-items:center;gap:10px;">
        ${!reviewMode ? `<button id="flagBtn" type="button" title="Позначити, якщо незрозуміло" style="background:${isFlagged?'#FFE27A':'none'};border:none;cursor:pointer;font-size:13px;line-height:1;padding:4px 7px;border-radius:8px;opacity:${isFlagged?'1':'0.3'};">❓</button>` : ''}
        <div class="score">${correct}/${answered||0}</div>
      </div>
    </div>
    ${reviewMode ? `<p class="sub" style="margin:0 0 6px;font-weight:600;">Тема: ${q.topic}</p>` : ''}
    ${reviewMode && isFlagged ? `<p class="sub" style="color:#B8860B;font-weight:700;margin:0 0 6px;">❓ Учень позначив це питання як незрозуміле</p>` : ''}
    <div class="segbar">${segs}</div>
    <p class="qtext">${q.q}</p>
    ${optionsHtml}
    <div class="feedback ${rec ? 'show '+(rec.correct?'ok':'bad') : (reviewMode ? 'show bad' : '')}" id="fb">
      ${rec
        ? (rec.correct ? `<span><b>Правильно.</b> Відповідь — ${ansStr}.</span>` : `<span>Правильна відповідь — ${ansStr}.</span>`)
        : (reviewMode ? `<span>Учень не відповів. Правильна відповідь — ${ansStr}.</span>` : '')}
    </div>
    <div class="nav-row">
      <button class="btn ghost" id="prevBtn" ${qIdx===0?'disabled':''}>← Назад</button>
      <button class="btn primary" id="nextBtn" ${canGoNext?'':'disabled'}>${qIdx===total-1?'До результату':'Далі →'}</button>
    </div>
    ${reviewMode ? '' : `
    <div class="reset-row">
      <button class="btn ghost small" id="finishBtn">Завершити і надіслати результат</button>
      <button class="btn ghost small" id="changeNameBtn">Змінити ім'я</button>
    </div>`}
  `;

  if(!isMatch){
    if(rec){
      quizArea.querySelectorAll('.opt').forEach((btn,i)=>{
        const tile = btn.querySelector('.tile');
        if(i===q.a){
          btn.classList.add('correct');
          tile.insertAdjacentHTML('beforeend', '<span class="badge ok">✓</span>');
        } else if(i===rec.picked){
          btn.classList.add('wrong');
          tile.insertAdjacentHTML('beforeend', '<span class="badge no">✕</span>');
        } else {
          btn.classList.add('dim');
        }
      });
    } else if(reviewMode){
      quizArea.querySelectorAll('.opt').forEach((btn,i)=>{
        const tile = btn.querySelector('.tile');
        if(i===q.a){
          btn.classList.add('correct');
          tile.insertAdjacentHTML('beforeend', '<span class="badge ok">✓</span>');
        } else {
          btn.classList.add('dim');
        }
      });
    }
    quizArea.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick = ()=>{
        if(reviewMode) return;
        if(answers[qIdx]) return;
        const picked = +btn.dataset.i;
        answers[qIdx] = {picked, correct: picked===q.a};
        saveProgress_();
        renderQuiz();
      };
    });
  } else if(!rec && !reviewMode){
    quizArea.querySelectorAll('.mbtn').forEach(btn=>{
      btn.onclick = ()=>{
        const cur = (matchDraft[qIdx] || q.left.map(()=>-1)).slice();
        cur[+btn.dataset.r] = +btn.dataset.i;
        matchDraft[qIdx] = cur;
        saveProgress_();
        renderQuiz();
      };
    });
    const checkBtn = document.getElementById('checkBtn');
    if(checkBtn) checkBtn.onclick = ()=>{
      const picks = matchDraft[qIdx];
      if(!picks || picks.some(v=>v<0)) return;
      answers[qIdx] = {picks, picked: picks.join('.'), correct: picks.every((pk,k)=>pk === q.a[k])};
      delete matchDraft[qIdx];
      saveProgress_();
      renderQuiz();
    };
  }
  document.getElementById('prevBtn').onclick = ()=>{ qIdx--; clearDrawing(); if(!reviewMode) saveProgress_(); renderQuiz(); };
  document.getElementById('nextBtn').onclick = ()=>{ qIdx++; clearDrawing(); if(!reviewMode) saveProgress_(); renderQuiz(); };
  if(!reviewMode){
    const flagBtn = document.getElementById('flagBtn');
    if(flagBtn) flagBtn.onclick = ()=>{
      flags[qIdx] = !flags[qIdx];
      saveProgress_();
      renderQuiz();
    };
    document.getElementById('finishBtn').onclick = ()=>{
      const {answered} = scoreOverall();
      const msg = answered===0
        ? 'Ти ще не відповів на жодне питання. Завершити тест зараз?'
        : `Завершити тест зараз і надіслати результат (відповідено на ${answered} із ${total})?`;
      if(confirm(msg)){
        finished = true;
        saveProgress_();
        renderQuiz();
      }
    };
    document.getElementById('changeNameBtn').onclick = async ()=>{
      await clearStoredName();
      started = false;
      renderNameScreen(studentName);
    };
  }
  quizArea.querySelectorAll('.seg').forEach(d=>{
    d.onclick = ()=>{ qIdx = +d.dataset.i; if(!reviewMode) saveProgress_(); renderQuiz(); };
  });
}

async function init(){
  if(parseReviewParam()){
    renderQuiz();
    return;
  }
  const fromUrl = new URLSearchParams(location.search).get('student');
  if(fromUrl){
    studentName = fromUrl;
    started = true;
    startOrRestore_();
    renderQuiz();
    return;
  }
  const saved = await getStoredName();
  if(saved){
    studentName = saved;
    started = true;
    startOrRestore_();
  }
  renderQuiz();
}
init();

// ======================================================================
// МАЛЮВАННЯ ПОВЕРХ ЕКРАНА (режим "учитель")
// Дозволяє малювати Apple Pencil / пальцем прямо на екрані, не заважаючи
// звичайній роботі тренажера, коли режим малювання вимкнено.
// ======================================================================
(function(){
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  const toggleBtn = document.getElementById('drawToggleBtn');
  const toolbar = document.getElementById('drawToolbar');
  const thinBtn = document.getElementById('thinBtn');
  const thickBtn = document.getElementById('thickBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');
  const swatches = document.querySelectorAll('.swatch');

  let drawingActive = false;
  let isDrawing = false;
  let currentColor = "#E5484D";
  let currentWidth = 4;
  let eraserMode = false;
  let lastX = 0, lastY = 0;

  function resizeCanvas(){
    const prev = document.createElement('canvas');
    prev.width = canvas.width;
    prev.height = canvas.height;
    prev.getContext('2d').drawImage(canvas, 0, 0);

    canvas.width = window.innerWidth * devicePixelRatio;
    canvas.height = window.innerHeight * devicePixelRatio;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    ctx.drawImage(prev, 0, 0, prev.width / devicePixelRatio, prev.height / devicePixelRatio);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  window.clearDrawing = function(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  };

  function setActive(on){
    drawingActive = on;
    canvas.classList.toggle('active', on);
    toolbar.classList.toggle('show', on);
    toggleBtn.classList.toggle('on', on);
    toggleBtn.title = on ? 'Вимкнути малювання' : 'Малювати';
  }

  toggleBtn.addEventListener('click', ()=> setActive(!drawingActive));

  swatches.forEach(sw=>{
    sw.addEventListener('click', ()=>{
      swatches.forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      currentColor = sw.dataset.color;
      eraserMode = false;
      eraserBtn.classList.remove('selected');
    });
  });

  thinBtn.addEventListener('click', ()=>{
    currentWidth = 4;
    thinBtn.classList.add('selected');
    thickBtn.classList.remove('selected');
  });
  thickBtn.addEventListener('click', ()=>{
    currentWidth = 12;
    thickBtn.classList.add('selected');
    thinBtn.classList.remove('selected');
  });
  eraserBtn.addEventListener('click', ()=>{
    eraserMode = !eraserMode;
    eraserBtn.classList.toggle('selected', eraserMode);
  });
  clearBtn.addEventListener('click', ()=>{
    window.clearDrawing();
  });

  function pointerPos(e){
    return { x: e.clientX, y: e.clientY, pressure: e.pressure || 0.5 };
  }

  canvas.addEventListener('pointerdown', (e)=>{
    if(!drawingActive) return;
    isDrawing = true;
    const p = pointerPos(e);
    lastX = p.x; lastY = p.y;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', (e)=>{
    if(!drawingActive || !isDrawing) return;
    const p = pointerPos(e);
    ctx.globalCompositeOperation = eraserMode ? 'destination-out' : 'source-over';
    ctx.strokeStyle = currentColor;
    const pressureFactor = 0.6 + (p.pressure || 0.5) * 0.8;
    ctx.lineWidth = (eraserMode ? currentWidth * 3 : currentWidth) * pressureFactor;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  });

  function stopDrawing(e){
    isDrawing = false;
  }
  canvas.addEventListener('pointerup', stopDrawing);
  canvas.addEventListener('pointercancel', stopDrawing);
  canvas.addEventListener('pointerleave', stopDrawing);
})();
</script>
