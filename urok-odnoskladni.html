<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Синтаксис · Односкладні речення</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFE6CF;
    --bg-soft:#FFF1E2;
    --card:#FFFFFF;
    --ink:#3A1D0B;
    --ink-soft:#A0714A;
    --line: rgba(58,29,11,0.08);

    /* головний акцент — фіолетовий */
    --c1-a:#FFA94D; --c1-b:#EA6A0A; --c1-sh: rgba(234,106,10,0.45);
    --c3-a:#5FE0A8; --c3-b:#17A863; --c3-sh: rgba(23,168,99,0.4);
    --c2-b:#E5484D;
    --c4-a:#7FA2FF; --c4-b:#3355EE;

    --correct-bg:#E6F8EE;
    --correct-ink:#128A54;
    --wrong-bg:#FDECEC;
    --wrong-ink:#D8393E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;
    min-height:100vh;padding:28px 16px 64px;position:relative;
  }
  .wrap{max-width:760px;margin:0 auto;}

  .topbar{
    display:flex;justify-content:space-between;align-items:center;
    padding-bottom:16px;margin-bottom:22px;border-bottom:1.5px solid rgba(58,29,11,0.14);
  }
  .kicker{font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.55;}
  .kicker.tag{opacity:.4;}

  h1{
    font-family:'Manrope',sans-serif;font-weight:800;
    font-size:clamp(22px,5.2vw,34px);line-height:1.1;letter-spacing:-0.01em;
    margin:0 0 22px;text-transform:uppercase;
  }
  h1 .hl{color:var(--c1-b);}

  .topictoggle{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .topictoggle button{
    flex:1 1 calc(50% - 5px);min-width:140px;padding:15px;border-radius:20px;border:none;background:var(--card);
    font-family:'Manrope',sans-serif;font-weight:800;font-size:13.5px;color:var(--ink-soft);
    cursor:pointer;box-shadow:0 8px 18px -14px rgba(58,29,11,.3);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .topictoggle button.active{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 10px 20px -10px var(--c1-sh);}

  .tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .tabbar.nested{margin-bottom:20px;}
  .tab{
    padding:10px 15px 10px 10px;border-radius:999px;border:none;background:var(--card);
    color:var(--ink-soft);font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;
    cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 8px 18px -14px rgba(58,29,11,0.3);
  }
  .tabbar.nested .tab{background:var(--bg-soft);box-shadow:none;}
  .tab .dot{width:22px;height:22px;border-radius:8px;background:rgba(234,106,10,.12);color:var(--c1-b);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
  .tab.active{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 10px 20px -10px var(--c1-sh);}
  .tab.active .dot{background:rgba(255,255,255,.25);color:#fff;}
  .tabbar.nested .tab.active{background:#fff;color:var(--c1-b);box-shadow:0 6px 16px -10px rgba(58,29,11,.3);}
  .tabbar.nested .tab.active .dot{background:var(--c1-b);color:#fff;}

  .card{background:var(--card);border-radius:28px;padding:28px 24px;box-shadow:0 20px 44px -28px rgba(58,29,11,0.35);}

  .section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.005em;margin:0 0 8px;}
  .section-intro{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 18px;}
  .section-intro b{color:var(--ink);}

  .mnemo{margin-top:16px;font-size:13px;line-height:1.55;color:var(--ink-soft);}
  .mnemo b{color:var(--ink);}

  /* flip cards */
  .cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.cardgrid{grid-template-columns:1fr;}}
  .flip{perspective:1200px;height:158px;cursor:pointer;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .flip.open .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute;inset:0;border-radius:20px;padding:16px 18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;overflow:hidden;}
  .flip-front{background:var(--bg-soft);}
  .flip-back{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;transform:rotateY(180deg);align-items:center;text-align:center;}
  .flip-rule{font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;line-height:1.32;}
  .flip-desc{font-size:12.5px;margin-top:7px;opacity:.8;line-height:1.4;}
  .flip-example{font-size:13.5px;font-weight:700;margin-bottom:5px;line-height:1.35;}
  .flip-example:last-child{margin-bottom:0;}
  .flip-note{font-size:11px;opacity:.7;font-weight:500;}
  .flip-hint{position:absolute;bottom:9px;right:14px;font-size:10px;font-weight:700;opacity:.4;}

  /* chips */
  .chiprow{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{background:var(--bg-soft);border-radius:16px;padding:13px 18px;cursor:pointer;min-width:126px;transition:background .2s;}
  .chip .w{font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;}
  .chip .ipa{font-size:12.5px;color:#fff;font-weight:700;margin-top:5px;display:none;}
  .chip.open{background:linear-gradient(155deg,var(--c4-a),var(--c4-b));}
  .chip.open .w{color:#fff;}
  .chip.open .ipa{display:block;}


  /* demo: речення з підписаною особою */
  .who-strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 18px;}
  .who-strip .lbl{font-family:'Manrope',sans-serif;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-right:4px;}
  .who-strip .pill{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;padding:8px 16px;border-radius:999px;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 8px 16px -8px var(--c1-sh);}
  .who-strip .pill.no{background:var(--wrong-bg);color:var(--wrong-ink);box-shadow:none;}
  .sent-list{display:flex;flex-direction:column;gap:12px;}
  .sent{background:var(--bg-soft);border-radius:20px;padding:34px 20px 18px;font-family:'Manrope',sans-serif;font-weight:700;font-size:clamp(17px,4.4vw,22px);line-height:2.5;}
  .ann{display:inline-block;position:relative;vertical-align:baseline;margin:0 1px;}
  .ann .who{font-size:12px;font-weight:800;line-height:1;color:#fff;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));padding:5px 11px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 12px -6px var(--c1-sh);position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:8px;}
  .ann .who::after{content:'';position:absolute;left:50%;bottom:-5px;width:9px;height:9px;background:var(--c1-b);transform:translateX(-50%) rotate(45deg);border-radius:2px;}
  .ann .w{display:inline;padding:0 2px;}
  .ann.no .who{background:var(--wrong-bg);color:var(--wrong-ink);box-shadow:none;}
  .ann.no .who::after{background:var(--wrong-bg);}
  
  .demo-note{margin-top:16px;font-size:13px;line-height:1.55;color:var(--ink-soft);}
  .demo-note b{color:var(--ink);}

  footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}

  /* ===================== DRAWING / TEACHER MODE ===================== */
  #drawCanvas{position:absolute;top:0;left:0;z-index:9998;pointer-events:none;}

  #drawToggleBtn{
    position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;
    border:1px solid rgba(255,255,255,0.5);
    background:linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),linear-gradient(155deg,var(--c1-a),var(--c1-b));
    backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);
    box-shadow:0 14px 28px -10px var(--c1-sh),inset 0 1px 1px rgba(255,255,255,0.6),inset 0 -6px 10px -4px rgba(0,0,0,0.15);
    color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .2s ease, box-shadow .2s ease;
  }
  #drawToggleBtn svg{width:24px;height:24px;display:block;transition:transform .25s ease, opacity .15s ease;}
  #drawToggleBtn:active{transform:scale(0.90);}
  #drawToggleBtn.on{
    background:linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),linear-gradient(155deg,#FF8A65,var(--c2-b));
    box-shadow:0 14px 28px -10px rgba(229,72,77,0.55),inset 0 1px 1px rgba(255,255,255,0.6),inset 0 -6px 10px -4px rgba(0,0,0,0.15);
  }
  #drawToggleBtn.on svg{transform:rotate(90deg);}

  #drawToolbar{
    position:fixed;left:50%;bottom:22px;
    transform:translateX(-50%) translateY(130%) scale(0.94);opacity:0;
    display:flex;align-items:center;gap:12px;
    background:linear-gradient(150deg, rgba(255,255,255,0.6), rgba(255,255,255,0.15));
    backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,0.7);padding:9px 16px;border-radius:999px;
    box-shadow:0 24px 48px -20px rgba(58,29,11,0.45),inset 0 1px 1px rgba(255,255,255,0.9);
    z-index:9999;transition:transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;pointer-events:none;
  }
  #drawToolbar.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto;}
  #drawToolbar.mini{transform:translateX(-50%) translateY(130%) scale(0.94);opacity:0;pointer-events:none;}
  #drawToolbarMini{
    position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(130%) scale(0.9);opacity:0;
    width:40px;height:26px;border-radius:14px;border:1px solid rgba(255,255,255,0.5);
    background:linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 10px 20px -10px var(--c1-sh);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;pointer-events:none;
  }
  #drawToolbarMini svg{width:18px;height:18px;}
  #drawToolbarMini.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto;}
  .swatch{
    position:relative;width:25px;height:25px;border-radius:50%;border:none;
    box-shadow:0 3px 8px -2px rgba(58,29,11,0.35),inset 0 1px 1px rgba(255,255,255,0.5);
    cursor:pointer;padding:0;transition:transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .swatch::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink);opacity:0;transform:scale(0.7);transition:opacity .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);}
  .swatch.selected{transform:scale(1.08);}
  .swatch.selected::after{opacity:1;transform:scale(1);}
  .tool-btn{
    width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.5);color:var(--ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s ease, color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .tool-btn svg{width:16px;height:16px;}
  .tool-btn .dot{border-radius:50%;background:currentColor;}
  #xthinBtn .dot{width:3.5px;height:3.5px;}
  #thinBtn .dot{width:7px;height:7px;}
  #thickBtn .dot{width:12.5px;height:12.5px;}
  .tool-btn.selected{background:var(--c1-b);color:#fff;transform:scale(1.06);}
  .tool-sep{width:1px;height:22px;background:rgba(58,29,11,0.14);}

  @media (max-width:480px){
    #drawToolbar{max-width:94vw;overflow-x:auto;padding:8px 13px;gap:9px;}
    .swatch{width:21px;height:21px;}
    .tool-btn{width:30px;height:30px;}
    .tool-btn svg{width:14px;height:14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="kicker">Синтаксис · Урок</div>
    <div class="kicker tag" id="totalTag"></div>
  </div>

  <h1>Односкладні <span class="hl">речення</span></h1>

  <div class="topictoggle" id="topictoggle"></div>
  <div class="tabbar" id="subtabbar"></div>
  <div class="tabbar nested" id="subsubtabbar"></div>

  <div class="card" id="lessonArea"></div>

  <footer>@movoznavka</footer>
</div>

<!-- ==== Малювання поверх екрана (для вчителя) ==== -->
<canvas id="drawCanvas"></canvas>
<button id="drawToggleBtn" title="Малювати">
  <svg id="drawIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 20L4.6 16.6C4.7 15.9 5.03 15.26 5.55 14.79L15.3 5.7C16.09 4.96 17.34 4.99 18.09 5.78L18.34 6.04C19.08 6.83 19.04 8.08 18.25 8.81L8.5 17.9C8 18.37 7.37 18.66 6.7 18.75L4 20Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M13.5 7.5L16.5 10.3" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
</button>
<div id="drawToolbar">
  <button class="swatch selected" style="background:#E5484D" data-color="#E5484D"></button>
  <button class="swatch" style="background:#3355EE" data-color="#3355EE"></button>
  <button class="swatch" style="background:#17A863" data-color="#17A863"></button>
  <button class="swatch" style="background:#13213B" data-color="#13213B"></button>
  <div class="tool-sep"></div>
  <button class="tool-btn selected" id="xthinBtn" title="Дуже тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thinBtn" title="Тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thickBtn" title="Товста лінія"><span class="dot"></span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="eraserBtn" title="Ластик">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.5 13.5L10.5 21.5H5.5L2.5 18.5C2.11 18.11 2.11 17.48 2.5 17.09L13.5 6.09C13.89 5.7 14.52 5.7 14.91 6.09L18.5 9.68C19.5 10.68 19.5 12.5 18.5 13.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 13.5L15 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="tool-btn" id="clearBtn" title="Очистити все">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 7H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M9.5 7V4.8C9.5 4.36 9.86 4 10.3 4H13.7C14.14 4 14.5 4.36 14.5 4.8V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 7L7.6 19.2C7.63 19.9 8.2 20.5 8.9 20.5H15.1C15.8 20.5 16.37 19.9 16.4 19.2L17 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="minimizeBtn" title="Згорнути панель">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
<button id="drawToolbarMini" title="Розгорнути панель">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M6 15L12 9L18 15" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<script>
/* ============================================================
   ЯК ДОДАТИ ЧИ ЗМІНИТИ МАТЕРІАЛ
   Весь контент живе в об'єкті TOPICS нижче.
   Щоб додати картку/слово — скопіюй існуючий блок { ... }
   всередині cards / words і зміни текст між лапками.
   Щоб додати новий підрозділ (вкладку) — скопіюй один об'єкт
   зі списку subs цілком і зміни tab / title / вміст.
   ============================================================ */

const TOPICS = {
  pidmet: {
    label: "Підмет",
    subs: [
      {
        id: "p-odn", tab: "Односкладне називне", dot: "1", type: "demo",
        title: "Односкладне називне речення",
        intro: "Головний член — підмет. Якщо перед підметом стоїть <b>означення</b> — речення <b>односкладне</b>.",
        lbl: "Схема",
        who: ["означення + підмет"],
        sentences: [
          "[Зимовий|означення] [вечір|підмет].",
          "[Ніч|підмет]. [Вулиця|підмет]. [Ліхтар|підмет]."
        ]
      },
      {
        id: "p-dv", tab: "Двоскладне", dot: "2", type: "demo",
        title: "А тут уже двоскладне",
        intro: "Якщо перед підметом стоїть <b>обставина</b> — речення <b>двоскладне</b>.",
        lbl: "Схема",
        who: ["обставина + підмет"],
        noWho: true,
        sentences: [
          "[Уночі|!обставина] [мороз|підмет].",
          "[Завтра|!обставина] [свято|підмет]."
        ],
        note: "Порівняй: <b>Зимовий вечір</b> (означення + підмет) — односкладне називне; <b>Уночі мороз</b> (обставина + підмет) — двоскладне."
      }
    ]
  },
  prysudok: {
    label: "Присудок",
    subs: [
      {
        id: "s-oznach", tab: "Означено-особові", dot: "1", type: "demo",
        title: "Означено-особові речення",
        intro: "Головний член — присудок. Підстав до дії особу — і подивись, яка підходить.",
        who: ["я","ти","ми","ви"],
        sentences: [
          "[Іду|я] до школи.",
          "[Читаєш|ти] багато.",
          "[Пишемо|ми] диктант.",
          "[Прийдете|ви] завтра?"
        ]
      },
      {
        id: "s-neozn", tab: "Неозначено-особові", dot: "2", type: "demo",
        title: "Неозначено-особові речення",
        intro: "Головний член — присудок. Дію виконують невідомі особи.",
        who: ["вони"],
        sentences: [
          "У двері [стукають|вони].",
          "Листа [принесли|вони].",
          "[Кажуть|вони], що буде дощ."
        ]
      },
      {
        id: "s-uzah", tab: "Узагальнено-особові", dot: "3", type: "demo",
        title: "Узагальнено-особові речення",
        intro: "Головний член — присудок. Підставити можна будь-яку особу, але це <b>прислів'я, приказки, крилаті вислови</b> — про всіх і завжди.",
        who: ["я","ти","ми","ви","вони"],
        sentences: [
          "[Любиш|ти] кататися — [люби|ти] й саночки возити.",
          "Що [посієш|ти], те й [пожнеш|ти].",
          "Сім раз [відміряй|ти], один раз [відріж|ти].",
          "Лежачого не [б'ють|вони]."
        ],
        note: "Особа підставляється, <b>але</b> речення — це прислів'я, приказка чи крилатий вислів. Так узагальнено-особове відрізняємо від означено- та неозначено-особових."
      },
      {
        id: "s-bezos", tab: "Безособові", dot: "4", type: "demo",
        title: "Безособові речення",
        intro: "Головний член — присудок. Виражають стан людини або природи; форми на <b>-но, -то, -ло, -ти</b>.",
        who: ["нічого не підходить"],
        noWho: true,
        sentences: [
          "[Смеркало|!особи немає].",
          "Мені не [спиться|!особи немає].",
          "Вікно [розбито|!особи немає]."
        ],
        note: "Жодну особу (<b>я, ти, ми, ви, вони, всіх і завжди</b>) підставити не вдається — отже, речення <b>безособове</b>."
      }
    ]
  }
};

const TOPIC_ORDER = ["pidmet","prysudok"];

let activeTopic = "pidmet";
let activeSub = 0;
let activeSubsub = 0;

const topictoggle = document.getElementById('topictoggle');
const subtabbar = document.getElementById('subtabbar');
const subsubtabbar = document.getElementById('subsubtabbar');
const lessonArea = document.getElementById('lessonArea');

function resetNav(){ activeSub = 0; activeSubsub = 0; }
function currentSub(){ return TOPICS[activeTopic].subs[activeSub]; }
function currentSection(){
  const sub = currentSub();
  if(sub.type === "nested") return sub.subsubs[activeSubsub];
  return sub;
}

// чорнило кожної вкладки зберігається окремо
const drawStore = {};
function sectionKey(){ return activeTopic + '__' + activeSub + '__' + activeSubsub; }
function saveCurrentDrawing(){
  if(window.getDrawingSnapshot) drawStore[sectionKey()] = window.getDrawingSnapshot();
}
function restoreCurrentDrawing(){
  if(window.setDrawingSnapshot) window.setDrawingSnapshot(drawStore[sectionKey()] || null);
}

function renderTopics(){
  if(TOPIC_ORDER.length <= 1){ topictoggle.innerHTML = ""; topictoggle.style.display = "none"; return; }
  topictoggle.style.display = "flex";
  topictoggle.innerHTML = TOPIC_ORDER.map(key => `
    <button class="${key===activeTopic?'active':''}" data-key="${key}">${TOPICS[key].label}</button>
  `).join('');
  topictoggle.querySelectorAll('button').forEach(btn=>{
    attachTapToggle(btn, ()=>{
      saveCurrentDrawing();
      activeTopic = btn.dataset.key;
      resetNav();
      renderAll();
    });
  });
}

function renderSubs(){
  const subs = TOPICS[activeTopic].subs;
  if(subs.length <= 1){ subtabbar.innerHTML = ""; subtabbar.style.display = "none"; return; }
  subtabbar.style.display = "flex";
  subtabbar.innerHTML = subs.map((s,i)=>`
    <button class="tab ${i===activeSub?'active':''}" data-i="${i}">
      <span class="dot">${s.dot}</span>${s.tab}
    </button>`).join('');
  subtabbar.querySelectorAll('.tab').forEach(btn=>{
    attachTapToggle(btn, ()=>{
      saveCurrentDrawing();
      activeSub = +btn.dataset.i;
      activeSubsub = 0;
      renderAll();
    });
  });
}

function renderSubSubs(){
  const sub = currentSub();
  if(sub.type !== "nested"){ subsubtabbar.innerHTML = ""; subsubtabbar.style.display = "none"; return; }
  subsubtabbar.style.display = "flex";
  subsubtabbar.innerHTML = sub.subsubs.map((s,i)=>`
    <button class="tab ${i===activeSubsub?'active':''}" data-i="${i}">
      <span class="dot">${s.dot}</span>${s.tab}
    </button>`).join('');
  subsubtabbar.querySelectorAll('.tab').forEach(btn=>{
    attachTapToggle(btn, ()=>{
      saveCurrentDrawing();
      activeSubsub = +btn.dataset.i;
      renderSubSubs();
      renderContent();
    });
  });
}

function renderContent(){
  const s = currentSection();
  let html = `<p class="section-title">${s.title}</p>${s.intro ? `<p class="section-intro">${s.intro}</p>` : ''}`;
  if(s.type === "cards"){
    html += `<div class="cardgrid">${s.cards.map((c)=>`
      <div class="flip" data-kind="card">
        <div class="flip-inner">
          <div class="flip-face flip-front">
            <div class="flip-rule">${c.rule}</div>
            <div class="flip-desc">${c.desc||''}</div>
            <div class="flip-hint">натисни →</div>
          </div>
          <div class="flip-face flip-back">
            ${c.examples.map(e=>`<div class="flip-example">${e.word}${e.ipa?' '+e.ipa:''}</div>${e.note?`<div class="flip-note">${e.note}</div>`:''}`).join('')}
          </div>
        </div>
      </div>`).join('')}</div>`;
    if(s.mnemo) html += `<div class="mnemo">${s.mnemo}</div>`;
  }
  if(s.type === "exceptions"){
    html += `<div class="chiprow">${s.words.map((w)=>`
      <div class="chip" data-kind="chip">
        <div class="w">${w.word}</div>
        <div class="ipa">${w.ipa}</div>
      </div>`).join('')}</div>`;
  }
  if(s.type === "demo"){
    const fmt = t => t.replace(/\[([^|\]]+)\|([^\]]+)\]/g, (m,w,who)=>{
      const no = who.startsWith('!');
      return `<span class="ann${no?' no':''}"><span class="who">${no?who.slice(1):who}</span><span class="w">${w}</span></span>`;
    });
    html += `<div class="who-strip"><span class="lbl">${s.lbl||'Підставляємо'}</span>${s.who.map(w=>`<span class="pill${s.noWho?' no':''}">${w}</span>`).join('')}</div>`;
    html += `<div class="sent-list">${s.sentences.map(t=>`<div class="sent">${fmt(t)}</div>`).join('')}</div>`;
    if(s.note) html += `<div class="demo-note">${s.note}</div>`;
  }

  lessonArea.innerHTML = html;
  lessonArea.querySelectorAll('[data-kind="card"], [data-kind="chip"]').forEach(el=>{
    attachTapToggle(el, ()=>{ el.classList.toggle('open'); });
  });
  syncCanvasAfterRender();
}

function syncCanvasAfterRender(){
  if(window.resizeDrawCanvas){
    requestAnimationFrame(()=> requestAnimationFrame(()=>{
      window.resizeDrawCanvas();
      restoreCurrentDrawing();
    }));
  }
}

// надійне розпізнавання "тапу" (не залежить від click; перо в режимі малювання не перемикає картки)
function attachTapToggle(el, handler){
  let sx = 0, sy = 0, penTap = false, tracking = false;
  el.addEventListener('pointerdown', (e)=>{
    tracking = true;
    sx = e.clientX; sy = e.clientY;
    penTap = e.pointerType === 'pen';
  }, {passive:true});
  el.addEventListener('pointerup', (e)=>{
    if(!tracking) return;
    tracking = false;
    if(penTap && window.isDrawingActive && window.isDrawingActive()) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.hypot(dx,dy) > 10) return;
    handler(e);
  });
}
window.attachTapToggle = attachTapToggle;

function renderAll(){
  renderTopics();
  renderSubs();
  renderSubSubs();
  renderContent();
}

renderAll();

// ======================================================================
// МАЛЮВАННЯ ПОВЕРХ ЕКРАНА (режим "учитель") — без змін відносно еталона
// ======================================================================
(function(){
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  const toggleBtn = document.getElementById('drawToggleBtn');
  const toolbar = document.getElementById('drawToolbar');
  const toolbarMini = document.getElementById('drawToolbarMini');
  const minimizeBtn = document.getElementById('minimizeBtn');
  const xthinBtn = document.getElementById('xthinBtn');
  const thinBtn = document.getElementById('thinBtn');
  const thickBtn = document.getElementById('thickBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');
  const swatches = document.querySelectorAll('.swatch');

  let drawingActive = false;
  let isDrawing = false;
  let currentColor = "#E5484D";
  let currentWidth = 4;
  let eraserMode = false;
  let lastX = 0, lastY = 0;
  let activePointerId = null;

  window.isDrawingActive = function(){ return drawingActive; };

  function currentDocHeight(){
    return Math.max(
      document.documentElement.scrollHeight,
      document.body.scrollHeight,
      window.innerHeight
    );
  }

  function resizeCanvas(){
    const docWidth = document.documentElement.clientWidth;
    const docHeight = currentDocHeight();

    const prev = document.createElement('canvas');
    prev.width = canvas.width;
    prev.height = canvas.height;
    if(canvas.width && canvas.height){
      prev.getContext('2d').drawImage(canvas, 0, 0);
    }

    canvas.width = docWidth * devicePixelRatio;
    canvas.height = docHeight * devicePixelRatio;
    canvas.style.width = docWidth + 'px';
    canvas.style.height = docHeight + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if(prev.width && prev.height){
      ctx.drawImage(prev, 0, 0, prev.width / devicePixelRatio, prev.height / devicePixelRatio);
    }
  }
  window.resizeDrawCanvas = resizeCanvas;
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', resizeCanvas);
  if(window.ResizeObserver){
    new ResizeObserver(()=> resizeCanvas()).observe(document.body);
  }

  window.clearDrawing = function(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  };

  window.getDrawingSnapshot = function(){
    try{
      return (canvas.width && canvas.height) ? canvas.toDataURL('image/png') : null;
    }catch(e){ return null; }
  };
  window.setDrawingSnapshot = function(dataURL){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(!dataURL) return;
    const img = new Image();
    img.onload = function(){
      ctx.drawImage(img, 0, 0, canvas.width / devicePixelRatio, canvas.height / devicePixelRatio);
    };
    img.src = dataURL;
  };

  function setActive(on){
    drawingActive = on;
    toolbar.classList.toggle('show', on);
    toolbar.classList.remove('mini');
    if(toolbarMini) toolbarMini.classList.remove('show');
    toggleBtn.classList.toggle('on', on);
    toggleBtn.title = on ? 'Вимкнути малювання' : 'Малювати';
  }
  toggleBtn.addEventListener('click', ()=> setActive(!drawingActive));

  if(minimizeBtn && toolbarMini){
    minimizeBtn.addEventListener('click', ()=>{
      toolbar.classList.remove('show');
      toolbar.classList.add('mini');
      toolbarMini.classList.add('show');
    });
    toolbarMini.addEventListener('click', ()=>{
      toolbar.classList.remove('mini');
      toolbar.classList.add('show');
      toolbarMini.classList.remove('show');
    });
  }

  swatches.forEach(sw=>{
    sw.addEventListener('click', ()=>{
      swatches.forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      currentColor = sw.dataset.color;
      eraserMode = false;
      eraserBtn.classList.remove('selected');
    });
  });

  xthinBtn.addEventListener('click', ()=>{
    currentWidth = 2;
    [xthinBtn,thinBtn,thickBtn].forEach(b=>b.classList.remove('selected'));
    xthinBtn.classList.add('selected');
  });
  thinBtn.addEventListener('click', ()=>{
    currentWidth = 5;
    [xthinBtn,thinBtn,thickBtn].forEach(b=>b.classList.remove('selected'));
    thinBtn.classList.add('selected');
  });
  thickBtn.addEventListener('click', ()=>{
    currentWidth = 11;
    [xthinBtn,thinBtn,thickBtn].forEach(b=>b.classList.remove('selected'));
    thickBtn.classList.add('selected');
  });
  eraserBtn.addEventListener('click', ()=>{
    eraserMode = !eraserMode;
    eraserBtn.classList.toggle('selected', eraserMode);
  });
  clearBtn.addEventListener('click', ()=>{ window.clearDrawing(); });

  function pointerPos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top, pressure: e.pressure || 0.5 };
  }

  function isOnControls(e){
    return !!(e.target.closest && e.target.closest('#drawToolbar, #drawToolbarMini, #drawToggleBtn'));
  }

  document.addEventListener('pointerdown', (e)=>{
    if(!drawingActive) return;
    if(e.pointerType !== 'pen') return;
    if(isOnControls(e)) return;
    e.preventDefault();
    isDrawing = true;
    activePointerId = e.pointerId;
    const p = pointerPos(e);
    lastX = p.x; lastY = p.y;
  }, { passive: false });

  document.addEventListener('pointermove', (e)=>{
    if(!drawingActive || !isDrawing) return;
    if(e.pointerId !== activePointerId) return;
    e.preventDefault();
    const p = pointerPos(e);
    ctx.globalCompositeOperation = eraserMode ? 'destination-out' : 'source-over';
    ctx.strokeStyle = currentColor;
    const pressureFactor = 0.6 + (p.pressure || 0.5) * 0.8;
    ctx.lineWidth = (eraserMode ? currentWidth * 3 : currentWidth) * pressureFactor;
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  }, { passive: false });

  function stopDrawing(e){
    if(e && e.pointerId !== undefined && e.pointerId !== activePointerId) return;
    isDrawing = false;
    activePointerId = null;
  }
  document.addEventListener('pointerup', stopDrawing);
  document.addEventListener('pointercancel', stopDrawing);

  document.addEventListener('touchmove', function(e){
    if(drawingActive && e.touches && e.touches[0] && e.touches[0].touchType === 'stylus'){
      e.preventDefault();
    }
  }, { passive: false });
})();
</script>
</body>
</html>
