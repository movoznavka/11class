<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Уроки й тести · Навігація</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#D0E9FC;
    --bg-soft:#E4F2FC;
    --card:#FFFFFF;
    --ink:#13213B;
    --ink-soft:#6478A0;
    --line: rgba(19,33,59,0.08);

    --c1-a:#6C8CFF; --c1-b:#3355EE; --c1-sh: rgba(51,85,238,0.45);
    --c3-a:#5FE0A8; --c3-b:#17A863; --c3-sh: rgba(23,168,99,0.4);
    --c2-b:#E5484D;

    --correct-bg:#E6F8EE;
    --correct-ink:#128A54;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 64px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    margin-bottom:22px;
    border-bottom:1.5px solid rgba(19,33,59,0.14);
  }
  .kicker{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.55;
  }
  .kicker.tag{opacity:.4;}

  h1{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:clamp(26px,6vw,38px);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 8px;
    text-transform:uppercase;
  }
  h1 .hl{color:var(--c1-b);}
  .sub{color:var(--ink-soft);font-size:15px;max-width:60ch;margin:0 0 30px;font-weight:500;}

  .block{
    margin-bottom:46px;
  }
  .block-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin:0 0 4px;
    padding-bottom:12px;
    border-bottom:2px solid rgba(19,33,59,0.14);
  }
  .block-title{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:-0.01em;
    margin:0;
  }
  .block-test-pill{
    display:inline-flex;
    align-items:center;
    gap:7px;
    text-decoration:none;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.01em;
    padding:9px 16px;
    border-radius:999px;
    white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .block-test-pill.ready{
    color:var(--c3-b);
    background:var(--correct-bg);
    cursor:pointer;
  }
  .block-test-pill.ready:hover{
    transform:translateY(-2px);
    box-shadow: 0 10px 20px -14px var(--c3-sh);
  }
  .block-test-pill.soon{
    color:var(--ink-soft);
    background:var(--bg-soft);
    opacity:.7;
    cursor:default;
    pointer-events:none;
  }

  /* --- окрема плашка для тесту "на відповідність" (інший колір, щоб не плутати із загальним) --- */
  .block-test-pill.match.ready{
    color:var(--c1-b);
    background:rgba(51,85,238,0.12);
  }
  .block-test-pill.match.ready:hover{
    box-shadow: 0 10px 20px -14px var(--c1-sh);
  }

  .subgroup{ margin-bottom:26px; margin-top:24px; }
  .subgroup:first-of-type{ margin-top:22px; }
  .subgroup-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin:0 0 14px 2px;
  }
  .subgroup-title{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:14px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--c1-b);
    margin:0;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:5px 14px 5px 12px;
    border-radius:999px;
    background: var(--accent-soft, rgba(51,85,238,0.10));
  }
  .subgroup-title::before{
    content:'';
    width:6px;height:6px;
    border-radius:50%;
    background:var(--c1-b);
  }
  .subgroup-test-pill{
    display:inline-flex;
    align-items:center;
    gap:7px;
    text-decoration:none;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:11.5px;
    letter-spacing:.01em;
    padding:7px 13px;
    border-radius:999px;
    white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .subgroup-test-pill.ready{
    color:var(--c3-b);
    background:var(--correct-bg);
    cursor:pointer;
  }
  .subgroup-test-pill.ready:hover{
    transform:translateY(-2px);
    box-shadow: 0 10px 20px -14px var(--c3-sh);
  }
  .subgroup-test-pill.soon{
    color:var(--ink-soft);
    background:var(--bg-soft);
    opacity:.7;
    cursor:default;
    pointer-events:none;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:14px;
  }

  .card-wrap{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .card{
    background:var(--card);
    border-radius:22px;
    padding:22px 22px 20px;
    box-shadow: 0 14px 30px -24px rgba(19,33,59,0.35);
    text-decoration:none;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    gap:12px;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card.ready:hover{
    transform:translateY(-3px);
    box-shadow: 0 18px 34px -18px rgba(19,33,59,0.4);
  }
  .card.soon{
    opacity:.5;
    cursor:default;
    pointer-events:none;
  }

  /* --- «Повторити»: фіолетова рамка + значок на куточку картки --- */
  .card.repeat{
    box-shadow: 0 0 0 2px rgba(139,92,246,0.55), 0 14px 30px -24px rgba(19,33,59,0.35);
  }
  .card.repeat.ready:hover{
    box-shadow: 0 0 0 2px rgba(139,92,246,0.7), 0 18px 34px -18px rgba(19,33,59,0.4);
  }
  .repeat-badge{
    position:absolute;
    top:-10px;
    right:14px;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:11px;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:5px 11px;
    border-radius:999px;
    color:#fff;
    background:linear-gradient(135deg,#8B5CF6,#5B3FE0);
    box-shadow:0 8px 16px -8px rgba(91,63,224,0.7);
    pointer-events:none;
    white-space:nowrap;
  }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }

  .tile{
    width:40px;height:40px;min-width:40px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--c1-b);
    background: linear-gradient(150deg, rgba(255,255,255,0.75), var(--tile-tint, rgba(108,140,255,0.22)));
    backdrop-filter: blur(6px) saturate(160%);
    -webkit-backdrop-filter: blur(6px) saturate(160%);
    border:1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 12px -7px var(--c1-sh), inset 0 1px 1px rgba(255,255,255,0.8);
  }

  .status{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .status.ready{background:var(--correct-bg);color:var(--correct-ink);}
  .status.soon{background:var(--bg-soft);color:var(--ink-soft);}

  .card-title{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:16.5px;
    line-height:1.32;
    margin:0;
  }
  .card-sub{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
    margin:0;
  }

  /* --- плашка "тест до теми" --- */
  .test-pill{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    text-decoration:none;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12px;
    letter-spacing:.01em;
    padding:9px 14px;
    border-radius:14px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .test-pill.ready{
    color:var(--c3-b);
    background:var(--correct-bg);
    cursor:pointer;
  }
  .test-pill.ready:hover{
    transform:translateY(-2px);
    box-shadow: 0 10px 20px -14px var(--c3-sh);
  }
  .test-pill.soon{
    color:var(--ink-soft);
    background:var(--bg-soft);
    opacity:.6;
    cursor:default;
    pointer-events:none;
  }

  /* --- ДЗ: яскраве світіння --- */
  .test-pill.homework, .block-test-pill.homework, .subgroup-test-pill.homework{
    color:#7A3B00 !important;
    background: linear-gradient(135deg, #FFE27A, #FF9A3D) !important;
    animation: hwGlow 1.6s ease-in-out infinite;
  }
  @keyframes hwGlow{
    0%,100%{ box-shadow: 0 0 6px 0 rgba(255,140,40,0.55); }
    50%{ box-shadow: 0 0 18px 6px rgba(255,140,40,0.85); }
  }
  .hw-badge{
    margin-left:6px;
    font-weight:800;
  }

  footer{
    text-align:center;
    margin-top:36px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }

  .teacher-banner{
    display:none;
    background: var(--c2-b);
    color:#fff;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-align:center;
    padding:9px 14px;
    border-radius:12px;
    margin-bottom:20px;
  }
  body.teacher-mode .teacher-banner{ display:block; }

  .open-badge{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:10.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:999px;
    align-self:flex-start;
    margin-top:-2px;
  }
  .open-badge.open{ background:var(--correct-bg); color:var(--correct-ink); }
  .open-badge.closed{ background:rgba(229,72,77,0.12); color:var(--c2-b); }

  /* ===== СЕЗОННІ ТЕМИ ===== */
  body{ background:var(--bg-img, var(--bg)); background-attachment:fixed; transition:background .4s ease; }
  /* під темою нічого блакитного: колір під фоном і під панеллю браузера = теплий, а не стандартний блакитний */
  body[data-theme]{ background:var(--bg-soft, #F6E8D6); }
  html:has(body[data-theme]){ background:var(--bg-soft, #F6E8D6); }
  .wrap{ position:relative; z-index:1; }

  .season-badge{
    display:inline-block;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:13px;
    letter-spacing:.03em;
    padding:7px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.75);
    color:var(--c1-b);
    box-shadow:0 8px 18px -12px var(--c1-sh);
    margin:0 0 12px;
  }

  #fx{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
  #scene{ position:fixed; inset:0; pointer-events:none; z-index:0;
    background:#F6E8D6 center / cover no-repeat; }
  #scene::after{ content:''; position:absolute; inset:0; background:var(--veil-bg, none); }
  #leafcv{ position:fixed; left:0; top:0; pointer-events:none; z-index:0; }
  @media (max-width:700px){ #scene::after{ background:var(--veil-m, none); } }

  /* частинки: листя, пелюстки, сніжинки, серця, кажани... */
  .fx-p{ position:absolute; left:0; top:0; opacity:0; will-change:transform; animation:fxMove linear infinite; }
  @keyframes fxMove{
    0%{ transform:translate3d(0,0,0) rotate(0deg); opacity:0; }
    8%{ opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translate3d(var(--dx),var(--dy),0) rotate(var(--rot)); opacity:0; }
  }
  .fx-i{ display:block; line-height:0; animation:fxSway ease-in-out infinite alternate; }
  .fx-i svg{ display:block; }
  @keyframes fxSway{
    0%{ transform:translateX(calc(var(--sw,20px) * -1)) rotate(calc(var(--sr,30deg) * -1)); }
    100%{ transform:translateX(var(--sw,20px)) rotate(var(--sr,30deg)); }
  }
  .fx-i.s-bat{ animation:fxFlap .24s ease-in-out infinite alternate; }
  @keyframes fxFlap{ 0%{ transform:scaleY(1); } 100%{ transform:scaleY(.4); } }
  .fx-i.s-spark{ animation:fxTw 1.3s ease-in-out infinite alternate; }
  @keyframes fxTw{ 0%{ transform:scale(.5); opacity:.35; } 100%{ transform:scale(1.1); opacity:1; } }
  .k-snow .fx-i{ filter:drop-shadow(0 0 2px rgba(80,120,190,.55)); }
  .k-spark .fx-i{ filter:drop-shadow(0 0 5px rgba(255,205,90,.95)); }
  .k-petal .fx-i, .k-heart .fx-i{ filter:drop-shadow(0 1px 1px rgba(0,0,0,.18)); }
  @media (prefers-reduced-motion: reduce){ #fx{ display:none; } }

  /* ===== кольори та фони тем ===== */
  body[data-theme="autumn"]{
    --c1-a:#F7C58E; --c1-b:#E67E22; --c1-sh:rgba(230,126,34,0.4); --bg-soft:#FFE9CC; --card:#FFFCF6; --ink:#4A2C12; --ink-soft:#8B5E3C; --c2-b:#C0392B;
    --tile-tint:rgba(230,126,34,0.22); --accent-soft:rgba(230,126,34,0.12);
    --veil-bg:linear-gradient(90deg, rgba(255,246,234,0.55) 0%, rgba(255,246,234,0.3) 55%, rgba(255,246,234,0) 88%); --veil-m:none;
  }
  body[data-theme="autumn"] #scene{ background-image:url("bg/autumn.jpg"); background-position:100% center; }
  @media (max-width:700px){ body[data-theme="autumn"] #scene{ background-position:78% center; } }
  body[data-theme="winter"]{
    --c1-a:#7FB2E8; --c1-b:#2F6FB5; --c1-sh:rgba(47,111,181,0.4);
    --tile-tint:rgba(47,111,181,0.22); --accent-soft:rgba(47,111,181,0.12);
    --veil-bg:linear-gradient(90deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.22) 55%, rgba(255,255,255,0) 88%); --veil-m:none;
  }
  body[data-theme="winter"] #scene{ background-image:url("bg/winter.jpg"); background-position:100% center; }
  @media (max-width:700px){ body[data-theme="winter"] #scene{ background-position:85% center; } }
  body[data-theme="newyear"]{
    --c1-a:#FFB067; --c1-b:#D4501A; --c1-sh:rgba(212,80,26,0.4);
    --tile-tint:rgba(212,80,26,0.22); --accent-soft:rgba(212,80,26,0.12);
    --veil-bg:linear-gradient(90deg, rgba(255,236,210,0.3) 0%, rgba(255,236,210,0.12) 55%, rgba(255,236,210,0) 88%); --veil-m:none;
  }
  body[data-theme="newyear"] #scene{ background-image:url("bg/newyear.jpg"); background-position:100% center; }
  @media (max-width:700px){ body[data-theme="newyear"] #scene{ background-position:90% center; } }
  body[data-theme="love"]{
    --c1-a:#FF8DB0; --c1-b:#D6336C; --c1-sh:rgba(214,51,108,0.4);
    --tile-tint:rgba(214,51,108,0.22); --accent-soft:rgba(214,51,108,0.12);
    --veil-bg:linear-gradient(90deg, rgba(255,240,248,0.35) 0%, rgba(255,240,248,0.15) 55%, rgba(255,240,248,0) 88%); --veil-m:none;
  }
  body[data-theme="love"] #scene{ background-image:url("bg/love.jpg"); background-position:100% center; }
  @media (max-width:700px){ body[data-theme="love"] #scene{ background-position:92% center; } }
  body[data-theme="spring"]{
    --c1-a:#8FD06B; --c1-b:#3E9B3A; --c1-sh:rgba(62,155,58,0.4);
    --tile-tint:rgba(62,155,58,0.22); --accent-soft:rgba(62,155,58,0.12);
    --veil-bg:linear-gradient(90deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.2) 55%, rgba(255,255,255,0) 88%); --veil-m:none;
  }
  body[data-theme="spring"] #scene{ background-image:url("bg/spring.jpg"); background-position:100% center; }
  @media (max-width:700px){ body[data-theme="spring"] #scene{ background-position:85% center; } }
  body[data-theme="summer"]{
    --c1-a:#FFB347; --c1-b:#E8740C; --c1-sh:rgba(232,116,12,0.4);
    --tile-tint:rgba(232,116,12,0.22); --accent-soft:rgba(232,116,12,0.12);
    --veil-bg:linear-gradient(90deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.2) 55%, rgba(255,255,255,0) 88%); --veil-m:none;
  }
  body[data-theme="summer"] #scene{ background-image:url("bg/summer.jpg"); background-position:100% center; }
  @media (max-width:700px){ body[data-theme="summer"] #scene{ background-position:85% center; } }
  body[data-theme="women"]{
    --c1-a:#F28CB1; --c1-b:#C2185B; --c1-sh:rgba(194,24,91,0.4);
    --tile-tint:rgba(194,24,91,0.22); --accent-soft:rgba(194,24,91,0.12);
    --veil-bg:rgba(255,245,248,0.3); --veil-m:none;
  }
  body[data-theme="women"] #scene{ background-image:url("bg/women.jpg"); background-position:50% center; }
  @media (max-width:700px){ body[data-theme="women"] #scene{ background-position:70% center; } }
  body[data-theme="easter"]{
    --c1-a:#F2A65A; --c1-b:#B5352A; --c1-sh:rgba(181,53,42,0.4);
    --tile-tint:rgba(181,53,42,0.22); --accent-soft:rgba(181,53,42,0.12);
    --veil-bg:rgba(255,250,240,0.32); --veil-m:none;
  }
  body[data-theme="easter"] #scene{ background-image:url("bg/easter.jpg"); background-position:50% center; }
  @media (max-width:700px){ body[data-theme="easter"] #scene{ background-position:50% center; } }
  body[data-theme="independence"]{
    --c1-a:#5BA3F0; --c1-b:#0057B8; --c1-sh:rgba(0,87,184,0.4);
    --tile-tint:rgba(0,87,184,0.22); --accent-soft:rgba(0,87,184,0.12);
    --veil-bg:rgba(255,255,255,0.38); --veil-m:none;
  }
  body[data-theme="independence"] #scene{ background-image:url("bg/independence.jpg"); background-position:50% center; }
  @media (max-width:700px){ body[data-theme="independence"] #scene{ background-position:50% center; } }
  body[data-theme="school"]{
    --c1-a:#6C8CFF; --c1-b:#2457C5; --c1-sh:rgba(36,87,197,0.4);
    --tile-tint:rgba(36,87,197,0.22); --accent-soft:rgba(36,87,197,0.12);
    --veil-bg:rgba(255,255,255,0.22); --veil-m:none;
  }
  body[data-theme="school"] #scene{ background-image:url("bg/school.jpg"); background-position:50% center; }
  @media (max-width:700px){ body[data-theme="school"] #scene{ background-position:50% center; } }
  body[data-theme="vyshyvanka"]{
    --c1-a:#E86A70; --c1-b:#C0222B; --c1-sh:rgba(192,34,43,0.4);
    --tile-tint:rgba(192,34,43,0.22); --accent-soft:rgba(192,34,43,0.12);
    --veil-bg:rgba(255,250,244,0.3); --veil-m:none;
  }
  body[data-theme="vyshyvanka"] #scene{ background-image:url("bg/vyshyvanka.jpg"); background-position:50% center; }
  @media (max-width:700px){ body[data-theme="vyshyvanka"] #scene{ background-position:50% center; } }
  body[data-theme="halloween"]{
    --c1-a:#FFA94D; --c1-b:#D9530B; --c1-sh:rgba(217,83,11,0.4);
    --tile-tint:rgba(217,83,11,0.22); --accent-soft:rgba(217,83,11,0.12);
    --veil-bg:rgba(20,8,35,0.3); --veil-m:none;
  }
  body[data-theme="halloween"] #scene{ background-image:url("bg/halloween.jpg"); background-position:50% center; }
  @media (max-width:700px){ body[data-theme="halloween"] #scene{ background-position:22% center; } }

  body[data-theme="autumn"] .card{ border-radius:26px; }
  body[data-theme] h1, body[data-theme] .sub, body[data-theme] .kicker,

  return `<a class="block-test-pill ${test.status}" href="${clickable ? test.href : '#'}" data-testkey="${test.href}">${label}</a>`;
}

function subgroupTestPillHtml(test){
  if(!test) return '';

// ДЗ — ЯСКРАВЕ ПОЗНАЧЕННЯ (ПЕРСОНАЛЬНО ДЛЯ КОЖНОГО УЧНЯ)
// Тут вказуєте посилання вашого Apps Script (те саме, що для бота),
// закінчується на /exec. Керуєте позначками ДЗ прямо в Telegram-боті
// командою /дз (там спершу обираєте учня) — код нижче лише зчитує,
// що призначено САМЕ ЦЬОМУ учню (за кодом ?u=...), і підсвічує пілюлі
// тільки на його сторінці.
// ============================================================
const HOMEWORK_API_URL = "https://script.google.com/macros/s/AKfycbzDs5WkG3yAOIFbj4BEvTczkCynEAkhIja0ThB3LGtpXerg2pUdtcX1AzDTisH_v36k/exec";

let _lastHomeworkMap = null;
let _allowed = null;   // повний список відкритих учню уроків/тестів (ставиться при вході)
let _repeatList = [];  // теми, на яких учень бачить значок «🔁 Повторити»

// ------------------------------------------------------------
// ПОВТОРЕННЯ: значок «🔁 Повторити» на куточку картки теми.
// Вмикається вчителькою в боті (кнопка «🔁 Повторити»), а тут
// лише зчитується для цього учня і малюється на його картках.
// ------------------------------------------------------------
function markRepeat_(){
  document.querySelectorAll('.card').forEach(function(card){
    const on = _repeatList.indexOf(card.getAttribute('data-key')) !== -1;
    card.classList.toggle('repeat', on);
    let badge = card.querySelector('.repeat-badge');
    if (on && !badge) {
      badge = document.createElement('span');
      badge.className = 'repeat-badge';
      badge.textContent = '🔁 Повторити';
      card.appendChild(badge);
    }
    if (!on && badge) badge.remove();
  });
}

window.applyRepeat = function(list){
  _repeatList = list || [];
  markRepeat_();
};

function loadRepeat(studentCode){
  if(!HOMEWORK_API_URL || HOMEWORK_API_URL.indexOf('ВСТАВТЕ') === 0) return;
  if(!studentCode) return;
  const sep = HOMEWORK_API_URL.indexOf('?') > -1 ? '&' : '?';
  const s = document.createElement('script');
  s.src = HOMEWORK_API_URL + sep + 'mode=repeat&callback=applyRepeat&student=' + encodeURIComponent(studentCode) + '&_=' + Date.now();
  document.body.appendChild(s);
}

// ------------------------------------------------------------
// АВТОМАТИЧНЕ ВІДКРИТТЯ ЗАГАЛЬНИХ ТЕСТІВ
// Загальний тест відкривається учню сам, щойно йому відкрито ВСІ
// (готові) уроки тієї теми, яку він охоплює:
//   • загальний тест розділу / тест на відповідність — усі уроки розділу
//     (Орфографія → усі теми орфографії, Морфологія → усі теми морфології...);
//   • загальний тест підрозділу — усі уроки підрозділу
//     (Складні слова → складні іменники + прикметники + прислівник).
// Окрім того, тест відкритий, якщо ви відкрили його вручну в боті
// або задали по ньому ДЗ.
// ------------------------------------------------------------
const AUTO_REQUIRES = {};
BLOCKS.forEach(function(b){
  const all = [];
  b.subgroups.forEach(function(sg){
    const hs = sg.items.filter(function(i){ return i.status === 'ready'; }).map(function(i){ return i.href; });
    hs.forEach(function(h){ all.push(h); });
    if (sg.generalTest && sg.generalTest.href) AUTO_REQUIRES[sg.generalTest.href] = hs;
  });
  if (b.generalTest && b.generalTest.href) AUTO_REQUIRES[b.generalTest.href] = all;
  if (b.matchTest && b.matchTest.href) AUTO_REQUIRES[b.matchTest.href] = all;
});

function testOpen_(key){
  if (!_allowed) return false;
  if (_allowed.indexOf(key) !== -1) return true;                       // відкрито вручну
  if (_lastHomeworkMap && _lastHomeworkMap[key]) return true;          // задано ДЗ
  const req = AUTO_REQUIRES[key];
  return !!(req && req.length && req.every(function(h){ return _allowed.indexOf(h) !== -1; }));
}

function isShown_(el){ return el && el.style.display !== 'none'; }

function hasAnyOpen_(){
  if (document.querySelector('.card-wrap')) return true;
  return Array.prototype.some.call(document.querySelectorAll('.block-test-pill, .subgroup-test-pill'), isShown_);
}

function refreshVisibility_(){
  if (!_allowed) return;
  document.querySelectorAll('.block-test-pill, .subgroup-test-pill').forEach(function(a){
    a.style.display = testOpen_(a.getAttribute('data-testkey')) ? '' : 'none';
  });
  document.querySelectorAll('.subgroup-header').forEach(function(h){
    const hasTitle = !!h.querySelector('.subgroup-title');
    const hasPill = Array.prototype.some.call(h.querySelectorAll('.subgroup-test-pill'), isShown_);
    h.style.display = (hasTitle || hasPill) ? '' : 'none';
  });
  document.querySelectorAll('.subgroup').forEach(function(sg){
    const hasPill = Array.prototype.some.call(sg.querySelectorAll('.subgroup-test-pill'), isShown_);
    sg.style.display = (sg.querySelector('.card') || hasPill) ? '' : 'none';
  });
  document.querySelectorAll('.block').forEach(function(b){
    const hasPill = Array.prototype.some.call(b.querySelectorAll('.block-test-pill, .subgroup-test-pill'), isShown_);
    b.style.display = (b.querySelector('.card') || hasPill) ? '' : 'none';
  });
  if (hasAnyOpen_()){
    const m = document.getElementById('noTopicsMsg'); if (m) m.remove();
  }
}
function applyHomework(map){
  map = map || {};
  _lastHomeworkMap = map;
  document.querySelectorAll('[data-testkey]').forEach(function(el){
    const hw = map[el.getAttribute('data-testkey')];
    if(!hw) return;
    el.classList.add('homework');
    if(!el.querySelector('.hw-badge')){
      const span = document.createElement('span');
      span.className = 'hw-badge';
      span.textContent = ' · ДЗ ' + hw.number;
      el.appendChild(span);
    }
    if (hw.number && el.getAttribute('href') !== '#') {
      const sep = el.getAttribute('href').indexOf('?') > -1 ? '&' : '?';
      el.setAttribute('href', el.getAttribute('href') + sep + 'hw=' + encodeURIComponent(hw.number));
    }
  });
  refreshVisibility_();   // тест із ДЗ має бути доступний учню
}

function loadHomework(studentCode){
  if(!HOMEWORK_API_URL || HOMEWORK_API_URL.indexOf('ВСТАВТЕ') === 0) return;
  if(!studentCode) return;
  const sep = HOMEWORK_API_URL.indexOf('?') > -1 ? '&' : '?';
  const s = document.createElement('script');
  s.src = HOMEWORK_API_URL + sep + 'callback=applyHomework&student=' + encodeURIComponent(studentCode) + '&_=' + Date.now();
  document.body.appendChild(s);
}

// Код учня (те, що йде після ?u=) — обирайте самі, наприклад ім'я.
// Посилання для учня: .../index.html?u=Maryna
//
// Кожен код відкриває СПИСОК ТЕМ (масив href уроків, як і раніше) —
// а урок і тест до нього показуються/ховаються РАЗОМ, як одна тема.
// Загальні тести відкриваються так само — додайте їхній href у список
// (напр. "orfografiya-zagalnyi.html") або відкрийте через бота.
//
// ВАЖЛИВО: якщо учня немає в цьому списку — посилання НЕ спрацює,
// портал покаже "Це посилання недійсне".

// Якщо код є ключем тут — портал спершу спитає, хто саме зайшов,
// і далі підставлятиме ОСОБИСТЕ ім'я і в лінки на уроки/тести,
// і в результати в Telegram — щоб було видно, хто саме що зробив.
// Одиночних учнів сюди додавати не треба.
// ============================================================
const GROUP_MEMBERS = {
  "ліза настя": ["Ліза", "Настя"],
  "марина світлана": ["Марина", "Світлана"]
};

function normalizeCode(s){
  return (s || '').trim().replace(/\s+/g, ' ').toLowerCase();
}

const NORMALIZED_ACCESS = {};
Object.keys(STUDENT_ACCESS).forEach(function(code){
  NORMALIZED_ACCESS[normalizeCode(code)] = STUDENT_ACCESS[code];
});

// ============================================================
// ЗАВЕРШЕННЯ ВХОДУ УЧНЯ: ховає закриті теми, підвантажує ДЗ,
// і — головне — дописує ?student=Ім'я в кожне посилання на урок,
// щоб сторінка тесту брала ім'я з лінка й не питала його вручну.
// ============================================================
function appendStudentParam_(href, name){
  const sep = href.indexOf('?') > -1 ? '&' : '?';
  return href + sep + 'student=' + encodeURIComponent(name);
}

function applyAccessAndRender_(studentCode, allowed, displayName){
  const desc = document.getElementById('subDesc');
  if (desc) desc.remove();

  document.querySelectorAll('.card-wrap').forEach(function(wrap){
    const card = wrap.querySelector('.card');
    const key = card.getAttribute('data-key');
    if (allowed.indexOf(key) === -1) { wrap.remove(); return; }
    if (card.getAttribute('href') !== '#') {
      card.setAttribute('href', appendStudentParam_(card.getAttribute('href'), displayName));
    }
    const pill = wrap.querySelector('.test-pill');
    if (pill && pill.getAttribute('href') !== '#') {
      pill.setAttribute('href', appendStudentParam_(pill.getAttribute('href'), displayName));
    }
  });

  // Загальні тести / тест на відповідність: усім пілюлям даємо ?student=,
  // а показуємо лише ті, що відкриті (вручну, через ДЗ або автоматично
  // після всіх уроків своєї теми — див. AUTO_REQUIRES).
  _allowed = allowed;
  document.querySelectorAll('.block-test-pill, .subgroup-test-pill').forEach(function(a){
    const h = a.getAttribute('href');
    if (h && h !== '#' && h.indexOf('student=') === -1) {
      a.setAttribute('href', appendStudentParam_(h, displayName));
    }
  });
  refreshVisibility_();
  markRepeat_();   // значки «Повторити» на картках, що лишились

  document.querySelectorAll('#switchWho').forEach(function(el){ el.closest('p').remove(); });
  if (GROUP_MEMBERS[studentCode]) {
    const who = document.createElement('p');
    who.className = 'sub';
    who.style.cssText = 'margin-top:28px;font-size:13px;';
    who.innerHTML = 'Ви зайшли як <b>' + displayName + '</b>. <a href="#" id="switchWho" style="color:var(--c1-b);">Це не я</a>';
    document.querySelector('.wrap').appendChild(who);
    document.getElementById('switchWho').addEventListener('click', function(e){
      e.preventDefault();
      sessionStorage.removeItem('chosenName_' + studentCode);
      location.reload();
    });
  }
}

// Теми можна відкривати або вручну (STUDENT_ACCESS вище), або через
// бота кнопкою "🔓 Теми". Щоб сторінка не «блимала» (спочатку всі теми,
// потім лише дозволені), спершу одразу й синхронно показуємо статичний
// список — і лише ЯКЩО бот справді відкрив щось додаткове, перемальовуємо
// список ще раз (це рідкісний випадок, і невеличке оновлення тут не заважає).
// Групи, де вчителька задає ДЗ окремо кожному (а не на всю пару разом).
// Для них ДЗ шукаємо за особистим ім'ям, а не кодом посилання.
const HW_SPLIT_GROUPS = ["марина світлана"];

function finishStudentView_(studentCode, allowedStatic, displayName){
  const hwLookupCode = HW_SPLIT_GROUPS.indexOf(studentCode) !== -1 ? displayName : studentCode;
  loadHomework(hwLookupCode);
  loadRepeat(studentCode);   // «Повторити» — спільне для всього коду (пари теж)
  applyAccessAndRender_(studentCode, allowedStatic, displayName);

  const stillWaiting = HOMEWORK_API_URL && HOMEWORK_API_URL.indexOf('ВСТАВТЕ') !== 0;
  const blocksEl = document.getElementById('blocks');

  // Якщо після статичного списку карток узагалі не лишилось (весь доступ
  // очікується від бота) — не лишаємо порожню сторінку, а пишемо, що йде
  // завантаження, поки чекаємо відповідь.
  let loadingEl = null;
  if (stillWaiting && !hasAnyOpen_()) {
    loadingEl = document.createElement('p');
    loadingEl.className = 'sub';
    loadingEl.id = 'accessLoading';
    loadingEl.textContent = 'Завантажуємо ваші теми…';
    document.querySelector('.wrap').insertBefore(loadingEl, blocksEl);
  }

  if (!stillWaiting) return;

  let resolved = false;
  window.applyAccess = function(dynamicList){
    if (resolved) return;
    resolved = true;
    dynamicList = dynamicList || [];
    const extra = dynamicList.filter(function(h){ return allowedStatic.indexOf(h) === -1; });
    if (extra.length > 0) {
      renderBlocks_();
      applyAccessAndRender_(studentCode, allowedStatic.concat(extra), displayName);
      // Перемальовування вище стирає картки разом з уже застосованими
      // позначками ДЗ і «Повторити» — застосовуємо їх ще раз на нових картках.
      if (_lastHomeworkMap) applyHomework(_lastHomeworkMap);
      markRepeat_();
    }

    const loader = document.getElementById('accessLoading');
    if (loader) loader.remove();

    if (!hasAnyOpen_()) {
      const msg = document.createElement('p');
      msg.id = 'noTopicsMsg';
      msg.className = 'sub';
      msg.textContent = 'Поки для вас не відкрито жодної теми. Зверніться до вчительки.';
      document.querySelector('.wrap').insertBefore(msg, blocksEl);
    }
  };

  const sep = HOMEWORK_API_URL.indexOf('?') > -1 ? '&' : '?';
  const s = document.createElement('script');
  s.src = HOMEWORK_API_URL + sep + 'mode=access&callback=applyAccess&student=' + encodeURIComponent(studentCode) + '&_=' + Date.now();
  document.body.appendChild(s);
}

function showNamePicker_(studentCode, allowed, members){
  const blocksEl = document.getElementById('blocks');
  blocksEl.style.display = 'none';
  const desc = document.getElementById('subDesc');
  if (desc) desc.remove();

  const box = document.createElement('div');
  box.id = 'namePicker';
  box.innerHTML = '<p class="sub" style="margin-bottom:18px;">Це спільне посилання. Оберіть, хто зараз проходить тести:</p>';

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;';

  members.forEach(function(name){
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.style.cssText = 'font-family:Manrope,sans-serif;font-weight:800;font-size:16px;padding:18px 30px;border:none;border-radius:16px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 14px 30px -24px rgba(19,33,59,0.35);';
    btn.addEventListener('click', function(){
      sessionStorage.setItem('chosenName_' + studentCode, name);
      box.remove();
      blocksEl.style.display = '';
      finishStudentView_(studentCode, allowed, name);
    });
    row.appendChild(btn);
  });

  box.appendChild(row);
  document.querySelector('.wrap').insertBefore(box, blocksEl);
}

(function(){
  const params = new URLSearchParams(location.search);
  const isTeacher = params.get('vchytel') === '1';
  const studentCode = normalizeCode(params.get('u'));
  const allowed = studentCode ? NORMALIZED_ACCESS[studentCode] : null;

  if (isTeacher) {
    document.body.classList.add('teacher-mode');

    function renderOpenBadges_(dynamicMap){
      dynamicMap = dynamicMap || {};
      document.querySelectorAll('.card').forEach(function(card){
        const key = card.getAttribute('data-key');
        const openFor = Object.keys(STUDENT_ACCESS).filter(function(code){
          const staticOpen = STUDENT_ACCESS[code].indexOf(key) !== -1;
          const dynOpen = (dynamicMap[normalizeCode(code)] || []).indexOf(key) !== -1;
          return staticOpen || dynOpen;
        });
        let badge = card.querySelector('.open-badge');
        if (!badge) {
          badge = document.createElement('span');
          card.appendChild(badge);
        }
        if (openFor.length) {
          badge.className = 'open-badge open';
          badge.textContent = '🔓 Відкрито · ' + openFor.length;
          badge.title = openFor.join(', ');
        } else {
          badge.className = 'open-badge closed';
          badge.textContent = '🔒 нікому не відкрито';
          badge.title = '';
        }
      });
    }

    renderOpenBadges_({});

    // У режимі вчителя всі посилання ведуть у тести з ?vchytel=1
    // (відповідь одразу після кожного завдання, результат у Telegram не надсилається).
    document.querySelectorAll('.card, .test-pill, .block-test-pill, .subgroup-test-pill').forEach(function(a){
      const h = a.getAttribute('href');
      if (h && h !== '#') a.setAttribute('href', h + (h.indexOf('?') > -1 ? '&' : '?') + 'vchytel=1');
    });

    if (HOMEWORK_API_URL && HOMEWORK_API_URL.indexOf('ВСТАВТЕ') !== 0) {
      window.applyAllAccess = renderOpenBadges_;
      const sep = HOMEWORK_API_URL.indexOf('?') > -1 ? '&' : '?';
      const s = document.createElement('script');
      s.src = HOMEWORK_API_URL + sep + 'mode=access_all&callback=applyAllAccess';
      document.body.appendChild(s);
    }
    return;
  }

  if (studentCode && allowed) {
    const tag = document.querySelector('.kicker.tag');
    if (tag) tag.remove();

    const members = GROUP_MEMBERS[studentCode];
    if (members) {
      const chosen = sessionStorage.getItem('chosenName_' + studentCode);
      if (chosen && members.indexOf(chosen) !== -1) {
        finishStudentView_(studentCode, allowed, chosen);
      } else {
        showNamePicker_(studentCode, allowed, members);
      }
    } else {
      // одиночний учень — його ім'я і є кодом у посиланні
      finishStudentView_(studentCode, allowed, params.get('u').trim());
    }
  } else {
    const desc = document.getElementById('subDesc');
    if (desc) desc.remove();
    document.querySelectorAll('.block').forEach(function(b){ b.remove(); });
    const msg = document.createElement('p');
    msg.className = 'sub';
    msg.textContent = 'Це посилання недійсне. Зверніться до вчительки за новим.';
    document.querySelector('.wrap').appendChild(msg);
  }
})();

(function(){
  function orthodoxEaster(y){
    var a=y%4, b=y%7, c=y%19, d=(19*c+15)%30, e=(2*a+4*b-d+34)%7;
    var m=Math.floor((d+e+114)/31), day=((d+e+114)%31)+1;
    var dt=new Date(y, m-1, day);
    dt.setDate(dt.getDate()+13);          // юліанський → григоріанський (1900–2099)
    return dt;
  }
  function thirdThursdayOfMay(y){
    var d=new Date(y,4,1), shift=(4-d.getDay()+7)%7;
    return 1+shift+14;
  }
  function pickTheme(now){
    var y=now.getFullYear(), m=now.getMonth()+1, d=now.getDate(), md=m*100+d;
    var today=new Date(y,m-1,d);
    var diff=Math.round((today-orthodoxEaster(y))/86400000);
    if (diff>=-7 && diff<=6) return 'easter';
    if (md>=1220 || md<=108) return 'newyear';
    if (md>=212 && md<=214) return 'love';
    if (md>=306 && md<=308) return 'women';
    if (md>=820 && md<=824) return 'independence';
    if (md>=1028 && md<=1031) return 'halloween';

    if (md>=1201 && md<=1219) return 'winter';
    if (md<=305) return 'winter';

  // ---------- де на екрані яка точка фото ----------
  function map(){
    var W=window.innerWidth, H=window.innerHeight;
    var k=Math.max(W/cur.w, H/cur.h), dw=cur.w*k, dh=cur.h*k;
    var f = W<=700 ? cur.pxm : cur.px;
    return { ox:(W-dw)*f, oy:(H-dh)/2, k:k, W:W };
  }
  function respawn(p){
    var c=p._c, m=map();
    var x=rr(c.sp.x), y=rr(c.sp.y);
    var ax=m.ox+x*m.k, ay=m.oy+y*m.k, dx, dy;
    ax=Math.min(Math.max(ax,8), m.W-8);                 // щоб листок не з'являвся за екраном
    if (c.exit){ dx=-(ax+170); dy=rr(c.dy)*m.k; }
    else { dy=(m.oy+rr(c.to)*m.k)-ay; dx=rr(c.dx)*m.k; }
    p.style.left=ax+'px'; p.style.top=ay+'px';
    p.style.setProperty('--dx', dx+'px');
    p.style.setProperty('--dy', Math.max(Math.abs(dy)>60?dy:60,-9999)+'px');
    p.style.setProperty('--rot', rr(c.rot||[-200,200])+'deg');
    p.style.animationDuration = rr(c.dur)+'s';
    var s = Math.round(rr(c.size)*Math.max(.75,Math.min(1.25,m.k)));
    p.firstChild.innerHTML = svg(c.kind, pick(c.colors), s);
  }
  function build(c, i){
    var p=document.createElement('span'), inner=document.createElement('span');
    p.className='fx-p k-'+c.kind;
    inner.className='fx-i s-'+c.kind;
    if (c.kind!=='bat' && c.kind!=='spark'){
      var sw=c.sw||[14,36];
      inner.style.animationDuration = rnd(2.6,4.8)+'s';
      inner.style.animationDelay = (-rnd(0,4))+'s';
      inner.style.setProperty('--sw', rr(sw)+'px');
      inner.style.setProperty('--sr', rnd(18,55)+'deg');
    } else {
      inner.style.animationDelay = (-rnd(0,1))+'s';
    }
    p.appendChild(inner);
    p._c=c;
    respawn(p);
    p.style.animationDelay = (c.kind==='bat' ? rnd(0,12) : i*0.35+rnd(0,1.5))+'s';
    p.addEventListener('animationiteration', function(e){ if (e.target===p) respawn(p); });
    return p;
  }

  function loadLeaves(cb){
    if (leafImgs) return cb();
    var out=[], left=LEAF_COUNT;
    function done(){ if(--left===0){ leafImgs=out.filter(Boolean); if(leafImgs.length) cb(); } }
    for (var i=1;i<=LEAF_COUNT;i++){ (function(i){
      var im=new Image();
      im.onload=function(){
        // темніший «відбиток» листка: накладається, коли листок повертається ребром (імітація тіні/об'єму)

        var c=dk.getContext('2d'); c.drawImage(im,0,0);
        c.globalCompositeOperation='source-atop'; c.fillStyle='rgba(28,10,0,.62)'; c.fillRect(0,0,dk.width,dk.height);
        out[i-1]={img:im, dark:dk, ar:im.naturalHeight/im.naturalWidth};

  function startLeaves(){
    if (leafEng) return;
    var tok={}; leafEng=tok;
    loadLeaves(function(){ if (leafEng===tok) runLeaves(tok); });
  }
  function stopLeaves(){
    if (!leafEng) return;
    if (leafEng.raf) cancelAnimationFrame(leafEng.raf);
    if (leafEng.onr) window.removeEventListener('resize', leafEng.onr);
    if (leafEng.cv) leafEng.cv.remove();
    leafEng=null;
  }

  function runLeaves(tok){
    var cv=document.createElement('canvas'); cv.id='leafcv'; tok.cv=cv;
    document.body.appendChild(cv);
    var ctx=cv.getContext('2d'), dpr=1, W=0, H=0;
    function size(){
      dpr=Math.min(window.devicePixelRatio||1,2); W=window.innerWidth; H=window.innerHeight;
      cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
      cv.style.width=W+'px'; cv.style.height=H+'px';
    }
    size(); tok.onr=size; window.addEventListener('resize', size);

    var leaves=[], now=0, last=0, nextSpawn=0.2, nextGust=7+rnd(0,4);
    var gust={t0:-99, dur:1, str:0};

    function gustEnv(){ var u=(now-gust.t0)/gust.dur; if(u<0||u>1) return 0; var s=Math.sin(Math.PI*u); return s*s; }
    // вітер справа наліво (px/с): постійний + повільні коливання + поривчастий
    function wind(){ return -42 + 14*Math.sin(now*0.23) + 9*Math.sin(now*0.61+1.3) + gust.str*gustEnv(); }

    // точка на дереві, що зараз видна на екрані (і, за потреби, поруч із даною)
    function pickPoint(m, near){
      for (var t=0;t<40;t++){
        var p=SPAWN[(Math.random()*SPAWN.length)|0];
        if (near){ var dx=p[0]-near[0], dy=p[1]-near[1]; if (dx*dx+dy*dy>170*170) continue; }
        var sx=m.ox+p[0]*m.k, sy=m.oy+p[1]*m.k;
        if (sx>16 && sx<W-16 && sy>-4 && sy<H*0.8) return p;
      }
      return null;
    }

    function spawn(hangT, near, gusty){
      var m=map(), p=pickPoint(m,near)||pickPoint(m,null);
      if (!p) return null;
      var f=leafImgs[(Math.random()*leafImgs.length)|0];
      var d=0.55+Math.pow(Math.random(),0.8)*0.7;               // глибина: 0.55 (далеко) … 1.25 (близько)
      var light=Math.random()<0.2;                               // «легкі» листочки, яких вітер несе далі
      var L={ img:f.img, dark:f.dark, ar:f.ar, d:d, w:(21+Math.random()*16)*d,
        ix:p[0]+rnd(-3,3), iy:p[1]+rnd(-3,3), st:'hang', t:0, hang:hangT,
        rot:rnd(0,6.283), ph:rnd(0,6.283), sw:rnd(1.2,2.4),
        drag:light?rnd(1.8,2.4):rnd(2.2,3.2), g:150*(0.78+0.3*d),
        wc:light?rnd(1.6,2.4):rnd(0.75,1.3), cx:rnd(1.1,2.0), amp:rnd(25,55),
        psi:rnd(0,6.283), psiW:rnd(1.1,2.2), flip:rnd(0,6.283), flipW:rnd(0.9,2.4), spin:rnd(-0.7,0.7),
        vx:0, vy:0, x:0, y:0, ang:0, sx:1, sy:1, sq:1, alpha:0, gusty:!!gusty,
        lie:rnd(4,9), landF:(d-0.55)/0.7, landY:0 };
      leaves.push(L);
      leaves.sort(function(a,b){ return a.d-b.d; });             // далекі малюються першими
      return L;
    }

    function startGust(){
      gust.t0=now; gust.dur=rnd(2.6,4.6); gust.str=-rnd(70,130);
      var cp=SPAWN[(Math.random()*SPAWN.length)|0], n=4+((Math.random()*4)|0);
      for (var i=0;i<n;i++) spawn(rnd(0,1.1), cp, true);         // порив зриває кілька листочків поруч
    }

    function draw(L, k){
      var w=L.w*k, h=w*L.ar;

      ctx.save();
      ctx.globalAlpha=L.alpha*(0.82+0.18*Math.min(1,L.d));
      ctx.translate(L.x,L.y);
      if (L.sq!==1) ctx.scale(1,L.sq);                           // лежачий листок — «приплюснутий» перспективою землі
      ctx.rotate(L.ang);

      ctx.drawImage(L.img,-w/2,-h/2,w,h);

    for (var i=0;i<8;i++) spawn(rnd(0.2,4.5));

    function frame(ts){
      tok.raf=requestAnimationFrame(frame);
      var t=ts/1000; var dt=t-last; last=t;

      var falling=0, hanging=0;
      for (var a=0;a<leaves.length;a++){ if(leaves[a].st==='fall') falling++; else if(leaves[a].st==='hang') hanging++; }
      var target = W<700 ? 12 : 20;
      if (now>=nextSpawn && falling+hanging<target){ spawn(rnd(0.3,5)); nextSpawn=now+rnd(0.3,0.9); }

      for (var i=leaves.length-1;i>=0;i--){
        var L=leaves[i]; L.t+=dt;

        if (L.st==='hang'){

          var sx0=m.ox+L.ix*m.k, sy0=m.oy+L.iy*m.k;
          var amp=1+Math.max(0,(L.t-(L.hang-0.6))/0.6)*1.6;
          L.x=sx0+Math.sin(now*3.1+L.ph)*0.8*amp*k;
          L.y=sy0+Math.sin(now*2.3+L.ph*1.7)*0.6*amp*k;
          L.ang=L.rot+Math.sin(now*L.sw+L.ph)*0.12*amp+Math.sin(now*5.3+L.ph)*0.03*amp;
          L.alpha=Math.min(1,L.t/0.6); L.sx=1; L.sy=1; L.shade=0;
          if (L.t>=L.hang){

            L.vx=wind()*0.3; L.vy=L.gusty?-rnd(10,45):0;         // у пориві листок спершу підхоплює вгору
            L.landY=Math.min(m.oy+(805+L.landF*70+rnd(-8,8))*m.k, H-8);  // далекі приземляються вище

          var wx=wind()*L.wc*(0.6+0.4*L.d);

      }

      ctx.clearRect(0,0,W,H);
      for (var j=0;j<leaves.length;j++) draw(leaves[j], k);
    }

    var wires='', leds='';
    (segs||[[0,w]]).forEach(function(sg){
      var x0=sg[0]+3, x1=sg[1]-3; if (x1-x0<40) return;
      // пряма нитка (ледь провисає)
      wires+='<path d="M'+x0.toFixed(1)+' '+y0+' Q'+((x0+x1)/2).toFixed(1)+' '+(y0+1.4).toFixed(1)+' '+x1.toFixed(1)+' '+y0+'" fill="none" stroke="#876A47" stroke-opacity=".85" stroke-width=".9" stroke-linecap="round"/>';
      // вільна нитка: шаблони з довільним порядком, дзеркалом і дрібними відхиленнями
      var order=[0,1,2].sort(function(){ return q()-.5; }), flip=q()<.5?-1:1;
      var x=x0, yPrev=0, d='M'+x0.toFixed(1)+' '+y0+' ', pts=[[x0,y0]], si=0, ti=0, guard=0;
      while (x<x1-2 && guard++<40){
        var T=GARLAND_SHAPES[order[ti%3]], S=T[si%T.length]; si++; if (si>=T.length){ si=0; ti++; }
        var dx=S[0]*R(.9,1.1), last=false;
        if (x+dx>x1-40){ dx=x1-x; last=true; }
        if (dx<30) break;
        var j=function(){ return R(-1.2,1.2); };
        var c1x=x+dx*S[1], c1y=y0+flip*sc*(S[2]+j()), c2x=x+dx*S[3], c2y=y0+flip*sc*(S[4]+j());
        var ey=last?0:flip*sc*(S[5]+j()), ex=x+dx, sy=y0+yPrev;
        d+='C'+c1x.toFixed(1)+' '+c1y.toFixed(2)+' '+c2x.toFixed(1)+' '+c2y.toFixed(2)+' '+ex.toFixed(1)+' '+(y0+ey).toFixed(2)+' ';
        for (var k=1;k<=24;k++){ var t=k/24, u=1-t;
          pts.push([u*u*u*x+3*u*u*t*c1x+3*u*t*t*c2x+t*t*t*ex, u*u*u*sy+3*u*u*t*c1y+3*u*t*t*c2y+t*t*t*(y0+ey)]); }
        x=ex; yPrev=ey;
        if (last) break;
      }
      wires+='<path d="'+d+'" fill="none" stroke="#FFD58A" stroke-opacity=".2" stroke-width="3.6" stroke-linecap="round"/>'
        +'<path d="'+d+'" fill="none" stroke="#FFF2D2" stroke-opacity=".96" stroke-width="1" stroke-linecap="round"/>';
      function yOn(xx){ for (var n=1;n<pts.length;n++) if (pts[n][0]>=xx){ var a=pts[n-1], b=pts[n], f=(xx-a[0])/Math.max(b[0]-a[0],.01); return a[1]+(b[1]-a[1])*f; } return y0; }
      // вогники: нерівномірно (20–55 px), частина трохи вище, частина трохи нижче
      var bx=x0+R(6,22);
      while (bx<x1-4){
        var by=yOn(bx)+R(-2.6,2.6), k2=R(.75,1.3), br=R(.7,1), tt=R(5,11), dl=-R(0,11), lw=R(.68,.85), cr=R(1.1,1.5);
        leds+='<g class="gb-glow" style="--t:'+tt.toFixed(2)+'s;--d:'+dl.toFixed(2)+'s;--lo:'+lw.toFixed(2)+'" transform="translate('+bx.toFixed(1)+' '+by.toFixed(2)+')">'
          +'<circle r="'+(13*k2).toFixed(1)+'" fill="url(#'+id+'o)" opacity="'+br.toFixed(2)+'"/>'
          +'<circle r="'+(6*k2).toFixed(1)+'" fill="url(#'+id+'i)" opacity="'+br.toFixed(2)+'"/>'
          +'<circle r="'+cr.toFixed(2)+'" fill="#FFFBEF"/></g>';
        bx+=R(20,55);
      }
    });
    return out+wires+leds+'</svg>';
  }

  function makeSprite(stops,size){
    var c=document.createElement('canvas'); c.width=c.height=size;
    var x=c.getContext('2d'), g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    stops.forEach(function(st){ g.addColorStop(st[0],st[1]); });
    x.fillStyle=g; x.fillRect(0,0,size,size);
    return c;
  }

  function startNewYear(){
    if (nyEng) return;
    var E={}; nyEng=E;
    var ro=null, io=null, mo=null, pend=false;

    // ---------- гірлянди ----------
    function ensure(el, kind){
      var er=el.getBoundingClientRect(), w=Math.round(er.width);
      if (w<60) return;                                       // елемент зараз прихований
      var segs=null, over=false;
      if (kind==='banner'){                                   // дві гірлянди ліворуч і праворуч, напис по центру вільний
        var rg=document.createRange(), tn=el.firstChild; while (tn && tn.nodeType!==3) tn=tn.nextSibling; if (tn) rg.selectNodeContents(tn); else rg.selectNodeContents(el); var tr=rg.getBoundingClientRect();
        var l=Math.round(tr.left-er.left)-20, r=Math.round(tr.right-er.left)+20;
        segs=[]; if (l>=50) segs.push([0,l]); if (w-r>=50) segs.push([r,w]);
        if (!segs.length){ segs=null; over=true; }            // вузький екран: гірлянда над плашкою
      }
      var key=w+'|'+(segs?segs.join(','):'');
      var g=null, ch=el.children;
      for (var i=0;i<ch.length;i++) if (ch[i].classList && ch[i].classList.contains('garland')) { g=ch[i]; break; }
      if (g && g._k===key) return;
      if (!g){
        g=document.createElement('div'); g.className='garland '+kind; g.setAttribute('aria-hidden','true');
        el.appendChild(g);
        if (io) io.observe(g);
      }
      g._k=key; g.classList.toggle('over',over);
      if (!el._gs) el._gs=(++gSeed)*9973+11;
      g.innerHTML=garlandSVG(w, el._gs, kind, segs, over?0.45:1);
      if (ro && el._ro!==E){ ro.observe(el); el._ro=E; }
    }
    function decorate(){
      document.querySelectorAll('.teacher-banner').forEach(function(el){ ensure(el,'banner'); });
      document.querySelectorAll('.block-header').forEach(function(el){ ensure(el,'header'); });
    }
    function later(){ if (pend) return; pend=true; requestAnimationFrame(function(){ pend=false; if (nyEng===E) decorate(); }); }
    if (window.ResizeObserver) ro=new ResizeObserver(later);
    if (window.IntersectionObserver) io=new IntersectionObserver(function(es){
      es.forEach(function(e){ e.target.classList.toggle('paused', !e.isIntersecting); });
    },{rootMargin:'120px'});
    var bl=document.getElementById('blocks');
    if (bl && window.MutationObserver){ mo=new MutationObserver(later); mo.observe(bl,{childList:true}); }
    decorate();
    E.stop=function(){
      if (E.raf) cancelAnimationFrame(E.raf);
      if (E.onr) window.removeEventListener('resize',E.onr);
      if (ro) ro.disconnect(); if (io) io.disconnect(); if (mo) mo.disconnect();
      document.querySelectorAll('.garland').forEach(function(g){ g.remove(); });
      document.querySelectorAll('.teacher-banner, .block-header').forEach(function(el){ el._ro=null; });
      if (E.cv) E.cv.remove();
    };

    if (reduce) return;                                       // без руху: лише статичні гірлянди й світіння карток

    // ---------- canvas: ялинка, камін, сніг у вікні ----------
    var cv=document.createElement('canvas'); cv.id='nycv'; E.cv=cv; document.body.appendChild(cv);
    var ctx=cv.getContext('2d'), dpr=1, W=0, H=0;
    function size(){
      dpr=Math.min(window.devicePixelRatio||1,1.5); W=window.innerWidth; H=window.innerHeight;
      cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); cv.style.width=W+'px'; cv.style.height=H+'px';
    }
    size(); E.onr=size; window.addEventListener('resize',size);

    var spLight=makeSprite([[0,'rgba(255,250,225,1)'],[.18,'rgba(255,236,170,.85)'],[.45,'rgba(255,196,96,.32)'],[1,'rgba(255,170,60,0)']],64);
    var spFire =makeSprite([[0,'rgba(255,205,110,1)'],[.35,'rgba(255,160,60,.55)'],[1,'rgba(255,120,30,0)']],128);

    // кожна лампочка ялинки має свій ритм: повільно й м'яко, без різкого блимання
    var lights=TREE_LIGHTS.map(function(p){
      return { x:p[0], y:p[1], r:rnd(8,15), lo:rnd(0.08,0.3), hi:rnd(0.6,0.95),
               w1:rnd(0.9,2.6), p1:rnd(0,6.28), w2:rnd(0.4,1.2), p2:rnd(0,6.28) };
    });
    // сніжинки за вікном (координати фото); дуже повільні
    var flakes=[], nf=36;
    for (var i=0;i<nf;i++) flakes.push({ x:rnd(26,194), y:rnd(36,420), r:rnd(0.8,2.1), vy:rnd(5,15), amp:rnd(3,9), sw:rnd(0.5,1.4), ph:rnd(0,6.28), a:rnd(0.55,0.95) });

    var last=0, now=0;
    function glow(m,sp,cx,cy,rx,ry,a){
      ctx.globalAlpha=Math.max(0,Math.min(1,a));
      ctx.drawImage(sp, m.ox+(cx-rx)*m.k, m.oy+(cy-ry)*m.k, rx*2*m.k, ry*2*m.k);
    }
    function frame(ts){
      E.raf=requestAnimationFrame(frame);
      var t=ts/1000, dt=t-last; last=t;
      if (dt<=0) return; if (dt>0.05) dt=0.05;
      now+=dt;
      var m=map();
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.clearRect(0,0,W,H);

      // 1) повільний сніг — лише всередині шибок вікна
      if (m.ox+210*m.k>0 && m.ox+20*m.k<W){
        ctx.save();
        ctx.setTransform(dpr*m.k,0,0,dpr*m.k,dpr*m.ox,dpr*m.oy);
        ctx.beginPath();
        WINDOW_PANES.forEach(function(poly){
          poly.forEach(function(pt,j){ if(j) ctx.lineTo(pt[0],pt[1]); else ctx.moveTo(pt[0],pt[1]); });
          ctx.closePath();
        });
        ctx.clip();
        ctx.fillStyle='#ffffff';
        for (var i=0;i<flakes.length;i++){
          var f=flakes[i];
          f.y+=f.vy*dt;
          f.x+=Math.sin(now*f.sw+f.ph)*f.amp*dt;
          if (f.y>424){ f.y=34; f.x=rnd(26,194); }
          ctx.globalAlpha=f.a;
          ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.2832); ctx.fill();
        }
        ctx.restore();
      }

      // 2) живе світло каміна: кілька шарів, що тремтять у різному темпі
      var f1=Math.max(0.5,Math.min(1,0.78+0.14*Math.sin(now*1.7)+0.08*Math.sin(now*4.1+1.2)));
      var f2=Math.max(0.45,Math.min(1,0.74+0.16*Math.sin(now*3.3+0.4)+0.12*Math.sin(now*7.9+2.1)+0.06*Math.sin(now*13.3)));
      glow(m,spFire,1290,530,380,290,0.30*f1);
      glow(m,spFire,1296,556,160,130,0.42*f1);
      glow(m,spFire,1294,575,88,98*(0.94+0.12*f2),0.55*f2);
      glow(m,spFire,1290,700,280,60,0.16*f1);

      // 3) вогники ялинки
      for (var j=0;j<lights.length;j++){
        var L=lights[j];
        var sx=m.ox+L.x*m.k, sy=m.oy+L.y*m.k;
        if (sx<-30||sx>W+30||sy<-30||sy>H+30) continue;
        var s=0.5+0.5*(0.65*Math.sin(now*L.w1+L.p1)+0.35*Math.sin(now*L.w2+L.p2));
        var sz=L.r*2*m.k;
        ctx.globalAlpha=L.lo+(L.hi-L.lo)*s;
        ctx.drawImage(spLight,sx-sz/2,sy-sz/2,sz,sz);
      }
    }
    E.raf=requestAnimationFrame(frame);
  }
  function stopNewYear(){ if (nyEng){ nyEng.stop(); nyEng=null; } }

  function clearTheme(){
    var b=document.querySelector('.season-badge'); if (b) b.remove();
    if (fx) { fx.remove(); fx=null; }
    stopLeaves(); stopNewYear();
    if (scene) { scene.remove(); scene=null; }
    document.body.removeAttribute('data-theme');
    current=null; cur=null;
  }

  function applyTheme(name){
    var t=THEMES[name];
    if (!t || name===current) return;
    clearTheme();
    current=name; cur=t;
    document.body.setAttribute('data-theme', name);

    var h1=document.querySelector('h1');
    if (h1) {
      var badge=document.createElement('div');
      badge.className='season-badge';
      badge.textContent=t.label;
      h1.parentNode.insertBefore(badge, h1);
    }

    scene=document.createElement('div');
    scene.id='scene';
    document.body.appendChild(scene);

    if (t.engine==='newyear') { startNewYear(); return; }
    if (reduce) return;
    if (t.engine==='leaves') { startLeaves(); return; }
    fx=document.createElement('div');
    fx.id='fx';
    var f = window.innerWidth<600 ? 0.6 : 1;
    t.parts.forEach(function(c){
      var n=Math.max(2, Math.round(c.n*f));
      for (var i=0;i<n;i++) fx.appendChild(build(c,i));
    });
    document.body.appendChild(fx);
  }

  window.addEventListener('resize', function(){
    if (fx && cur) fx.querySelectorAll('.fx-p').forEach(respawn);
  });

  function show(n){
    if (!n || n==='auto') n=autoName;
    if (n==='off') { clearTheme(); return; }
    if (THEMES[n]) applyTheme(n);
  }

  if (forced && THEMES[forced]) {
    applyTheme(forced);
  } else {
    show(cacheGet());   // остання тема з бота — щоб сторінка не «блимала»
  }

  // Вибір із бота (персональний або для всіх), якщо в посиланні немає ?theme=
  if (!forced && typeof HOMEWORK_API_URL !== 'undefined' && HOMEWORK_API_URL && HOMEWORK_API_URL.indexOf('ВСТАВТЕ') !== 0) {
    window.applyThemeOverride = function(r){
      var n=(r && r.theme) || 'auto';
      cacheSet(n);
      show(n);
    };
    var sep = HOMEWORK_API_URL.indexOf('?') > -1 ? '&' : '?';
    var sc = document.createElement('script');
    sc.src = HOMEWORK_API_URL + sep + 'mode=theme&callback=applyThemeOverride&student=' + encodeURIComponent(code) + '&_=' + Date.now();
    document.body.appendChild(sc);
  }
})();
</script>
