<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Уроки й тести · Навігація</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#D0E9FC;
    --bg-soft:#E4F2FC;
    --card:#FFFFFF;
    --ink:#13213B;
    --ink-soft:#6478A0;
    --line: rgba(19,33,59,0.08);

    --c1-a:#6C8CFF; --c1-b:#3355EE; --c1-sh: rgba(51,85,238,0.45);
    --c3-a:#5FE0A8; --c3-b:#17A863; --c3-sh: rgba(23,168,99,0.4);
    --c2-b:#E5484D;

    --correct-bg:#E6F8EE;
    --correct-ink:#128A54;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 64px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    margin-bottom:22px;
    border-bottom:1.5px solid rgba(19,33,59,0.14);
  }
  .kicker{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.55;
  }
  .kicker.tag{opacity:.4;}

  h1{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:clamp(26px,6vw,38px);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 8px;
    text-transform:uppercase;
  }
  h1 .hl{color:var(--c1-b);}
  .sub{color:var(--ink-soft);font-size:15px;max-width:60ch;margin:0 0 30px;font-weight:500;}

  .block{
    margin-bottom:46px;
  }
  .block-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin:0 0 4px;
    padding-bottom:12px;
    border-bottom:2px solid rgba(19,33,59,0.14);
  }
  .block-title{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:-0.01em;
    margin:0;
  }
  .block-test-pill{
    display:inline-flex;
    align-items:center;
    gap:7px;
    text-decoration:none;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.01em;
    padding:9px 16px;
    border-radius:999px;
    white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .block-test-pill.ready{
    color:var(--c3-b);
    background:var(--correct-bg);
    cursor:pointer;
  }
  .block-test-pill.ready:hover{
    transform:translateY(-2px);
    box-shadow: 0 10px 20px -14px var(--c3-sh);
  }
  .block-test-pill.soon{
    color:var(--ink-soft);
    background:var(--bg-soft);
    opacity:.7;
    cursor:default;
    pointer-events:none;
  }

  .subgroup{ margin-bottom:26px; margin-top:24px; }
  .subgroup:first-of-type{ margin-top:22px; }
  .subgroup-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin:0 0 14px 2px;
  }
  .subgroup-title{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:14px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--c1-b);
    margin:0;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:5px 14px 5px 12px;
    border-radius:999px;
    background: rgba(51,85,238,0.10);
  }
  .subgroup-title::before{
    content:'';
    width:6px;height:6px;
    border-radius:50%;
    background:var(--c1-b);
  }
  .subgroup-test-pill{
    display:inline-flex;
    align-items:center;
    gap:7px;
    text-decoration:none;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:11.5px;
    letter-spacing:.01em;
    padding:7px 13px;
    border-radius:999px;
    white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .subgroup-test-pill.ready{
    color:var(--c3-b);
    background:var(--correct-bg);
    cursor:pointer;
  }
  .subgroup-test-pill.ready:hover{
    transform:translateY(-2px);
    box-shadow: 0 10px 20px -14px var(--c3-sh);
  }
  .subgroup-test-pill.soon{
    color:var(--ink-soft);
    background:var(--bg-soft);
    opacity:.7;
    cursor:default;
    pointer-events:none;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:14px;
  }

  .card-wrap{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .card{
    background:var(--card);
    border-radius:22px;
    padding:22px 22px 20px;
    box-shadow: 0 14px 30px -24px rgba(19,33,59,0.35);
    text-decoration:none;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    gap:12px;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card.ready:hover{
    transform:translateY(-3px);
    box-shadow: 0 18px 34px -18px rgba(19,33,59,0.4);
  }
  .card.soon{
    opacity:.5;
    cursor:default;
    pointer-events:none;
  }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }

  .tile{
    width:40px;height:40px;min-width:40px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--c1-b);
    background: linear-gradient(150deg, rgba(255,255,255,0.75), rgba(108,140,255,0.22));
    backdrop-filter: blur(6px) saturate(160%);
    -webkit-backdrop-filter: blur(6px) saturate(160%);
    border:1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 12px -7px var(--c1-sh), inset 0 1px 1px rgba(255,255,255,0.8);
  }

  .status{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .status.ready{background:var(--correct-bg);color:var(--correct-ink);}
  .status.soon{background:var(--bg-soft);color:var(--ink-soft);}

  .card-title{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:16.5px;
    line-height:1.32;
    margin:0;
  }
  .card-sub{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
    margin:0;
  }

  /* --- плашка "тест до теми" --- */
  .test-pill{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    text-decoration:none;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12px;
    letter-spacing:.01em;
    padding:9px 14px;
    border-radius:14px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .test-pill.ready{
    color:var(--c3-b);
    background:var(--correct-bg);
    cursor:pointer;
  }
  .test-pill.ready:hover{
    transform:translateY(-2px);
    box-shadow: 0 10px 20px -14px var(--c3-sh);
  }
  .test-pill.soon{
    color:var(--ink-soft);
    background:var(--bg-soft);
    opacity:.6;
    cursor:default;
    pointer-events:none;
  }

  /* --- ДЗ: яскраве світіння --- */
  .test-pill.homework, .block-test-pill.homework, .subgroup-test-pill.homework{
    color:#7A3B00 !important;
    background: linear-gradient(135deg, #FFE27A, #FF9A3D) !important;
    animation: hwGlow 1.6s ease-in-out infinite;
  }
  @keyframes hwGlow{
    0%,100%{ box-shadow: 0 0 6px 0 rgba(255,140,40,0.55); }
    50%{ box-shadow: 0 0 18px 6px rgba(255,140,40,0.85); }
  }
  .hw-badge{
    margin-left:6px;
    font-weight:800;
  }

  footer{
    text-align:center;
    margin-top:36px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }

  .teacher-banner{
    display:none;
    background: var(--c2-b);
    color:#fff;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-align:center;
    padding:9px 14px;
    border-radius:12px;
    margin-bottom:20px;
  }
  body.teacher-mode .teacher-banner{ display:block; }

  .open-badge{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:10.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:999px;
    align-self:flex-start;
    margin-top:-2px;
  }
  .open-badge.open{ background:var(--correct-bg); color:var(--correct-ink); }
  .open-badge.closed{ background:rgba(229,72,77,0.12); color:var(--c2-b); }
</style>
</head>

    <div class="kicker">Навігація</div>

  <div id="blocks"></div>

  <footer>@movoznavka</footer>
</div>

   Кожен item — це один УРОК, і, за бажання, один ТЕСТ до нього:

   {
     icon: "Ф",                 // літера на плитці
     status: "ready"/"soon",    // готовність УРОКУ
     title: "Назва теми",
     desc: "необов'язковий підпис",
     href: "https://.../urok-....html",   // посилання на урок (ПОВНЕ)
     test: {                    // необов'язково — якщо тесту ще нема, просто не пишіть test
       status: "ready"/"soon",
       href: "https://movoznavka.github.io/11class/....html"
     }
   }

   (картка уроку стане сірою й неактивною), а test.status постав "ready" —
   плашка тесту однаково буде клікабельною.

   Щоб додати підрозділ — скопіюй { title: "...", items: [...] }.
   Підрозділ теж може мати свій "загальний тест" — додай йому generalTest
   (той самий формат, що й у блока): { title: "...", generalTest: {...}, items: [...] }.
   Щоб додати розділ — скопіюй { name: "...", subgroups: [...] } у BLOCKS.
   ============================================================ */

const blocksEl = document.getElementById('blocks');

function pillHtml(test){
  if(!test) return '';
  const clickable = test.status === 'ready';
  const label = "📝 Тест до теми";
  return `<a class="test-pill ${test.status}" href="${clickable ? test.href : '#'}" data-testkey="${test.href}">${label}</a>`;
}

function generalTestPillHtml(test){
  if(!test) return '';
  const clickable = test.status === 'ready';
  const label = "📝 Загальний тест";
  return `<a class="block-test-pill ${test.status}" href="${clickable ? test.href : '#'}" data-testkey="${test.href}">${label}</a>`;
}

function subgroupTestPillHtml(test){
  if(!test) return '';
  const clickable = test.status === 'ready';
  const label = "📝 Загальний тест";
  return `<a class="subgroup-test-pill ${test.status}" href="${clickable ? test.href : '#'}" data-testkey="${test.href}">${label}</a>`;
}

function renderBlocks_(){
  blocksEl.innerHTML = BLOCKS.map(block => `
    <div class="block">
      <div class="block-header">
        <h2 class="block-title">${block.name}</h2>
        ${generalTestPillHtml(block.generalTest)}
      </div>
      ${block.subgroups.map(sg => `
        <div class="subgroup">
          ${(sg.title || sg.generalTest) ? `
            <div class="subgroup-header">
              ${sg.title ? `<div class="subgroup-title">${sg.title}</div>` : '<span></span>'}
              ${subgroupTestPillHtml(sg.generalTest)}
            </div>` : ''}
          <div class="grid">
            ${sg.items.map(it => `
              <div class="card-wrap">
                <a class="card ${it.status}" href="${it.status==='soon'?'#':it.href}" data-key="${it.href}">
                  <div class="card-top">
                    <span class="tile">${it.icon}</span>
                    <span class="status ${it.status}">${it.status==='soon'?'Скоро':'Готово'}</span>
                  </div>
                  <p class="card-title">${it.title}</p>
                  ${it.desc?`<p class="card-sub">${it.desc}</p>`:''}
                </a>
                ${pillHtml(it.test)}
              </div>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

// ============================================================
// ДЗ — ЯСКРАВЕ ПОЗНАЧЕННЯ (ПЕРСОНАЛЬНО ДЛЯ КОЖНОГО УЧНЯ)
// Тут вказуєте посилання вашого Apps Script (те саме, що для бота),
// закінчується на /exec. Керуєте позначками ДЗ прямо в Telegram-боті
// командою /дз (там спершу обираєте учня) — код нижче лише зчитує,
// що призначено САМЕ ЦЬОМУ учню (за кодом ?u=...), і підсвічує пілюлі
// тільки на його сторінці.
// ============================================================
const HOMEWORK_API_URL = "https://script.google.com/macros/s/AKfycbyDGcDVtwD0L8WW0zDIsXwYwwf6zp4XzmofzdI0wU-AhhfZIXbH2lOHquNSHI8cKRc7/exec";

let _lastHomeworkMap = null;
function applyHomework(map){
  map = map || {};
  _lastHomeworkMap = map;
  document.querySelectorAll('[data-testkey]').forEach(function(el){
    const hw = map[el.getAttribute('data-testkey')];
    if(!hw) return;
    el.classList.add('homework');
    if(!el.querySelector('.hw-badge')){
      const span = document.createElement('span');
      span.className = 'hw-badge';
      span.textContent = ' · ДЗ ' + hw.number;
      el.appendChild(span);
    }
    const hwNum = parseInt(hw.number, 10);
    if (!isNaN(hwNum) && el.getAttribute('href') !== '#') {
      const sep = el.getAttribute('href').indexOf('?') > -1 ? '&' : '?';
      el.setAttribute('href', el.getAttribute('href') + sep + 'hw=' + hwNum);
    }
  });
}

function loadHomework(studentCode){
  if(!HOMEWORK_API_URL || HOMEWORK_API_URL.indexOf('ВСТАВТЕ') === 0) return;
  if(!studentCode) return;
  const sep = HOMEWORK_API_URL.indexOf('?') > -1 ? '&' : '?';
  const s = document.createElement('script');
  s.src = HOMEWORK_API_URL + sep + 'callback=applyHomework&student=' + encodeURIComponent(studentCode);
  document.body.appendChild(s);
}

// ============================================================
// ХТО ЩО БАЧИТЬ
// Код учня (те, що йде після ?u=) — обирайте самі, наприклад ім'я.
// Посилання для учня: .../index.html?u=Maryna
//
// Кожен код відкриває СПИСОК ТЕМ (масив href уроків, як і раніше) —
// а урок і тест до нього показуються/ховаються РАЗОМ, як одна тема.
//
// ВАЖЛИВО: якщо учня немає в цьому списку — посилання НЕ спрацює,
// портал покаже "Це посилання недійсне".
// ============================================================
const STUDENT_ACCESS = {
  "Ліза Настя":   [],
  "Вікторія":   [],
  "Марина Світлана": [],
  "Яна":   [],
  "Віка":   [],
  "Андрій": [],
  "Аня": [],
  "Марія": [],
  "Максим": [],
  "Анастасія": [],
  "Ростислав": [],
  "Вероніка": [],
  "Віолета Софія": [],
  "Саміра": [],
  
  // "код-учня": ["href-теми-1", "href-теми-2"]
};

// ============================================================
// ГРУПОВІ КОДИ (одне посилання — двоє учнів)
// Якщо код є ключем тут — портал спершу спитає, хто саме зайшов,
// і далі підставлятиме ОСОБИСТЕ ім'я і в лінки на уроки/тести,
// і в результати в Telegram — щоб було видно, хто саме що зробив.
// Одиночних учнів сюди додавати не треба.
// ============================================================
const GROUP_MEMBERS = {
  "ліза настя": ["Ліза", "Настя"],
  "марина світлана": ["Марина", "Світлана"],
  "віолета софія": ["Віолета", "Софія"]
};

function normalizeCode(s){
  return (s || '').trim().replace(/\s+/g, ' ').toLowerCase();
}

const NORMALIZED_ACCESS = {};
Object.keys(STUDENT_ACCESS).forEach(function(code){
  NORMALIZED_ACCESS[normalizeCode(code)] = STUDENT_ACCESS[code];
});

// ============================================================
// ЗАВЕРШЕННЯ ВХОДУ УЧНЯ: ховає закриті теми, підвантажує ДЗ,
// і — головне — дописує ?student=Ім'я в кожне посилання на урок,
// щоб сторінка тесту брала ім'я з лінка й не питала його вручну.
// ============================================================
function appendStudentParam_(href, name){
  const sep = href.indexOf('?') > -1 ? '&' : '?';
  return href + sep + 'student=' + encodeURIComponent(name);
}

function applyAccessAndRender_(studentCode, allowed, displayName){
  const desc = document.getElementById('subDesc');
  if (desc) desc.remove();

  document.querySelectorAll('.card-wrap').forEach(function(wrap){
    const card = wrap.querySelector('.card');
    const key = card.getAttribute('data-key');
    if (allowed.indexOf(key) === -1) { wrap.remove(); return; }
    if (card.getAttribute('href') !== '#') {
      card.setAttribute('href', appendStudentParam_(card.getAttribute('href'), displayName));
    }
    const pill = wrap.querySelector('.test-pill');
    if (pill && pill.getAttribute('href') !== '#') {
      pill.setAttribute('href', appendStudentParam_(pill.getAttribute('href'), displayName));
    }
  });
  document.querySelectorAll('.subgroup').forEach(function(sg){
    if (!sg.querySelector('.card')) sg.remove();
  });
  document.querySelectorAll('.block').forEach(function(b){
    if (!b.querySelector('.card')) b.remove();
  });

  document.querySelectorAll('#switchWho').forEach(function(el){ el.closest('p').remove(); });
  if (GROUP_MEMBERS[studentCode]) {
    const who = document.createElement('p');
    who.className = 'sub';
    who.style.cssText = 'margin-top:28px;font-size:13px;';
    who.innerHTML = 'Ви зайшли як <b>' + displayName + '</b>. <a href="#" id="switchWho" style="color:var(--c1-b);">Це не я</a>';
    document.querySelector('.wrap').appendChild(who);
    document.getElementById('switchWho').addEventListener('click', function(e){
      e.preventDefault();
      sessionStorage.removeItem('chosenName_' + studentCode);
      location.reload();
    });
  }
}

// Теми можна відкривати або вручну (STUDENT_ACCESS вище), або через
// бота кнопкою "🔓 Теми". Щоб сторінка не «блимала» (спочатку всі теми,
// потім лише дозволені), спершу одразу й синхронно показуємо статичний
// список — і лише ЯКЩО бот справді відкрив щось додаткове, перемальовуємо
// список ще раз (це рідкісний випадок, і невеличке оновлення тут не заважає).
function finishStudentView_(studentCode, allowedStatic, displayName){
  loadHomework(studentCode);
  applyAccessAndRender_(studentCode, allowedStatic, displayName);

  const stillWaiting = HOMEWORK_API_URL && HOMEWORK_API_URL.indexOf('ВСТАВТЕ') !== 0;
  const blocksEl = document.getElementById('blocks');

  // Якщо після статичного списку карток узагалі не лишилось (весь доступ
  // очікується від бота) — не лишаємо порожню сторінку, а пишемо, що йде
  // завантаження, поки чекаємо відповідь.
  let loadingEl = null;
  if (stillWaiting && !document.querySelector('.card-wrap')) {
    loadingEl = document.createElement('p');
    loadingEl.className = 'sub';
    loadingEl.id = 'accessLoading';
    loadingEl.textContent = 'Завантажуємо ваші теми…';
    document.querySelector('.wrap').insertBefore(loadingEl, blocksEl);
  }

  if (!stillWaiting) return;

  let resolved = false;
  window.applyAccess = function(dynamicList){
    if (resolved) return;
    resolved = true;
    dynamicList = dynamicList || [];
    const extra = dynamicList.filter(function(h){ return allowedStatic.indexOf(h) === -1; });
    if (extra.length > 0) {
      renderBlocks_();
      applyAccessAndRender_(studentCode, allowedStatic.concat(extra), displayName);
      // Перемальовування вище стирає картки разом з уже застосованими
      // позначками ДЗ — застосовуємо їх ще раз на нових картках.
      if (_lastHomeworkMap) applyHomework(_lastHomeworkMap);
    }

    const loader = document.getElementById('accessLoading');
    if (loader) loader.remove();

    if (!document.querySelector('.card-wrap')) {
      const msg = document.createElement('p');
      msg.className = 'sub';
      msg.textContent = 'Поки для вас не відкрито жодної теми. Зверніться до вчительки.';
      document.querySelector('.wrap').insertBefore(msg, blocksEl);
    }
  };

  const sep = HOMEWORK_API_URL.indexOf('?') > -1 ? '&' : '?';
  const s = document.createElement('script');
  s.src = HOMEWORK_API_URL + sep + 'mode=access&callback=applyAccess&student=' + encodeURIComponent(studentCode);
  document.body.appendChild(s);
}

function showNamePicker_(studentCode, allowed, members){
  const blocksEl = document.getElementById('blocks');
  blocksEl.style.display = 'none';
  const desc = document.getElementById('subDesc');
  if (desc) desc.remove();

  const box = document.createElement('div');
  box.id = 'namePicker';
  box.innerHTML = '<p class="sub" style="margin-bottom:18px;">Це спільне посилання. Оберіть, хто зараз проходить тести:</p>';

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;';

  members.forEach(function(name){
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.style.cssText = 'font-family:Manrope,sans-serif;font-weight:800;font-size:16px;padding:18px 30px;border:none;border-radius:16px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 14px 30px -24px rgba(19,33,59,0.35);';
    btn.addEventListener('click', function(){
      sessionStorage.setItem('chosenName_' + studentCode, name);
      box.remove();
      blocksEl.style.display = '';
      finishStudentView_(studentCode, allowed, name);
    });
    row.appendChild(btn);
  });

  box.appendChild(row);
  document.querySelector('.wrap').insertBefore(box, blocksEl);
}

(function(){
  const params = new URLSearchParams(location.search);
  const isTeacher = params.get('vchytel') === '1';
  const studentCode = normalizeCode(params.get('u'));
  const allowed = studentCode ? NORMALIZED_ACCESS[studentCode] : null;

  if (isTeacher) {
    document.body.classList.add('teacher-mode');

    function renderOpenBadges_(dynamicMap){
      dynamicMap = dynamicMap || {};
      document.querySelectorAll('.card').forEach(function(card){
        const key = card.getAttribute('data-key');
        const openFor = Object.keys(STUDENT_ACCESS).filter(function(code){
          const staticOpen = STUDENT_ACCESS[code].indexOf(key) !== -1;
          const dynOpen = (dynamicMap[normalizeCode(code)] || []).indexOf(key) !== -1;
          return staticOpen || dynOpen;
        });
        let badge = card.querySelector('.open-badge');
        if (!badge) {
          badge = document.createElement('span');
          card.appendChild(badge);
        }
        if (openFor.length) {
          badge.className = 'open-badge open';
          badge.textContent = '🔓 Відкрито · ' + openFor.length;
          badge.title = openFor.join(', ');
        } else {
          badge.className = 'open-badge closed';
          badge.textContent = '🔒 нікому не відкрито';
          badge.title = '';
        }
      });
    }

    renderOpenBadges_({});

    if (HOMEWORK_API_URL && HOMEWORK_API_URL.indexOf('ВСТАВТЕ') !== 0) {
      window.applyAllAccess = renderOpenBadges_;
      const sep = HOMEWORK_API_URL.indexOf('?') > -1 ? '&' : '?';
      const s = document.createElement('script');
      s.src = HOMEWORK_API_URL + sep + 'mode=access_all&callback=applyAllAccess';
      document.body.appendChild(s);
    }
    return;
  }

  if (studentCode && allowed) {
    const tag = document.querySelector('.kicker.tag');
    if (tag) tag.remove();

    const members = GROUP_MEMBERS[studentCode];
    if (members) {
      const chosen = sessionStorage.getItem('chosenName_' + studentCode);
      if (chosen && members.indexOf(chosen) !== -1) {
        finishStudentView_(studentCode, allowed, chosen);
      } else {
        showNamePicker_(studentCode, allowed, members);
      }
    } else {
      // одиночний учень — його ім'я і є кодом у посиланні
      finishStudentView_(studentCode, allowed, params.get('u').trim());
    }
  } else {
    const desc = document.getElementById('subDesc');
    if (desc) desc.remove();
    document.querySelectorAll('.block').forEach(function(b){ b.remove(); });
    const msg = document.createElement('p');
    msg.className = 'sub';
    msg.textContent = 'Це посилання недійсне. Зверніться до вчительки за новим.';
    document.querySelector('.wrap').appendChild(msg);
  }
})();
